      setTimeout(()=>{setChokoTyping(true);setTimeout(()=>{setChokoTyping(false);playChokoPop();setChokoMsg(reaction||'new goal! MAX is on it. 🎯');setTimeout(()=>setChokoMsg(null),5000);},700);},400);
    }
    if(connected) try{ await fetch(`${maxUrl}/api/goals`,{method:'POST',headers:authHdrs(),body:JSON.stringify({title,priority:0.7})}); }catch{}
  };

  const doneGoal=async id=>{
    setGoals(g=>g.filter(x=>x.id!==id));
    if(connected) try{ await fetch(`${maxUrl}/api/goals/${id}`,{method:'DELETE',headers:authHdrs(true)}); }catch{}
  };

  const BINARY_EXTS = new Set(['exe','dll','bin','zip','tar','gz','bz2','7z','rar','pdf','db','sqlite','sqlite3','wasm','so','dylib','class','jar','pyc','pyo','o','a','lib']);
  const IMAGE_EXTS  = new Set(['png','jpg','jpeg','gif','webp','ico','bmp','tiff','avif']);

  const openFile=async f=>{
    const path = f.path || f.name;
    const tabName = f.name || path.split('/').pop();
    const ext = (tabName.split('.').pop()||'').toLowerCase();
    if(!openTabs.find(t=>t.name===tabName)) setOpenTabs(ts=>[...ts,{name:tabName, path}]);
    setActiveTab(tabName); setShowPreview(false); setLangOverride(null);
    setPanes(ps => ps.map(p => p.id === activePaneId ? {...p, activeTab: tabName} : p));
    // Binary / image guard
    if (BINARY_EXTS.has(ext)) {
      setFileContents(c=>({...c,[path]:`// Binary file — cannot display in editor\n// ${path}`}));
      return;
    }
    if (IMAGE_EXTS.has(ext)) {
      setFileContents(c=>({...c,[path]:`__IMAGE__:${maxUrl}/api/files/raw?path=${encodeURIComponent(path)}`}));
      return;
    }
    // Load content if not yet loaded, or forceReload=true (e.g. after MAX wrote the file)
    if (connected && (fileContents[path] === undefined || f.forceReload)) {
      const content = await readFile2(path);
      if (content !== null) {
        setFileContents(c => ({...c, [path]: content}));
        // Trigger LSP diagnostics on open for code files
        const lspExts = new Set(['ts','tsx','js','jsx','mjs','cjs','py','go','rs']);
        if (lspExts.has(ext) && socketRef.current?.readyState === WebSocket.OPEN) {
          socketRef.current.send(JSON.stringify({ type: 'buffer_update', filePath: path, content }));
        }
      }
    }
  };
  // Keep refs fresh so SSE/WS handlers (closed over on mount) always see latest state
  openFileRef.current = openFile;
  openTabsRef.current = openTabs;
  // Expose globally so ToolCallBlock (rendered outside App) can navigate to files on click
  window.maxOpenFile = openFile;

  const newFile=()=>{
    const curPath = openTabs.find(t=>t.name===activeTab)?.path || '';
    const dir = curPath.includes('/') ? curPath.slice(0,curPath.lastIndexOf('/')+1) : '';
    const name=prompt('New file name:', dir || 'src/');
    if(!name||!name.trim()) return;
    const n=name.trim().replace(/\\/g,'/');
    const tabName=n.split('/').pop();
    setLangOverride(null);
    if(!openTabs.find(t=>t.name===tabName)) setOpenTabs(ts=>[...ts,{name:tabName,path:n}]);
    setActiveTab(tabName);
    setPanes(ps => ps.map(p => p.id === activePaneId ? {...p, activeTab: tabName} : p));
  };

  const shellRun = async (cmd) => {
    const r = await fetch(`${maxUrl}/api/tools/shell/run`,{method:'POST',headers:authHdrs(),body:JSON.stringify({command:cmd,timeoutMs:8000})});
    return await r.json();
  };

  const renameFile = async (file) => {
    const oldPath = file.path || file.name;
    const oldName = file.name;
    const newName = prompt('Rename to:', oldName);
    if (!newName || newName === oldName) return;
    const newPath = oldPath.replace(oldName, newName);
    const safe = (p) => `"${p.replace(/"/g,'\\"')}"`;
    await shellRun(`node -e "require('fs').renameSync(${JSON.stringify(oldPath)},${JSON.stringify(newPath)})"`);
    // Update open tabs
    setOpenTabs(ts => ts.map(t => t.name===oldName ? {...t, name:newName, path:newPath} : t));
    if (activeTab === oldName) setActiveTab(newName);
    setFileContents(c => { const n={...c}; if(c[oldPath]!==undefined){n[newPath]=c[oldPath]; delete n[oldPath];} return n; });
    listFiles('.').then(f=>f&&setRealFiles(f));
  };

  const deleteFile = async (file) => {
    const path = file.path || file.name;
    if (!window.confirm(`Delete ${file.name}?`)) return;
    await shellRun(`node -e "require('fs').rmSync(${JSON.stringify(path)},{recursive:true,force:true})"`);
    // Close tab if open
    const newTabs = openTabs.filter(t => t.name !== file.name);
    setOpenTabs(newTabs);
    if (activeTab === file.name) setActiveTab(newTabs[newTabs.length-1]?.name||null);
    listFiles('.').then(f=>f&&setRealFiles(f));
  };

  const closeTab=(e,name)=>{
    e.stopPropagation();
    if(unsaved[name] && !window.confirm(`${name} has unsaved changes. Close anyway?`)) return;
    const newTabs=openTabs.filter(t=>t.name!==name);
    setOpenTabs(newTabs);
    setUnsaved(u=>{const n={...u};delete n[name];return n;});
    if(activeTab===name) setActiveTab(newTabs[newTabs.length-1]?.name||null);
    setPanes(ps => ps.map(p => p.activeTab === name ? {...p, activeTab: newTabs[newTabs.length-1]?.name || null} : p));
  };

  const collapseAll=()=>setTreeOpen({});

  useEffect(()=>{
    if(!draggingSidebar) return;
    const onMove = e => setSidebarW(Math.max(160, Math.min(400, sidebarDragW.current + (e.clientX - sidebarDragX.current))));
    const onUp = () => setDraggingSidebar(false);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, [draggingSidebar]);

  useEffect(()=>{
    if(!draggingBottom) return;
    const onMove=e=>setBottomH(Math.max(80,Math.min(400,bottomDragH.current-(e.clientY-bottomDragY.current))));
    const onUp=()=>setDraggingBottom(false);
    window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',onUp);
    return ()=>{ window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); };
  },[draggingBottom]);

  const persona=PERSONAS[maxStatus.persona]||PERSONAS.muse;
  const flattenTree=(arr)=>(arr||[]).flatMap(f=>f.type==='dir'?flattenTree(f.children||[]):[f]);

  const splitPane = () => {
    const id = `p${Date.now()}`;
    setPanes(ps => [...ps, { id, type: 'editor', activeTab }]);
    setActivePaneId(id);
  };

  const closePane = (paneId) => {
    setPanes(ps => {
      if (ps.length <= 1) return ps;
      const next = ps.filter(p => p.id !== paneId);
      if (activePaneId === paneId) {
        const fallback = next[next.length - 1];
        setActivePaneId(fallback.id);
        setActiveTab(fallback.activeTab || activeTab);
      }
      return next;
    });
  };

  const renderPaneContent = (pane) => {
    const paneTab = pane.activeTab || activeTab;
    const paneTabPath = openTabs.find(t => t.name === paneTab)?.path || paneTab || '';
    const edContent = fileContents[paneTabPath] ?? fileContents[paneTab] ?? (DEMO_FILE_CONTENTS[paneTab] || null);
    const showWelcome = !paneTab || (!unsaved[paneTab] && fileContents[paneTabPath || paneTab] == null && !DEMO_FILE_CONTENTS[paneTab]);

    if (showWelcome) {
      return (
        <div className="welcome" style={{position:'absolute',inset:0,zIndex:2,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'var(--s1)'}}>
          <div className="welcome-logo">Maxwell</div>
          <div className="welcome-hint">Open a file or tell MAX what to build →<br/><br/><kbd>Ctrl+K</kbd> palette &nbsp; <kbd>Ctrl+S</kbd> save &nbsp; <kbd>/</kbd> commands</div>
        </div>
      );
    }

    if (typeof edContent === 'string' && edContent.startsWith('__IMAGE__:')) {
      const imgUrl = edContent.slice(10);
      return (
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--s1)',overflow:'auto'}}>
          <img src={imgUrl} alt={paneTab} style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain',borderRadius:4}}
            onError={e=>{e.currentTarget.style.display='none';}}/>
        </div>
      );
    }

    return (
      <div style={{flex:1,overflow:'hidden',position:'relative',display:'flex',flexDirection:'column'}}>
        <MonacoEditor
          key={`${pane.id}:${paneTab}`}
          fileName={paneTab}
          content={edContent ?? ''}
          onChange={content => handleEditorChange(paneTabPath || paneTab, content)}
          langOverride={langOverride}
          diagnostics={lspDiagnostics[paneTabPath || paneTab]}
        />
        {pane.id === activePaneId && (
          <div className={`save-status ${saveStatus==='saved'?'show':''}`}>
            {saveStatus==='saving'?'saving…':'✓ saved'}
          </div>
        )}
      </div>
    );
  };

  const handleAbort = () => {
    if (socketRef.current && socketRef.current.readyState === WebSocket.OPEN) {
      socketRef.current.send(JSON.stringify({ type: 'cancel_request' }));
    }
    setIsThinking(false);
    setStreaming(false);
  };

  return (
    <div className="ide">
      {showSettings && <SettingsModal onClose={()=>setShowSettings(false)} maxUrl={maxUrl} setMaxUrl={setMaxUrl} onOpenSetup={()=>setShowSetup(true)}/>}
      {showSetup && <SetupWizard onDismiss={()=>setShowSetup(false)}/>}
      {showShortcuts && <ShortcutOverlay onClose={()=>setShowShortcuts(false)}/>}
      {showLangPicker && activeTab && (
        <LangPicker
          current={langOverride || getMonacoLanguage(activeTab)}
          onSelect={lang=>{ setLangOverride(lang); setShowLangPicker(false); }}
          onClose={()=>setShowLangPicker(false)}
        />
      )}
      {showDiff && (
        <DiffViewer
          fileName={showDiff.fileName}
          original={showDiff.original}
          modified={showDiff.modified}
          onAccept={()=>{
            if(showDiff.pendingId) setPendingChanges(ps=>ps.map(p=>p.id===showDiff.pendingId?{...p,status:'accepted'}:p));
            setShowDiff(null);
          }}
          onReject={()=>{
            if(showDiff.pendingId) setPendingChanges(ps=>ps.map(p=>p.id===showDiff.pendingId?{...p,status:'rejected'}:p));
            setShowDiff(null);
          }}
          onClose={()=>setShowDiff(null)}
        />
      )}
      {(chokoMsg || chokoTyping) && (
        <ChokoToast
          msg={chokoMsg}
          typing={chokoTyping}
          onClose={()=>{setChokoMsg(null);setChokoTyping(false);}}
          onSendToMax={chokoMsg ? async ()=>{
            // Queue current Choko message as a MAX goal
            const goalTitle = 'Choko spotted: ' + chokoMsg.replace(/[^ws~!?.,]/g,'').trim().slice(0,80);
            setMessages(m=>[...m,{id:nextMsgId(),role:'max',persona:'muse',modelTier:'fast',
              text:'Choko queued a task for me~ 🍫 Looking into: **' + chokoMsg.replace(/[^ws~!?,.-]/g,'').slice(0,60) + '**'}]);
            setChokoMsg(null);
            if(connected){
              try{ await fetch(maxUrl+'/api/goals',{method:'POST',headers:authHdrs(),body:JSON.stringify({title:goalTitle,priority:0.6})}); }catch{}
            }
          } : undefined}
        />
      )}
      {/* ── Persistent Floating Choko Mascot Button ── */}
      {!chokoMsg && !chokoTyping && viewMode !== 'preview' && (
        <div 
          className="choko-docked-pet"
          onClick={()=>{
            playChokoPop();
            setChokoTyping(true);
            setTimeout(()=>{
              setChokoTyping(false);
              const quotes = [
                "scout report: all systems nominal! 🐾 click my hat to switch my outfit! ✨",
                "ready for action! MAX and I are keeping your codebase safe. 🌰",
                "strawberry, matcha, hazelnut or deep cacao? which hat do you like best? 🎀",
                "tip: split mode lets you preview your code live while MAX works! ◫",
                "psst! Barry, i found some clean code patterns today! 🍫"
              ];
              setChokoMsg(quotes[Math.floor(Math.random()*quotes.length)]);
              setTimeout(()=>setChokoMsg(null), 8000);
            }, 600);
          }}
          title="Choko 🐾 — Click to summon your calico scout!"
        >
          <div className="choko-sparkles-overlay">
            <span className="choko-sparkle s1">✨</span>
            <span className="choko-sparkle s2">✦</span>
          </div>
          <img src="/assets/choko_hazelnut.jpg" alt="Choko" className="choko-docked-img" />
        </div>
      )}
      {showPalette && (
        <CommandPalette
          files={realFiles && realFiles.length > 0 ? realFiles : DEMO_FILES}
          onOpenFile={f=>{openFile(f);setShowPreview(false);}}
          onRunCmd={cmd=>{
            if(cmd==='swarm') setChatMode('swarm');
            else if(cmd==='debate') setChatMode('debate');
            else { setInput('/'+cmd); setTimeout(()=>sendMessage('/'+cmd),100); }
          }}
          onClose={()=>setShowPalette(false)}
        />
      )}
      {contextMenu && (
        <ContextMenu
          menu={contextMenu}
          onClose={()=>setContextMenu(null)}
          onRename={renameFile}
          onDelete={deleteFile}
          onCopyPath={()=>navigator.clipboard?.writeText(contextMenu.file.path||contextMenu.file.name)}
          onNewFileHere={dirFile=>{
            const dir=(dirFile.path||dirFile.name).replace(/\\/g,'/')+'/';
            const name=prompt('New file name:',dir);
            if(!name||!name.trim()) return;
            const n=name.trim().replace(/\\/g,'/');
            const tabName=n.split('/').pop();
            setLangOverride(null);
            if(!openTabs.find(t=>t.name===tabName)) setOpenTabs(ts=>[...ts,{name:tabName,path:n}]);
            setActiveTab(tabName);
          }}
        />
      )}

      {/* ── Title bar ── */}
      <div className="titlebar" style={{position:'relative'}}>
        <div className="titlebar-drag">
          <div className="tb-logo" style={{letterSpacing:2,fontSize:13}}>Maxwell</div>
          <div className="tb-sep"/>
          <div className="tb-project" style={{cursor:'pointer'}} onClick={()=>setShowPalette(true)} title="Ctrl+K">
            <span style={{display:'flex',color:'var(--muted)'}}>{ICONS.folder}</span>
            <span>{connected && cwd && cwd !== '.' ? cwd.split(/[/\\]/).pop() || cwd : 'Maxwell'}</span>
            <span style={{fontSize:10,color:'var(--muted2)',fontFamily:'var(--mono)',marginLeft:4}}>⌘K</span>
          </div>
          <div style={{width:1,height:16,background:'var(--border)',margin:'0 8px'}}/>
          <ModelPicker
            selectedOption={selectedOption}
            onSelect={setSelectedOption}
            credits={credits}
            brainState={brainState}
          />
        </div>
        {/* Centered toggle */}
        <div style={{position:'absolute',left:'50%',transform:'translateX(-50%)'}}>
          <div className="view-toggle">
            <button className={`view-toggle-btn ${viewMode==='code'?'on-code':'off'}`} onClick={()=>{setViewMode('code');setBubbleOpen(false);}}>
              <span style={{display:'flex'}}>{ICONS.code}</span> Code
            </button>
            <button className={`view-toggle-btn ${viewMode==='split'?'on-split':'off'}`} onClick={()=>{setViewMode('split');setBubbleOpen(false);}}>
              <span style={{display:'flex',fontSize:13}}>◫</span> Split
            </button>
            <button className={`view-toggle-btn ${viewMode==='preview'?'on-preview':'off'}`} onClick={()=>setViewMode('preview')}>
              <span style={{display:'flex'}}>{ICONS.globe}</span> Preview
            </button>
          </div>
        </div>
        <div className="tb-status">
          <PersonaPicker persona={persona} maxUrl={maxUrl} setMaxStatus={setMaxStatus} authHdrs={authHdrs}
            onMuse={enterMuseMode}
            onLeaveMuse={exitMuseMode}
          />

          <div className="tb-sep"/>
          <div className={`soma-pill${somaStatus.connected ? ' live' : ''}`} title={somaStatus.connected ? `SOMA connected${somaStatus.signalConnected ? ' · signal bridge live' : ''}` : 'SOMA offline'}>
            <div className="soma-dot"/>
            <span>SOMA</span>
          </div>
          <div className="tb-sep"/>
          <div className="conn-dot" style={connected?{background:'var(--green)',boxShadow:'0 0 6px rgba(16,185,129,.6)',animation:'pulse 2.5s infinite'}:{background:'var(--muted2)'}}/>
        </div>
      </div>

      {/* ── Full-screen preview ── */}
      {viewMode==='preview' && (
        <>
          <div className="preview-fullscreen">
            <PreviewPane 
              sendMessage={sendMessage} 
              activeTab={activeTab} 
              isSplit={false} 
              onCloseSplit={()=>setViewMode('code')}
            />
          </div>
          <div className="float-bubble">
            {bubbleOpen && (
              <div className="float-window">
                <div className="fw-header">
                  <span style={{color:persona.color,fontFamily:'var(--mono)',fontSize:16}}>{persona.icon}</span>
                  <span className="fw-title">MAX</span>
                  <span style={{fontSize:11,color:persona.color,fontWeight:600}}>{persona.label}</span>
                  <button className="fw-close" onClick={()=>setBubbleOpen(false)} style={{display:'flex'}}>{ICONS.close}</button>
                </div>
                <div className="fw-messages">
                  {messages.slice(-8).map(msg=>{
                    if (!msg) return null;
                    const isUser = msg.role === 'user';
                    const p2 = (msg.persona && PERSONAS?.[msg.persona]) || PERSONAS?.muse || { icon: '⚡', color: 'var(--accent)' };
                    const rawText = typeof msg.text === 'string' ? msg.text : typeof msg.content === 'string' ? msg.content : (msg.details || msg.result || '');
                    const preview = (rawText || '').replace(/```[\s\S]*?```/g, '[code]').slice(0, 220);
                    return (
                      <div key={msg.id || Math.random()} style={{display:'flex',flexDirection:isUser?'row-reverse':'row',gap:6,alignItems:'flex-start'}}>
                        <div style={{width:22,height:22,borderRadius:6,background:isUser?'var(--accent)':'var(--s3)',border:isUser?'none':'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:isUser?9:14,fontWeight:'bold',color:isUser?'#fff':(p2.color||'var(--accent)'),flexShrink:0,marginTop:1,fontFamily:'var(--mono)'}}>
                          {isUser?'YOU':(p2.icon||'⚡')}
                        </div>
                        <div style={{background:isUser?'#1e1040':'var(--s2)',border:'1px solid '+(isUser?'#3d1f80':'var(--border)'),borderRadius:isUser?'7px 2px 7px 7px':'2px 7px 7px 7px',padding:'6px 10px',fontSize:11.5,lineHeight:1.6,maxWidth:'82%',wordBreak:'break-word'}}>
                          {preview}{rawText.length>220?'…':''}
                        </div>
                      </div>
                    );
                  })}
                  {isThinking&&(
                    <div style={{display:'flex',gap:6,alignItems:'center'}}>
                      <div style={{width:22,height:22,borderRadius:6,background:'var(--s3)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:persona.color,fontFamily:'var(--mono)'}}>{persona.icon}</div>
                      <div style={{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'2px 7px 7px 7px',padding:'8px 10px'}}>
                        <div className="thinking-dots"><span/><span/><span/></div>
                      </div>
                    </div>
                  )}
                </div>
                <div className="fw-input-row">
                  <textarea className="fw-input" rows={1} placeholder="Ask MAX…" value={bubbleInput}
                    onChange={e=>setBubbleInput(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const t=bubbleInput.trim();if(t){setBubbleInput('');sendMessage(t);}}}}
                  />
                  <button className="fw-send" disabled={isThinking||!bubbleInput.trim()} style={{display:'flex',alignItems:'center',justifyContent:'center'}}
                    onClick={()=>{const t=bubbleInput.trim();if(t){setBubbleInput('');sendMessage(t);}}}
                  >{ICONS.send}</button>
                </div>
              </div>
            )}
            <button className={`float-fab${bubbleOpen?' open':''}${isThinking?' thinking-fab':''}`} onClick={()=>setBubbleOpen(o=>!o)}>
              <img src="/assets/max-avatar.png" alt=""/>
            </button>
          </div>
        </>
      )}

      {/* ── Body (IDE mode) ── */}
      <div className="ide-body" style={{display:showPreview?'none':'flex'}}>
        {/* Activity bar */}
        <div className="actbar">
          {[
            {id:'files',  icon:ICONS.file,   title:'Explorer'},
            {id:'search', icon:ICONS.search, title:'Search'},
          ].map(item=>(
            <button key={item.id} className={`act-btn ${sideTab===item.id&&sidebarOpen?'active':''}`} title={item.title}
              onClick={()=>{ if(sideTab===item.id&&sidebarOpen){setSidebarOpen(false);}else{setSideTab(item.id);setSidebarOpen(true);} }}>
              {item.icon}
            </button>
          ))}
          <button className={`act-btn ${sideTab==='goals'&&sidebarOpen?'active':''}`} title="Goals"
            onClick={()=>{ if(sideTab==='goals'&&sidebarOpen){setSidebarOpen(false);}else{setSideTab('goals');setSidebarOpen(true);} }}>
            {ICONS.target}
            {goals.length>0&&<span className="act-badge"/>}
          </button>
          <button className={`act-btn ${sideTab==='git'&&sidebarOpen?'active':''}`} title="Source Control"
            onClick={()=>{ if(sideTab==='git'&&sidebarOpen){setSidebarOpen(false);}else{setSideTab('git');setSidebarOpen(true);} }}>
            {ICONS.git}
            {gitChangedCount>0&&<span className="act-badge" style={{background:'var(--amber)'}}/>}
          </button>
          <button className={`act-btn ${sideTab==='graph'&&sidebarOpen?'active':''}`} title="Agent Timeline"
            onClick={()=>{ if(sideTab==='graph'&&sidebarOpen){setSidebarOpen(false);}else{setSideTab('graph');setSidebarOpen(true);} }}>
            {ICONS.graph}
          </button>
          <button className={`act-btn ${sideTab==='observability'&&sidebarOpen?'active':''}`} title="Observability Matrix"
            onClick={()=>{ if(sideTab==='observability'&&sidebarOpen){setSidebarOpen(false);}else{setSideTab('observability');setSidebarOpen(true);} }}>
            {ICONS.observability}
          </button>
          <div className="act-spacer"/>
          <button className="act-btn" title="Settings" onClick={()=>setShowSettings(true)}>{ICONS.settings}</button>
        </div>

        {/* Sidebar */}
        <div className={`sidebar ${!sidebarOpen?'collapsed':''}`} style={{width:sidebarOpen?sidebarW:0}}>
          {sideTab==='files'&&(
            <>
              <div className="sb-header">
                <span>Explorer</span>
                <div className="sb-actions">
                  <button className="sb-icon-btn" title="New file" onClick={newFile}>{ICONS.plus}</button>
                  <button className="sb-icon-btn" title="New folder" onClick={async()=>{
                    const n=prompt('Folder name:'); if(!n||!n.trim()) return;
                    const safeName=n.trim().replace(/['"\\]/g,'');
                    try{
                      await fetch(`${maxUrl}/api/tools/shell/run`,{method:'POST',headers:authHdrs(),
                        body:JSON.stringify({command:`node -e "require('fs').mkdirSync('${safeName}',{recursive:true})"`,timeoutMs:5000})});
                      listFiles('.').then(f=>f&&setRealFiles(f));
                    }catch(err){alert('Failed to create folder: '+err.message);}
                  }}>{ICONS.newFolder}</button>
                  <button className="sb-icon-btn" title="Collapse all" onClick={collapseAll}>{ICONS.collapse}</button>
                </div>
              </div>
              <div className="sb-scroll">
                <div className="tree-group">
                  <div className="tree-group-label" style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingRight:8}}>
                    <span>{connected && realFiles ? cwd : 'my-fullstack-app'}</span>
                    {connected && <button className="sb-icon-btn" onClick={()=>listFiles('.').then(f=>f&&setRealFiles(f))} title="Refresh">{ICONS.reload}</button>}
                  </div>
                  {!realFiles && <FileTree files={DEMO_FILES} activeFile={activeTab} onOpen={openFile} treeOpen={treeOpen} setTreeOpen={setTreeOpen} onContextMenu={(e,f)=>setContextMenu({x:e.clientX,y:e.clientY,file:f})}/>}
                  {realFiles && realFiles.length === 0 && <div className="tree-loading">{ICONS.reload} Loading files…</div>}
                  {realFiles && realFiles.length > 0 && <FileTree files={realFiles} activeFile={activeTab} onOpen={openFile} treeOpen={treeOpen} setTreeOpen={setTreeOpen} onContextMenu={(e,f)=>setContextMenu({x:e.clientX,y:e.clientY,file:f})}/>}
                </div>
              </div>
            </>
          )}
          {sideTab==='search'&&(
            <FindInFiles connected={connected} maxUrl={maxUrl} onOpenFile={openFile} onClose={()=>setSidebarOpen(false)}/>
          )}
          {sideTab==='goals'&&(
            <>
              <div className="sb-header">
                <span>MAX Goals</span>
                <span style={{color:'var(--accent2)',fontSize:12,fontWeight:700}}>{goals.length}</span>
              </div>
              <div className="sb-scroll">
                {goals.length===0&&<div style={{padding:'16px 12px',fontSize:11.5,color:'var(--muted)',textAlign:'center'}}>No active goals.</div>}
                {goals.map(g=>(
                  <div key={g.id} className="goal-item">
                    <div className="goal-dot"/>
                    <span className="goal-text">{g.title}</span>
                    <button className="goal-done-btn" title="Mark done" onClick={()=>doneGoal(g.id)} style={{display:'flex'}}>{ICONS.check}</button>
                  </div>
                ))}
              </div>
              <div className="add-goal-form">
                <input className="add-goal-input" placeholder="Add a goal…" value={newGoal} onChange={e=>setNewGoal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addGoal()}/>
                <button className="add-goal-btn" onClick={addGoal} style={{display:'flex',alignItems:'center'}}>{ICONS.plus}</button>
              </div>
            </>
          )}
          {sideTab==='git'&&(
            <GitPanel
              connected={connected} maxUrl={maxUrl}
              gitStaged={gitStaged} setGitStaged={setGitStaged}
              openFile={openFile}
              onChangedCount={setGitChangedCount}
              onRunInTerminal={cmd=>{setBottomTab('terminal');setShowBottom(true);runCommand(cmd);}}
            />
          )}
          {sideTab==='graph'&&(
            <AgentTimeline connected={connected} maxUrl={maxUrl} messages={messages}/>
          )}
          {sideTab==='observability'&&(
            <ObservabilityView 
              pagingLog={pagingLog} 
              groundingLog={groundingLog} 
              evolutionLog={evolutionLog} 
              swarmState={swarmState}
            />
          )}
        </div>

        {/* Sidebar resize handle */}
        {sidebarOpen && (
          <div className="sidebar-resize" onMouseDown={e=>{setDraggingSidebar(true);sidebarDragX.current=e.clientX;sidebarDragW.current=sidebarW;}}/>
        )}

        {/* Editor pane */}
        <div className="editor-pane">
          {/* Pending changes banner */}
          {pendingChanges.filter(p=>p.status==='pending').length > 0 && (
            <div className="changes-banner">
              <div className="cb-label">
                <span style={{display:'flex'}}>{ICONS.warning}</span>
                {pendingChanges.filter(p=>p.status==='pending').length} pending {pendingChanges.filter(p=>p.status==='pending').length===1?'change':'changes'} from MAX
              </div>
              <button className="cb-accept-all" onClick={()=>{setPendingChanges(ps=>ps.map(p=>p.status==='pending'?{...p,status:'accepted'}:p));playAccept();setTimeout(()=>{setChokoTyping(true);setTimeout(()=>{setChokoTyping(false);playChokoPop();setChokoMsg("all changes accepted! MAX's code is live now. 🎉");setTimeout(()=>setChokoMsg(null),6000);},800);},300);}}>
                Accept All
              </button>
              <button className="cb-reject-all" onClick={()=>setPendingChanges(ps=>ps.map(p=>p.status==='pending'?{...p,status:'rejected'}:p))}>
                Reject All
              </button>
            </div>
          )}
          <div className="tabs-bar">
            {openTabs.map(t=>(
              <div key={t.name} className={`tab ${activeTab===t.name?'active':''}`} onClick={()=>setActiveTab(t.name)}>
                <span className="tab-icon">{fileIcon(t.name)}</span>
                {t.name}
                {unsaved[t.name]
                  ? <span className="tab-dot" title="Unsaved changes"/>
                  : <span className="tab-close" onClick={e=>closeTab(e,t.name)} style={{display:'flex',alignItems:'center',justifyContent:'center'}}>{ICONS.close}</span>
                }
              </div>
            ))}
            {openTabs.length===0&&<span className="tab-welcome">Open a file</span>}
          </div>
          <div style={{flex:1,overflow:'hidden',position:'relative',display:'flex',flexDirection:'column'}}>
            <SplitGrid
              panes={panes}
              activePaneId={activePaneId}
              onPaneClick={setActivePaneId}
              renderPaneContent={renderPaneContent}
              onClosePane={closePane}
              openTabs={openTabs}
              unsaved={unsaved}
              fileIcon={fileIcon}
              onTabSelect={(paneId, name) => {
                setPanes(ps=>ps.map(p=>p.id===paneId?{...p,activeTab:name}:p));
                setActivePaneId(paneId);
              }}
              onTabClose={name=>closeTab({stopPropagation:()=>{}}, name)}
            />
          </div>
          {showBottom && (
            <div className="bottom-panel" style={{height:bottomH}}>
              <div className="bp-resize" onMouseDown={e=>{setDraggingBottom(true);bottomDragY.current=e.clientY;bottomDragH.current=bottomH;}}/>
              <div className="bp-tabs">
                <div className={`bp-tab ${bottomTab==='terminal'?'active':''}`} onClick={()=>setBottomTab('terminal')}>{ICONS.terminal}&nbsp; Terminal</div>
                <div className={`bp-tab ${bottomTab==='output'?'active':''}`} onClick={()=>setBottomTab('output')}>Output</div>
                <div className={`bp-tab ${bottomTab==='problems'?'active':''}`} onClick={()=>{setBottomTab('problems');if(connected&&problemLines===null)runProblemsCheck();}}>{ICONS.warning}&nbsp; Problems{problemCount>0&&<span style={{marginLeft:4,color:'var(--red)',fontWeight:700}}>{problemCount}</span>}</div>
                <button className="sb-icon-btn bp-close" style={{display:'flex'}} onClick={()=>setShowBottom(false)}>{ICONS.close}</button>
              </div>
              {/* Terminal tab */}
              {bottomTab==='terminal' && (()=>{
                const at = getActiveTerm();
                return <>
                  {/* Terminal instance tabs */}
                  <div className="term-tab-bar">
                    {terminals.map(t=>(
                      <div key={t.id} className={`term-tab ${t.id===activeTermId?'active':''}`}
                           onClick={()=>setActiveTermId(t.id)}>
                        {ICONS.terminal}&nbsp;{t.name}
                        {terminals.length>1 && (
                          <span className="term-tab-close"
                                onClick={e=>{e.stopPropagation();closeTerminal(t.id);}}
                                style={{display:'flex',alignItems:'center',justifyContent:'center'}}>✕</span>
                        )}
                      </div>
                    ))}
                    <div className="term-tab-add" onClick={addTerminal} title="New terminal">+</div>
                  </div>
                  <div className="terminal-body" ref={termBodyRef} onClick={()=>termInputRef.current?.focus()}>
                    {at.lines.map(l=>(
                      <div key={l.id} className="term-line">
                        {l.type==='prompt'&&<><span className="term-prompt">❯</span><span className="term-cmd">{l.text}</span></>}
                        {l.type==='out' &&<span className="term-out">{l.text}</span>}
                        {l.type==='ok'  &&<span className="term-ok">{l.text}</span>}
                        {l.type==='err' &&<span className="term-err">{l.text}</span>}
                        {l.type==='info'&&<span className="term-info">{l.text}</span>}
                        {l.type==='explain'&&<span className="term-explain">⚡ {l.text}</span>}
                      </div>
                    ))}
                    {at.running && <div className="term-line"><span className="term-info"><span className="term-spinner">◌</span> running…</span></div>}
                  </div>
                  <div className="term-input-row">
                    <span className="term-prompt">❯</span>
                    <input ref={termInputRef} className="term-input"
                      placeholder={connected?"Run a command…":"Run a command… (demo mode)"}
                      value={at.input}
                      onChange={e=>updateTerm(activeTermId,()=>({input:e.target.value}))}
                      onKeyDown={e=>{
                        if(e.key==='Enter'){e.preventDefault();runCommand(at.input);}
                        if(e.key==='ArrowUp'){e.preventDefault();const nx=Math.min(at.histIdx+1,at.history.length-1);updateTerm(activeTermId,()=>({histIdx:nx,input:at.history[nx]||''}));}
                        if(e.key==='ArrowDown'){e.preventDefault();const nx=Math.max(at.histIdx-1,-1);updateTerm(activeTermId,()=>({histIdx:nx,input:nx===-1?'':at.history[nx]||''}));}
                        if(e.key==='l'&&e.ctrlKey){e.preventDefault();updateTerm(activeTermId,()=>({lines:[]}));}
                      }}
                      disabled={at.running} autoComplete="off" spellCheck="false"
                    />
                    {at.running&&<span className="term-spinner" style={{color:'var(--amber)',fontSize:13}}>◌</span>}
                  </div>
                </>;
              })()}
              {/* Output tab */}
              {bottomTab==='output' && (
                <div className="terminal-body">
                  {outputLines.length===0 && !connected && <div className="term-line"><span className="term-out">MAX offline — start with <code>node launcher.mjs --mode api</code></span></div>}
                  {outputLines.length===0 && connected && <div className="term-line"><span className="term-out">Loading…</span></div>}
                  {outputLines.map((l,i)=>(
                    <div key={i} className="term-line">
                      <span className={`term-${l.type||'out'}`}>{l.text}</span>
                    </div>
                  ))}
                </div>
              )}
              {/* Problems tab */}
              {bottomTab==='problems' && (
                <div className="terminal-body">
                  {problemLines===null && (
                    <div className="term-line">
                      <span className="term-out">{connected?'Click to check…':'MAX offline'}</span>
                      {connected && <button style={{marginLeft:8,padding:'1px 8px',fontSize:11,background:'var(--s3)',border:'1px solid var(--border)',borderRadius:4,color:'var(--text)',cursor:'pointer'}} onClick={runProblemsCheck}>Run check</button>}
                    </div>
                  )}
                  {problemLines!==null && problemLines.length===0 && <div className="term-line"><span className="term-info">Checking…</span></div>}
                  {(problemLines||[]).map((l,i)=>(
                    <div key={i} className="term-line">
                      <span className={`term-${l.type||'out'}`}>{l.type==='err'?'✕ ':l.type==='info'?'ℹ ':''}{l.text}</span>
                    </div>
                  ))}
                  {problemLines!==null && problemLines.length>0 && (
                    <div className="term-line" style={{marginTop:4}}>
                      <button style={{padding:'1px 8px',fontSize:11,background:'var(--s3)',border:'1px solid var(--border)',borderRadius:4,color:'var(--muted)',cursor:'pointer'}} onClick={()=>{setProblemLines(null);setProblemCount(0);runProblemsCheck();}}>Re-check</button>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
          {!showBottom&&(
            <div style={{borderTop:'1px solid var(--border)',padding:'0 12px',height:28,display:'flex',alignItems:'center',gap:8,background:'var(--s1)',flexShrink:0}}>
              <button className="bp-tab" style={{border:'none',background:'transparent',cursor:'pointer',display:'flex',alignItems:'center',gap:5}} onClick={()=>setShowBottom(true)}>
                {ICONS.terminal} Terminal
              </button>
            </div>
          )}
        </div>

        {/* ── Split Preview Live Canvas ── */}
        {viewMode === 'split' && (
          <div className="split-preview-pane">
            <PreviewPane 
              sendMessage={sendMessage} 
              activeTab={activeTab} 
              isSplit={true} 
              onCloseSplit={()=>setViewMode('code')}
            />
          </div>
        )}

        {/* ── MAX chat panel ── */}
        <div className="max-panel">
          <div className="mp-header">
            <div className="mp-title">MAX</div>
            <div style={{flex:1}}/>
            <div className="mp-mode">
              <button className={`mp-mode-btn ${chatMode==='swarm'?'active':''}`} onClick={()=>setChatMode(m=>m==='swarm'?null:'swarm')}>
                <span style={{display:'inline-flex',verticalAlign:'middle',marginRight:3}}>{ICONS.bolt}</span> Swarm
              </button>
              <button className={`mp-mode-btn ${chatMode==='debate'?'active':''}`} onClick={()=>setChatMode(m=>m==='debate'?null:'debate')}>
                ⚖ Debate
              </button>
            </div>
          </div>
          {/* Token savings bar */}
          <div className="savings-bar">
            <span className="sb-saved">{ICONS.bolt} {savings.totalLocal} local</span>
            <div className="sb-track"><div className="sb-fill" style={{width:(savings.totalAll>0?(savings.totalLocal/savings.totalAll*100):0)+'%'}}/></div>
            <span className="sb-label">{savings.totalAll>0?Math.round(savings.totalLocal/savings.totalAll*100):0}% free</span>
          </div>
          {insight&&(
            <div style={{padding:'6px 14px',flexShrink:0}}>
              <div className="insight"><div className="ins-label">Insight</div>{insight}</div>
            </div>
          )}
          <div className="mp-messages" ref={chatContainerRef} onScroll={handleChatScroll}>
            {messages.map(msg=>
              msg.role==='activity'
                ? <AgentActivityMessage key={msg.id} msg={msg}/>
                : msg.role==='clarification'
                  ? <ClarificationCard key={msg.id} msg={msg} maxUrl={maxUrl}
                      onAnswered={id=>setMessages(m=>m.map(x=>x.id===id?{...x,answered:true}:x))}/>
                  : msg.role==='approval'
                    ? <ApprovalCard key={msg.id} msg={msg} maxUrl={maxUrl}
                        onResolved={id=>setMessages(m=>m.map(x=>x.id===id?{...x,resolved:true}:x))}/>
                    : <MaxMsg key={msg.id} msg={msg} pendingChanges={pendingChanges} setPendingChanges={setPendingChanges} setActiveTab={setActiveTab}/>
            )}
            {isThinking && <Thinking label={thinkLabel} onAbort={handleAbort}/>}
            <div ref={messagesEndRef}/>
          </div>

          <AgentTaskBar task={agentTask}/>
          {!connected&&(
            <div style={{padding:'6px 14px',flexShrink:0}}>
              <div style={{background:'rgba(239,68,68,.08)',border:'1px solid rgba(239,68,68,.2)',borderRadius:6,padding:'6px 10px',fontSize:11.5,color:'var(--muted)',display:'flex',alignItems:'center',gap:6}}>
                <span style={{color:'var(--red)',display:'flex'}}>{ICONS.dot}</span>
                MAX offline — <code style={{background:'var(--s3)',padding:'1px 4px',borderRadius:3,color:'var(--text)',fontFamily:'var(--mono)',fontSize:10.5}}>node launcher.mjs --mode api</code>
              </div>
            </div>
          )}
          <div className="mp-input-wrap" style={{position:'relative'}}>
            {chatMode&&(
              <div className="cmd-mode-badge">
                {chatMode==='swarm'?<span style={{display:'inline-flex'}}>{ICONS.bolt}</span>:'⚖'} {chatMode.toUpperCase()}
                <button onClick={()=>setChatMode(null)} style={{display:'flex'}}>{ICONS.close}</button>
              </div>
            )}
            {slashSuggestions.length>0&&(
              <div className="slash-picker">
                {slashSuggestions.map((s,i)=>(
                  <div key={s.cmd} className={`slash-item ${i===slashIdx?'sel':''}`} onMouseDown={()=>{setInput(s.cmd+' ');setSlashSuggestions([]);inputRef.current?.focus();}}>
                    <span className="sc-cmd">{s.cmd}</span>
                    <span className="sc-desc">{s.desc}</span>
                  </div>
                ))}
              </div>
            )}
            {mentions.length > 0 && (
              <div className="mention-chips">
                {mentions.map(m=>(
                  <span key={m.value} className="mention-badge">
                    📄 {m.value.split('/').pop()}
                    <span style={{cursor:'pointer',marginLeft:2,opacity:.7}} onClick={()=>setMentions(ms=>ms.filter(x=>x.value!==m.value))}>×</span>
                  </span>
                ))}
              </div>
            )}
            <div className="input-row" style={{position:'relative'}}>
              {atPicker?.matches?.length > 0 && (
                <div className="at-picker">
                  {atPicker.matches.map((f,i)=>(
                    <div key={f} className={`at-item ${i===atPickerIdx?'active':''}`} onMouseDown={e=>{e.preventDefault();selectAtMention(f);}}>
                      <span className="at-item-icon">📄</span>
                      <span className="at-item-name">{f}</span>
                    </div>
                  ))}
                </div>
              )}
              <textarea ref={inputRef} className="mp-textarea"
                placeholder={chatMode?`${chatMode} mode…`:"Message MAX…"}
                value={input} onChange={handleInputChange} onKeyDown={handleKeyDown} rows={1}
                onInput={e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,110)+'px';}}
              />
              <button className="send-btn" onClick={()=>sendMessage()} disabled={isThinking||!input.trim()} style={{display:'flex',alignItems:'center',justifyContent:'center'}}>
                {ICONS.send}
              </button>
            </div>
          </div>
        </div>
      </div>
      {/* ── Status bar ── */}
      <StatusBar
        connected={connected} maxStatus={maxStatus} goals={goals}
        activeTab={activeTab} saveStatus={saveStatus} gitBranch={gitBranch}
        persona={persona} problemCount={problemCount} langOverride={langOverride}
        onClickGit={()=>{setSideTab('git');setSidebarOpen(true);}}
        onClickGoals={()=>{setSideTab('goals');setSidebarOpen(true);}}
        onClickErrors={()=>{setBottomTab('problems');setShowBottom(true);}}
        onClickMemory={()=>setShowSettings(true)}
        onClickLang={()=>setShowLangPicker(l=>!l)}
        onClickShortcuts={()=>setShowShortcuts(true)}
      />

      {/* ── Muse Mode overlay ── */}
      {museMode && (
        <MuseOverlay
          messages={messages}
          insights={museInsights}
          museState={museState}
          room={museRoom}
          exiting={museExiting}
          isThinking={isThinking}
          onSend={sendMessage}
          onSwitchRoom={(r)=>{ setMuseRoom(r); localStorage.setItem('mx_muse_room',r); }}
          onExit={async ()=>{
            exitMuseMode();
            try {
              await fetch(`${maxUrl}/api/persona`, { method:'POST', headers:authHdrs(), body:JSON.stringify({ persona: 'grinder' }) });
              setMaxStatus(s => ({ ...s, persona: 'grinder' }));
            } catch {}
          }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
