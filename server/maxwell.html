function Icon({ name, size }) {
  const el = ICONS[name];
  if (!el) return null;
  if (!size) return el;
  return React.cloneElement(el, { width:size, height:size });
}

function fileIcon(name) {
  const ext = name.split('.').pop();
  if (['ts','tsx'].includes(ext)) return ICONS.ts;
  if (ext === 'json') return ICONS.json;
  if (ext === 'md')   return ICONS.md;
  if (name === 'package.json') return ICONS.pkg;
  if (ext === 'env')  return ICONS.key;
  return ICONS.file;
}

// ── Syntax highlighting ───────────────────────────────────────
function syntaxHL(code, lang) {
  lang = lang || '';
  var esc = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var jsLangs = ['ts','tsx','js','jsx','typescript','javascript'];
  if (jsLangs.indexOf(lang) !== -1) {
    var src = esc, out = '', i = 0;
    var KWS = 'const,let,var,function,class,return,import,export,from,if,else,for,while,async,await,new,typeof,interface,type,extends,implements,null,undefined,true,false,void,enum,readonly,public,private,protected,static,abstract'.split(',');
    while (i < src.length) {
      var ch = src[i];
      if (ch==='/' && src[i+1]==='/') {
        var e1=src.indexOf('\n',i); if(e1<0) e1=src.length;
        out+='<span class="t-cmt">'+src.slice(i,e1)+'</span>'; i=e1; continue;
      }
      if (ch==='/' && src[i+1]==='*') {
        var e2=src.indexOf('*/',i+2); if(e2<0) e2=src.length-2;
        out+='<span class="t-cmt">'+src.slice(i,e2+2)+'</span>'; i=e2+2; continue;
      }
      if (ch==='"') {
        var j=i+1; while(j<src.length && src[j]!=='"'){if(src[j]==='\\'){j+=2;}else{j++;}} j++;
        out+='<span class="t-str">'+src.slice(i,j)+'</span>'; i=j; continue;
      }
      if (ch==="'") {
        var k=i+1; while(k<src.length && src[k]!=="'"){if(src[k]==='\\'){k+=2;}else{k++;}} k++;
        out+='<span class="t-str">'+src.slice(i,k)+'</span>'; i=k; continue;
      }
      var prev = i>0 && /[a-zA-Z0-9_$]/.test(src[i-1]);
      if (!prev && /[a-zA-Z_$]/.test(ch)) {
        var m=i; while(m<src.length && /[a-zA-Z0-9_$]/.test(src[m])) m++;
        var next = m<src.length && /[a-zA-Z0-9_$]/.test(src[m]);
        var word=src.slice(i,m);
        if (!next && KWS.indexOf(word)!==-1) { out+='<span class="t-kw">'+word+'</span>'; i=m; continue; }
        if (!next && /^[A-Z]/.test(word)) { out+='<span class="t-type">'+word+'</span>'; i=m; continue; }
        out+=word; i=m; continue;
      }
      if (/[0-9]/.test(ch) && (i===0||!/[a-zA-Z_$]/.test(src[i-1]))) {
        var n=i; while(n<src.length && /[0-9.]/.test(src[n])) n++;
        out+='<span class="t-num">'+src.slice(i,n)+'</span>'; i=n; continue;
      }
      out+=ch; i++;
    }
    return out;
  }
  if (lang==='json') {
    return esc
      .replace(/"([^"\\]|\\.)*"(\s*):/g,function(m){var ci=m.lastIndexOf('"')+1;return '<span class="t-prop">'+m.slice(0,ci)+'</span>'+m.slice(ci);})
      .replace(/"([^"\\]|\\.)*"/g,function(m){return '<span class="t-str">'+m+'</span>';})
      .replace(/\b(true|false|null)\b/g,'<span class="t-kw">$1</span>')
      .replace(/\b(\d+\.?\d*)\b/g,'<span class="t-num">$1</span>');
  }
  return esc;
}

              'goals:add':{'icon':'◎','color':'#fb923c'},
            };
            const mk = `${s.tool||''}:${s.toolAction||''}`;
            const tm = toolMeta[mk] || {icon:'⚙',color:'#94a3b8'};
            return (
              <div key={i} className={`atb-step ${s.status}`}>
                <span className="atb-step-icon">
                  {s.status==='running' ? <span style={{display:'inline-block',animation:'tcb-spin .9s linear infinite',fontSize:10}}>⟳</span>

      )}

  );
}

      setState(decision === 'approve' ? 'approved' : 'denied');

  'file:list':    { icon:'📁', verb:'listing',   color:'var(--amber)'  },
  'file:search':  { icon:'🔍', verb:'searching', color:'var(--accent2)'},
  'file:delete':  { icon:'🗑️', verb:'deleting',  color:'var(--red)'    },
  'shell:run':    { icon:'⚡', verb:'running',   color:'var(--amber)'  },
  'shell:start':  { icon:'▶',  verb:'starting',  color:'var(--green)'  },
  'shell:stop':   { icon:'■',  verb:'stopping',  color:'var(--red)'    },

  'goals:add':    { icon:'◎',  verb:'goal',      color:'var(--accent2)'},

function ToolCallBlock({ line, state }) {
  const m = line.match(/^TOOL:([^:]+):([^:]+)(?::(.+))?$/);
  if (!m) return null;
  const [, toolName, action, rawParams] = m;
  const meta = TOOL_META[`${toolName}:${action}`] || { icon:'⚙', verb:action, color:'var(--muted)' };
  let paramText = '';
  let filePath = '';
  if (rawParams) {
    try {
      const p = JSON.parse(rawParams);
      filePath = p.filePath || p.path || '';
      paramText = filePath || p.command || p.query || p.title || p.url || String(Object.values(p)[0]||'');
    } catch { paramText = rawParams.slice(0,80); }
  }
  const isRunning = state === 'running';
  const isFileOp = toolName==='file' && ['read','write','replace'].includes(action) && filePath;
  const handleClick = isFileOp ? ()=>{
    const fp = filePath.replace(/\\/g,'/');
    const name = fp.split('/').pop();
    window.maxOpenFile?.({name, path:fp});
  } : undefined;
  return (
    <div className={`tcb ${isRunning?'tcb-running':state==='error'?'tcb-error':'tcb-done'}`}
      onClick={handleClick} style={isFileOp?{cursor:'pointer'}:{}}>
      <span className="tcb-icon">{meta.icon}</span>
      <span className="tcb-verb" style={{color:meta.color}}>{meta.verb}</span>
      {paramText && <span className="tcb-param">{paramText}</span>}
      <span className="tcb-state">
        {isRunning
          ? <><span className="tcb-spinner">⟳</span><span style={{color:'var(--muted)',fontSize:10,marginLeft:3}}>running</span></>
          : <span style={{color:'var(--green)'}}>✓</span>
        }
      </span>
    </div>
  );
}

// ── Markdown renderer ─────────────────────────────────────────
function MdBlock({ text }) {
  const parts = text.split(/(```(?:\w+)?\n[\s\S]*?```)/g);
  return (
    <>
      {parts.map((part, i) => {
        const m = part.match(/^```(\w*)\n([\s\S]*)```$/);
        if (m) return (
          <pre key={i} style={{marginTop:6,marginBottom:6}}>
            <code dangerouslySetInnerHTML={{ __html: syntaxHL(m[2], m[1]) }} />
          </pre>
        );
        const html = part
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
          .replace(/\*(.+?)\*/g,'<em>$1</em>')
          .replace(/`([^`\n]+)`/g,'<code>$1</code>')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--accent2)">$1</a>')
          .replace(/^### (.+)$/gm,'<h4 style="margin:8px 0 2px;font-size:12px;color:var(--text)">$1</h4>')
          .replace(/^## (.+)$/gm,'<h3 style="margin:8px 0 3px;font-size:13px;font-weight:600">$1</h3>')
          .replace(/^# (.+)$/gm,'<h2 style="margin:8px 0 4px;font-size:14px;font-weight:700">$1</h2>')
          .replace(/^(\d+\.) (.+)$/gm,'<li data-ol>$2</li>')
          .replace(/^[-*] (.+)$/gm,'<li>$1</li>')
          .replace(/(<li[^>]*>[\s\S]*?<\/li>(\n|$))+/g, s => {
            const isOl = s.includes('data-ol');
            const tag = isOl ? 'ol' : 'ul';
            const items = s.replace(/ data-ol/g,'');
            return `<${tag} style="margin:4px 0 4px 16px;padding:0">${items}</${tag}>`;
          })
          .replace(/\n{2,}/g,'<br/><br/>')
          .replace(/\n/g,'<br/>');
        return <div key={i} dangerouslySetInnerHTML={{ __html: html }} />;
      })}
    </>
  );
}

function MdContent({ text, isStreaming }) {
  // Waiting for first token — show pulse dots inside the bubble
  if (isStreaming && !text) {
    return <div className="thinking-dots" style={{padding:'4px 2px'}}><span/><span/><span/></div>;
  }
  const lines = (text||'').split('\n');
  const segments = [];
  let buf = [];
  for (const line of lines) {
    if (/^TOOL:[a-zA-Z_]+:[a-zA-Z_]+/.test(line.trim())) {
      if (buf.length) { segments.push({ type:'text', content:buf.join('\n') }); buf=[]; }
      segments.push({ type:'tool', line:line.trim() });
    } else { buf.push(line); }
  }
  if (buf.length) segments.push({ type:'text', content:buf.join('\n') });
  const lastToolIdx = segments.reduce((acc,s,i)=>s.type==='tool'?i:acc,-1);
  return (
    <>
      {segments.map((seg,i)=>{
        if (seg.type==='tool') {
          const state = isStreaming && i===lastToolIdx ? 'running' : 'done';
          return <ToolCallBlock key={i} line={seg.line} state={state}/>;
        }
        return seg.content.trim() ? <MdBlock key={i} text={seg.content}/> : null;
      })}
      {isStreaming && <span className="typing-cursor"/>}
    </>
  );
}

// ── Tool chip ─────────────────────────────────────────────────
function ToolChip({ t, pendingChanges, setPendingChanges, setActiveTab }) {
  const ic = t.icon === 'write' ? ICONS.file : ICONS.terminal;
  const isWrite = t.icon === 'write';
  const pending = isWrite ? pendingChanges.find(p => p.file === t.label || p.file === ('src/'+t.label)) : null;
  const status = pending?.status;

  const accept = async (e) => {
    e.stopPropagation();
    if (!pending) return;
    setPendingChanges(ps => ps.map(p => p.id === pending.id ? {...p, status:'accepting'} : p));
    playAccept();
    const fname = t.label.split('/').pop();
    try {
      const content = pending.content || '';
      if (pending.editId) {
        await fetch(window.MAX_URL + `/api/workspace-edits/${encodeURIComponent(pending.editId)}/accept`, {
          method: 'POST',
          headers: authHdrs(true)
        });
      } else {
        await fetch(window.MAX_URL + '/api/tools/file/write', {
          method: 'POST', headers: authHdrs(),
          body: JSON.stringify({ filePath: t.label, content })
        });
      }
      setPendingChanges(ps => ps.map(p => p.id === pending.id ? {...p, status:'accepted'} : p));
    } catch {
      setPendingChanges(ps => ps.map(p => p.id === pending.id ? {...p, status:'accepted'} : p));
    }
    if (setActiveTab) setActiveTab(fname);
  };
  const reject = (e) => {
    e.stopPropagation();
    playReject();
    if (pending?.editId) {
      fetch(window.MAX_URL + `/api/workspace-edits/${encodeURIComponent(pending.editId)}/reject`, {
        method: 'POST',
        headers: authHdrs(true)
      }).catch(()=>{});
    }
    setPendingChanges(ps => ps.map(p => p.id === pending.id ? {...p, status:'rejected'} : p));
  };

  return (
    <div className="tool-call" style={status==='rejected'?{opacity:.45}:{}}>
      <span className="tc-icon" style={{display:'flex',alignItems:'center'}}>{ic}</span>
      <span style={{color:'var(--muted)',fontSize:10,letterSpacing:.5,textTransform:'uppercase'}}>{t.action}</span>
      <span className="tc-path">{t.label}</span>
      {isWrite && !status && t.ok && <span className="tc-ok" style={{display:'flex',alignItems:'center'}}>{ICONS.check}</span>}
      {isWrite && status === 'pending' && (
        <div className="tc-actions">
          <button className="tc-accept" title="View diff" onClick={async e=>{
            e.stopPropagation();
            if(!window.__showDiff) return;
            let original='';
            try{
              const r=await fetch(window.MAX_URL+'/api/tools/file/read',{method:'POST',headers:authHdrs(),body:JSON.stringify({filePath:t.label})});
              const d=await r.json(); original=d.content||d.result||d.text||'';
            }catch{}
            window.__showDiff({fileName:t.label.split('/').pop(),original,modified:pending?.content||'',pendingId:pending?.id});
          }} style={{fontSize:10,width:'auto',padding:'0 5px',color:'var(--blue)',background:'rgba(96,165,250,.1)',border:'1px solid rgba(96,165,250,.3)'}}>diff</button>
          <button className="tc-accept" title="Accept change" onClick={accept}>{ICONS.check}</button>
          <button className="tc-reject" title="Reject change" onClick={reject}>{ICONS.close}</button>
        </div>
      )}
      {isWrite && status === 'accepted' && <span className="tc-accepted">{ICONS.check} accepted</span>}
      {isWrite && status === 'rejected' && <span className="tc-rejected">rejected</span>}
      {!isWrite && <span className="tc-ok" style={{display:'flex',alignItems:'center'}}>{ICONS.check}</span>}
    </div>
  );
}

// ── Message time helper ───────────────────────────────────────
function fmtTime(id) {
  const raw = String(id || '');
  const match = raw.match(/\d{13}/);
  const ts = typeof id === 'number' ? id : match ? Number(match[0]) : 0;
  if (!ts) return '';
  const d = new Date(ts);
  if (Number.isNaN(d.getTime())) return '';
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function stripInternalContext(text = '') {
  if (typeof text !== 'string' || !text) return text || '';
  const markers = [
    '\n## Relevant Memories',
    '\nRelevant Memories',
    '\n## Knowledge Base',
    '\nKnowledge Base — retrieved context',
    '\nKnowledge Base â€” retrieved context',
    '\n## System State',
    '\nREADME summary:',
    '\nStack: @',
    '\nMAX — autonomous engineering agent',
    '\nMAX â€” autonomous engineering agent'
  ];
  let cut = -1;
  for (const marker of markers) {
    const idx = text.indexOf(marker);
    if (idx !== -1 && (cut === -1 || idx < cut)) cut = idx;
  }
  if (cut === -1) {
    for (const marker of markers.map(m => m.trimStart())) {
      if (text.startsWith(marker)) return '';
    }
    return text;
  }
  return text.slice(0, cut).trim();
}

          {msg.tools?.map((t,i)=><ToolChip key={i} t={t} pendingChanges={pendingChanges} setPendingChanges={setPendingChanges} setActiveTab={setActiveTab}/>)}
          <MdContent text={stripInternalContext(msg.text)} isStreaming={!!msg.streaming}/>
        </div>
      </div>
    </div>
  );
}

// ── Preview pane ──────────────────────────────────────────────
const DEVICES = [
  { id:'desktop', label:'Desktop', w:null, h:null, icon:ICONS.desktop },
  { id:'tablet',  label:'Tablet',  w:768,  h:1024, icon:ICONS.tablet  },
  { id:'phone',   label:'Phone',   w:390,  h:844,  icon:ICONS.phone   },
];

function PreviewPane({ sendMessage, activeTab, isSplit, onCloseSplit }) {
  const defaultPreviewUrl = (() => {
    const saved = localStorage.getItem('mx_preview_url');
    if (saved && saved !== 'http://localhost:3000') return saved;
    return `${window.location.origin}/satellite`;
  })();
  const [device, setDevice] = useState('desktop');
  const [url, setUrl] = useState(defaultPreviewUrl);
  const [inputUrl, setInputUrl] = useState(defaultPreviewUrl);
  const [serverUp, setServerUp] = useState(false);
  // 'idle' | 'detecting' | 'starting' | 'waiting' | 'error'
  const [launchState, setLaunchState] = useState('idle');
  const [launchCmd, setLaunchCmd] = useState('npm run dev');
  const [launchLog, setLaunchLog] = useState('');
  const iframeRef = useRef(null);
  const autoTriggered = useRef(false);
  const d = DEVICES.find(x=>x.id===device);

  // ── Claude Design Features State ──
  const [consoleLogs, setConsoleLogs] = useState([]);
  const [consoleOpen, setConsoleOpen] = useState(false);
  const [inspectActive, setInspectActive] = useState(false);
  const [selectedElem, setSelectedElem] = useState(null);
  const [tweakPrompt, setTweakPrompt] = useState('');
  const [versions, setVersions] = useState(() => [
    { id: 1, label: 'v1', url: defaultPreviewUrl, time: new Date().toLocaleTimeString() }
  ]);
  const [currentVersionId, setCurrentVersionId] = useState(1);

  // Poll target URL
  useEffect(()=>{
    let mounted=true;
    const check=async()=>{
      try{
        await fetch(url,{mode:'no-cors',signal:AbortSignal.timeout(1500)});
        if(mounted){ setServerUp(true); setLaunchState('idle'); }
      } catch{
        if(mounted) setServerUp(false);
      }
    };
    check();
    const interval = launchState==='waiting' ? 2000 : 5000;
    const t=setInterval(check,interval);
    return ()=>{mounted=false;clearInterval(t);};
  },[url, launchState]);

  // Auto-detect & start dev server
  useEffect(()=>{
    if(autoTriggered.current || serverUp) return;
    autoTriggered.current = true;
    const timer = setTimeout(()=>{
      if(!serverUp) autoLaunch();
    }, 1800);
    return ()=>clearTimeout(timer);
  },[]);

  // ── Listen for Console Messages & Error Sniffer ──
  useEffect(() => {
    const handleMsg = (e) => {
      if (e.data && e.data.type === 'MAX_PREVIEW_CONSOLE') {
        setConsoleLogs(prev => [...prev.slice(-99), {
          id: Date.now() + Math.random(),
          type: e.data.level || 'info',
          message: e.data.message || '',
          stack: e.data.stack || '',
          time: new Date().toLocaleTimeString()
        }]);
        if (e.data.level === 'error') {
          setConsoleOpen(true);
        }
      }
    };
    window.addEventListener('message', handleMsg);
    return () => window.removeEventListener('message', handleMsg);
  }, []);

  const handleIframeLoad = () => {
    try {
      const win = iframeRef.current?.contentWindow;
      if (!win) return;
      if (win.console && !win.__max_hooked) {
        win.__max_hooked = true;
        const origErr = win.console.error;
        const origWarn = win.console.warn;
        win.console.error = (...args) => {
          try { origErr?.apply(win.console, args); } catch {}
          const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
          window.postMessage({ type: 'MAX_PREVIEW_CONSOLE', level: 'error', message: msg, stack: (new Error().stack||'') }, '*');
        };
        win.console.warn = (...args) => {
          try { origWarn?.apply(win.console, args); } catch {}
          const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
          window.postMessage({ type: 'MAX_PREVIEW_CONSOLE', level: 'warn', message: msg }, '*');
        };
        win.addEventListener('error', (ev) => {
          window.postMessage({ type: 'MAX_PREVIEW_CONSOLE', level: 'error', message: ev.message || 'Uncaught Error', stack: ev.error?.stack || `${ev.filename||'script'}:${ev.lineno||0}` }, '*');
        });
        win.addEventListener('unhandledrejection', (ev) => {
          window.postMessage({ type: 'MAX_PREVIEW_CONSOLE', level: 'error', message: 'Unhandled Promise Rejection: ' + (ev.reason?.message || ev.reason || ''), stack: ev.reason?.stack || '' }, '*');
        });
      }
    } catch {}
  };

  // ── Click-to-Tweak DOM Inspector ──
  useEffect(() => {
    if (!inspectActive) return;
    try {
      const doc = iframeRef.current?.contentDocument;
      if (!doc) return;
      let hovered = null;
      const onOver = (e) => {
        if (hovered && hovered !== e.target) {
          hovered.style.outline = hovered.__prevOutline || '';
        }
        hovered = e.target;
        hovered.__prevOutline = hovered.style.outline;
        hovered.style.outline = '2px dashed #a855f7';
      };
      const onOut = (e) => {
        if (e.target) e.target.style.outline = e.target.__prevOutline || '';
      };
      const onClick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const el = e.target;
        if (el) {
          el.style.outline = el.__prevOutline || '';
          const tag = el.tagName.toLowerCase();
          const cls = el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).join('.') : '';
          const text = (el.innerText || el.textContent || '').trim().slice(0, 60);
          setSelectedElem({ tag, cls, id: el.id, text, selector: `${tag}${cls}` });
        }
      };
      doc.addEventListener('mouseover', onOver, true);
      doc.addEventListener('mouseout', onOut, true);
      doc.addEventListener('click', onClick, true);
      return () => {
        doc.removeEventListener('mouseover', onOver, true);
        doc.removeEventListener('mouseout', onOut, true);
        doc.removeEventListener('click', onClick, true);
        if (hovered) hovered.style.outline = hovered.__prevOutline || '';
      };
    } catch {}
  }, [inspectActive]);

  const toggleInspector = () => {
    const next = !inspectActive;
    setInspectActive(next);
    if (!next) setSelectedElem(null);
  };

  const submitTweak = () => {
    if (!tweakPrompt.trim() || !selectedElem || !sendMessage) return;
    const msg = `In the live preview (${url}), I selected element <${selectedElem.tag}${selectedElem.cls ? ' class="' + selectedElem.cls.replace(/^\./, '').replace(/\./g, ' ') + '"' : ''}>${selectedElem.text ? ` containing "${selectedElem.text}"` : ''}.\n\nDirective: ${tweakPrompt.trim()}\nPlease update the relevant component or styles.`;
    sendMessage(msg);
    setTweakPrompt('');
    setSelectedElem(null);
    setInspectActive(false);
  };

  const fixWithMax = (errLog) => {
    if (!sendMessage) return;
    const errText = errLog
      ? `${errLog.message}\n${errLog.stack || ''}`
      : consoleLogs.filter(l => l.type === 'error').map(e => `${e.message}\n${e.stack || ''}`).join('\n\n');
    const prompt = `Preview Runtime Error at ${url} (Active Tab: ${activeTab || 'N/A'}):\n\n\`\`\`\n${errText.trim()}\n\`\`\`\nPlease analyze this error, explain the root cause, and fix it.`;
    sendMessage(prompt);
  };

  const addSnapshot = (customLabel) => {
    const nextId = versions.length + 1;
    const v = { id: nextId, label: customLabel || `v${nextId}`, url, time: new Date().toLocaleTimeString() };
    setVersions(vs => [...vs, v]);
    setCurrentVersionId(nextId);
  };

  const openExternal = () => window.open(url, '_blank');

  const exportStandalone = async () => {
    try {
      let html = '';
      try {
        const doc = iframeRef.current?.contentDocument;
        if (doc) html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
      } catch {}
      if (!html) {
        const r = await fetch(url);
        html = await r.text();
      }
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `max-preview-${Date.now()}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    } catch (e) {
      alert('Export failed: ' + e.message);
    }
  };

  const detectDevCmd = async () => {
    // Ask MAX to check for package.json and figure out the right start command
    const maxBase = window.MAX_URL || 'http://localhost:3100';
    try {
      const r = await fetch(`${maxBase}/api/tools/shell/run`, {
        method:'POST', headers:authHdrs(),
        body: JSON.stringify({ command: 'node -e "try{const p=require(\'./package.json\');const s=p.scripts||{};console.log(s.dev?\'dev\':s.start?\'start\':s[\'dev:start\']?\'dev:start\':\'\');}catch{console.log(\'\');}"', timeoutMs:5000 })
      });
      const d = await r.json();
      const script = (d.stdout||'').trim();
      if (script) return `npm run ${script}`;
    } catch {}
    return 'npm run dev';
  };

  const autoLaunch = async () => {
    const maxBase = window.MAX_URL || 'http://localhost:3100';
    setLaunchState('detecting');
    setLaunchLog('Detecting dev script…');
    const cmd = await detectDevCmd();
    setLaunchCmd(cmd);
    setLaunchState('starting');
    setLaunchLog(`Starting: ${cmd}`);
    try {
      const r = await fetch(`${maxBase}/api/tools/shell/start`, {
        method:'POST', headers:authHdrs(),
        body: JSON.stringify({ command: cmd, name: 'dev-server' })
      });
      const result = await r.json();
      if (result.success || result.pid) {
        setLaunchState('waiting');
        setLaunchLog(`Server starting (pid ${result.pid})… waiting for ${url}`);
      } else {
        setLaunchState('error');
        setLaunchLog(result.error || 'Failed to start dev server');
      }
    } catch(err) {
      setLaunchState('error');
      setLaunchLog(err.message);
    }
  };

  const navigate=()=>{setUrl(inputUrl);localStorage.setItem('mx_preview_url',inputUrl);addSnapshot();};
  const reload=()=>{ if(iframeRef.current) iframeRef.current.src=url; };
  const iframeH = device==='desktop' ? (isSplit ? '100%' : 520) : d.h;
  const wrapStyle = device==='desktop'
    ? {width:'100%',height:'100%',minHeight:480,display:'flex',flexDirection:'column'}
    : {width:d.w,flexShrink:0,display:'flex',flexDirection:'column'};

  const launchBusy = launchState==='detecting'||launchState==='starting'||launchState==='waiting';
  const errorsCount = consoleLogs.filter(l => l.type === 'error').length;
  const warnsCount = consoleLogs.filter(l => l.type === 'warn').length;

  return (
    <div style={{display:'flex',flexDirection:'column',flex:1,overflow:'hidden',position:'relative'}}>
      {/* ── Toolbar ── */}
      <div className="preview-toolbar">
        <button className="preview-nav-btn" onClick={()=>iframeRef.current?.contentWindow?.history.back()}>{ICONS.back}</button>
        <button className="preview-nav-btn" onClick={()=>iframeRef.current?.contentWindow?.history.forward()}>{ICONS.forward}</button>
        <button className="preview-nav-btn" onClick={reload}>{ICONS.reload}</button>
        <form onSubmit={e=>{e.preventDefault();navigate();}} style={{flex:1,display:'flex',maxWidth:260}}>
          <input className="preview-url-bar" value={inputUrl} onChange={e=>setInputUrl(e.target.value)} onFocus={e=>e.target.select()} style={{width:'100%'}}/>
        </form>
        <div style={{display:'flex',gap:3,margin:'0 4px'}}>
          <button 
            type="button" 
            style={{padding:'2px 6px',fontSize:10,borderRadius:4,background:url.includes('/satellite')?'var(--accent)':'var(--s3)',border:'1px solid var(--border)',color:url.includes('/satellite')?'#fff':'var(--muted)',cursor:'pointer',display:'flex',alignItems:'center',gap:3,fontWeight:600}}
            onClick={()=>{const u=`${window.location.origin}/satellite`;setInputUrl(u);setUrl(u);localStorage.setItem('mx_preview_url',u);addSnapshot('Satellite');}}
          >
            🛰️
          </button>
          <button 
            type="button" 
            style={{padding:'2px 6px',fontSize:10,borderRadius:4,background:url.includes(':3001')?'var(--accent)':'var(--s3)',border:'1px solid var(--border)',color:url.includes(':3001')?'#fff':'var(--muted)',cursor:'pointer',display:'flex',alignItems:'center',gap:3,fontWeight:600}}
            onClick={()=>{const u='http://192.168.1.254:3001';setInputUrl(u);setUrl(u);localStorage.setItem('mx_preview_url',u);addSnapshot('SOMA');}}
          >
            👑
          </button>
          <button 
            type="button" 
            style={{padding:'2px 6px',fontSize:10,borderRadius:4,background:url.includes(':3000')?'var(--accent)':'var(--s3)',border:'1px solid var(--border)',color:url.includes(':3000')?'#fff':'var(--muted)',cursor:'pointer',display:'flex',alignItems:'center',gap:3,fontWeight:600}}
            onClick={()=>{const u='http://localhost:3000';setInputUrl(u);setUrl(u);localStorage.setItem('mx_preview_url',u);addSnapshot('Dev');}}
          >
            💻
          </button>
        </div>

        {/* Version chips */}
        <div style={{display:'flex',alignItems:'center',gap:3,margin:'0 4px'}}>
          {versions.slice(-4).map(v=>(
            <button key={v.id} className={`version-chip ${v.id===currentVersionId?'active':''}`} onClick={()=>{setCurrentVersionId(v.id);setUrl(v.url);}}>
              {v.label}
            </button>
          ))}
          <button className="version-chip" onClick={()=>addSnapshot()} title="Snapshot current view">📸</button>
        </div>

        {/* Feature Actions */}
        <div style={{display:'flex',alignItems:'center',gap:4}}>
          <button 
            className={`preview-nav-btn ${inspectActive?'active':''}`}
            onClick={toggleInspector}
            title="Click-to-Tweak: Select element to prompt MAX"
            style={{background:inspectActive?'var(--aglow)':'var(--s3)',color:inspectActive?'var(--accent2)':'var(--muted)',borderColor:inspectActive?'var(--accent)':'var(--border)'}}
          >
            🎯
          </button>
          <button className="preview-nav-btn" onClick={openExternal} title="Open in new window">↗</button>
          <button className="preview-nav-btn" onClick={exportStandalone} title="Download standalone HTML">💾</button>
          <button 
            className="preview-nav-btn" 
            onClick={()=>setConsoleOpen(o=>!o)} 
            title="Toggle Console Drawer"
            style={{display:'flex',alignItems:'center',gap:3,padding:'0 6px',width:'auto',fontSize:10,background:errorsCount>0?'rgba(239,68,68,0.15)':consoleOpen?'var(--aglow)':'var(--s3)',color:errorsCount>0?'var(--red)':consoleOpen?'var(--accent2)':'var(--muted)',borderColor:errorsCount>0?'rgba(239,68,68,0.4)':consoleOpen?'var(--accent)':'var(--border)'}}
          >
            🐞{errorsCount>0?` ${errorsCount}`:''}
          </button>
        </div>

        <div className="device-group">
          {DEVICES.map(dv=>(
            <button key={dv.id} className={`device-btn ${device===dv.id?'active':''}`} onClick={()=>setDevice(dv.id)}>
              {dv.icon} {dv.label}
            </button>
          ))}
          {isSplit && (
            <button className="preview-nav-btn" onClick={onCloseSplit} title="Close split preview" style={{marginLeft:6}}>✕</button>
          )}
        </div>
      </div>

      {/* ── Click-to-Tweak Popover ── */}
      {selectedElem && (
        <div className="preview-tweak-bar">
          <div className="preview-tweak-tag">🎯 &lt;{selectedElem.tag}{selectedElem.cls}&gt; {selectedElem.text ? `"${selectedElem.text.slice(0, 24)}…"` : ''}</div>
          <input 
            className="preview-tweak-input" 
            placeholder="How should MAX tweak this element? (e.g. 'Make it green gradient')"
            value={tweakPrompt}
            onChange={e=>setTweakPrompt(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter') submitTweak(); }}
            autoFocus
          />
          <button className="btn-fix-max" onClick={submitTweak}>⚡ Prompt MAX</button>
          <button className="preview-nav-btn" onClick={()=>{setSelectedElem(null);setInspectActive(false);}}>✕</button>
        </div>
      )}

      {/* ── Stage ── */}
      <div className="preview-stage">
        <div className="preview-device-wrap" style={wrapStyle}>
          {device!=='desktop' && (
            <div className="browser-chrome">
              <div className="bc-dots">
                <div className="bc-dot" style={{background:'#ef4444'}}/><div className="bc-dot" style={{background:'#f59e0b'}}/><div className="bc-dot" style={{background:'#10b981'}}/>
              </div>
              <div className="bc-bar">{url}</div>
              <button className="preview-nav-btn" onClick={reload}>{ICONS.reload}</button>
            </div>
          )}
          <div className="preview-iframe-wrap" style={{height:iframeH,borderRadius:device!=='desktop'?'0 0 10px 10px':'0'}}>
            {serverUp ? (
              <iframe 
                ref={iframeRef} 
                className="preview-iframe" 
                src={url} 
                onLoad={handleIframeLoad}
                style={{height:iframeH}} 
                title="Preview" 
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
              />
            ) : (
              <div className="preview-no-server">
                <div style={{opacity:.25,display:'flex'}}>{ICONS.desktop}</div>
                {launchBusy ? (
                  <>
                    <div className="pns-title" style={{display:'flex',alignItems:'center',gap:8}}>
                      <span style={{display:'inline-block',animation:'tcb-spin .9s linear infinite',fontSize:16}}>⟳</span>
                      {launchState==='detecting'?'Detecting dev server…':launchState==='starting'?'Launching dev server…':'Waiting for server…'}
                    </div>
                    <div className="pns-cmd"><span style={{color:'var(--accent2)'}}>❯</span><span>{launchCmd}</span></div>
                    <div className="pns-hint" style={{color:'var(--muted)',fontSize:11,marginTop:4}}>{launchLog}</div>
                  </>
                ) : (
                  <>
                    <div className="pns-title">{launchState==='error'?'Failed to start dev server':`No server at ${url}`}</div>
                    {launchState==='error' && <div className="pns-hint" style={{color:'var(--red)',fontSize:11,marginBottom:8}}>{launchLog}</div>}
                    <div className="pns-cmd"><span style={{color:'var(--accent2)'}}>❯</span><span>{launchCmd}</span></div>
                    <div className="pns-hint">Maxwell will auto-start your dev server.<br/>Click below to retry.</div>
                    <button className="preview-reload-btn" onClick={()=>{autoTriggered.current=false;autoLaunch();}}>
                      {launchState==='error'?'Retry Launch':'Launch Dev Server'}
                    </button>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      </div>

      {/* ── Live Console Drawer ── */}
      {consoleOpen && (
        <div className="preview-console-drawer">
          <div className="preview-console-header" onClick={()=>setConsoleOpen(false)}>
            <span>🐞 Console</span>
            <span style={{color:errorsCount>0?'var(--red)':'var(--muted)',marginLeft:4}}>{errorsCount} error{errorsCount===1?'':'s'}</span>
            <span style={{color:warnsCount>0?'var(--amber)':'var(--muted)',marginLeft:4}}>{warnsCount} warn{warnsCount===1?'':'s'}</span>
            {errorsCount>0 && sendMessage && (
              <button className="btn-fix-max" onClick={(e)=>{e.stopPropagation();fixWithMax();}}>
                ⚡ Fix with MAX
              </button>
            )}
            <button className="preview-nav-btn" style={{width:18,height:18,fontSize:10,marginLeft:errorsCount>0?8:'auto'}} onClick={(e)=>{e.stopPropagation();setConsoleLogs([]);}} title="Clear console">✕</button>
          </div>
          <div className="preview-console-body">
            {consoleLogs.length===0 ? (
              <div style={{color:'var(--muted)',fontStyle:'italic'}}>No console messages logged</div>
            ) : (
              consoleLogs.map(l=>(
                <div key={l.id} className={`console-log-row ${l.type}`}>
                  <span style={{opacity:0.6,fontSize:9.5}}>{l.time}</span>
                  <span style={{fontWeight:700}}>[{l.type.toUpperCase()}]</span>
                  <span style={{flex:1}}>{l.message}</span>
                  {l.type==='error' && sendMessage && (
                    <button className="btn-fix-max" style={{padding:'1px 5px',fontSize:9.5}} onClick={()=>fixWithMax(l)}>
                      ⚡ Fix
                    </button>
                  )}
                </div>
              ))
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Settings modal ────────────────────────────────────────────
// Auto-detect API provider from key prefix
function detectProvider(key) {
  const k = key.trim();
  if (k.startsWith('sk-ant-'))           return 'anthropic';
  if (k.startsWith('sk-proj-'))          return 'openai';
  if (k.startsWith('AIza'))              return 'google';
  if (k.startsWith('sk-') && k.length > 40) return 'deepseek'; // fallback: most sk- that aren't openai
  if (k.startsWith('gsk_'))              return 'groq';
  if (k.startsWith('xai-'))              return 'xai';
  if (k.startsWith('sk-') && k.length <= 56) return 'openai';
  return null;
}

const PROVIDER_META = {
  deepseek:  { label:'DeepSeek',  color:'#60a5fa', note:'deepseek-reasoner · deepseek-coder-v2',   placeholder:'sk-...' },
  openai:    { label:'OpenAI',    color:'#a78bfa', note:'gpt-4o · o3 · gpt-4o-mini',               placeholder:'sk-proj-...' },
  anthropic: { label:'Anthropic', color:'#f472b6', note:'claude-opus-4 · claude-haiku',            placeholder:'sk-ant-...' },
  google:    { label:'Google AI', color:'#34d399', note:'gemini-2.0-flash · gemini-1.5-pro',        placeholder:'AIza...' },
  groq:      { label:'Groq',      color:'#fb923c', note:'llama3-70b · mixtral-8x7b (fast & free)',  placeholder:'gsk_...' },
  xai:       { label:'xAI (Grok)',color:'#e879f9', note:'grok-2 · grok-beta',                      placeholder:'xai-...' },
};

function SettingsModal({ onClose, maxUrl, setMaxUrl, onOpenSetup }) {
  const [tab, setTab]       = useState('general');
  const [urlDraft, setUrlDraft] = useState(maxUrl);
  const [keys, setKeys]     = useState(() => {
    const stored = {};
    Object.keys(PROVIDER_META).forEach(id => {
      stored[id] = localStorage.getItem(`mx_key_${id}`) || '';
    });
    stored.maxApiKey = localStorage.getItem('maxwell_api_key') || window.__MAX_API_KEY || '';
    return stored;
  });
  const [pasteKey, setPasteKey]   = useState('');

// ── Task complexity classifier ────────────────────────────────
function classifyTask(text) {
  const t = text.toLowerCase();
  const simpleKws = ['what is','what are','explain','how does','list','show','tell me','hi','hello','thanks','what version','status','help'];
  const complexKws = ['build','implement','create','write','refactor','fix','debug','add','migrate','deploy','test','generate','architect','optimize','scale'];
  if (simpleKws.some(k => t.includes(k))) return 'local';
  if (complexKws.some(k => t.includes(k))) return 'cloud';
  if (text.length < 60) return 'local';
  return 'cloud';
}

// Resolve selectedOption → { tier, model } for the API call
function resolveModelChoice(selectedOption, messageText) {
  if (selectedOption.startsWith('auto:')) {
    const band = selectedOption.split(':')[1]; // fast | smart | genius
    if (band === 'genius') return { tier: 'genius', model: undefined };
    // For fast/smart, classify the message — can downgrade fast→fast, smart can also go fast for trivial
    const complexity = classifyTask(messageText);
    const tier = (band === 'smart' && complexity === 'cloud') ? 'smart'
               : (band === 'smart') ? 'fast'
               : 'fast';
    return { tier, model: undefined };
  }
  const opt = getOptionById(selectedOption);
  return { tier: opt.tier, model: selectedOption };
}

function modelBadgeClass(tier) {
  if (tier === 'fast')   return 'mmb-local';
  if (tier === 'genius') return 'mmb-genius';
  return 'mmb-cloud';
}

function modelBadgeLabel(tier, optionId) {
  const opt = getOptionById(optionId || '');
  if (tier === 'fast') return '⚡ local';
  return (opt?.icon || '◎') + ' ' + (opt?.label || tier);
}

// ── Setup Wizard ──────────────────────────────────────────────
function SetupWizard({ onDismiss }) {
  const [step, setStep] = React.useState(0);
  const [ollamaStatus, setOllamaStatus] = React.useState('checking'); // checking|missing|installed
  const [pulling, setPulling] = React.useState(false);
  const [pulled, setPulled] = React.useState(false);
  const [pullProgress, setPullProgress] = React.useState('');

  React.useEffect(() => {
    fetch('http://localhost:11434/api/tags', { signal: AbortSignal.timeout(2000) })
      .then(r => r.ok ? setOllamaStatus('installed') : setOllamaStatus('missing'))
      .catch(() => setOllamaStatus('missing'));
  }, []);

  React.useEffect(() => {
    if (ollamaStatus === 'installed' && step === 0) setStep(1);
  }, [ollamaStatus]);

  const pullModel = async () => {
    setPulling(true); setPullProgress('Starting download…');
    try {
      const r = await fetch('http://localhost:11434/api/pull', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'qwen3:1.5b', stream: true })
      });
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const ev = JSON.parse(line);
            if (ev.total && ev.completed) {
              const pct = Math.round((ev.completed / ev.total) * 100);
              setPullProgress(`${ev.status || 'pulling'} ${pct}%`);
            } else if (ev.status) {
              setPullProgress(ev.status);
              if (ev.status === 'success') { setPulled(true); setStep(2); break; }
            }
          } catch {}
        }
      }
      setPulled(true); setStep(2);
    } catch (e) {
      setPullProgress('Error: ' + e.message + ' — check Ollama is running');
    } finally {
      setPulling(false);
    }
  };

  const steps = [
    {
      title: 'Install Ollama',
      desc: 'Ollama runs AI models locally on your machine — free, private, no API key needed. Required for the local fast tier.',

  return (
    <div className="setup-modal">
      <div className="setup-card">
        <div className="setup-header">
          <h2>⚡ Set up local AI</h2>
          <p>Maxwell uses a local model for everyday tasks — saving your cloud API credits for complex work. Setup takes about 2 minutes.</p>

        <div className="setup-steps">
          {steps.map((s, i) => (

              <div className="step-num">{s.status === 'done' ? '✓' : i + 1}</div>

    </div>
  );
}


// ── Command palette ───────────────────────────────────────────
const PALETTE_CMDS = [
  { type:'cmd', icon:'bolt',     label:'/swarm',   hint:'Parallel swarm job',       action:'swarm'   },
  { type:'cmd', icon:'warning',  label:'/debate',  hint:'Adversarial debate',        action:'debate'  },
  { type:'cmd', icon:'settings', label:'/reflect', hint:'Force deep reflection',     action:'reflect' },
  { type:'cmd', icon:'target',   label:'/goals',   hint:'List active goals',         action:'goals'   },
  { type:'cmd', icon:'terminal', label:'/status',  hint:'Full internal state',       action:'status'  },
  { type:'cmd', icon:'search',   label:'/inspect', hint:'Scan TODOs/FIXMEs',        action:'inspect' },
];

function CommandPalette({ files, onOpenFile, onRunCmd, onClose }) {
  const [q, setQ] = React.useState('');
  const [selIdx, setSelIdx] = React.useState(0);
  const inputRef = React.useRef(null);
  React.useEffect(()=>{ inputRef.current?.focus(); }, []);

  const flatAll = (arr) => (arr||[]).flatMap(f => f.type==='dir' ? flatAll(f.children||[]) : [f]);
  const allFiles = flatAll(files);
  const fileItems = allFiles
    .filter(f => !q || f.name.toLowerCase().includes(q.toLowerCase()))
    .map(f => ({ type:'file', icon:'file', label:f.name, f }));
  const cmdItems = PALETTE_CMDS
    .filter(c => !q || c.label.includes(q.toLowerCase()) || c.hint.toLowerCase().includes(q.toLowerCase()));
  const allItems = [...fileItems, ...cmdItems];

  const onKey = e => {
    if (e.key==='ArrowDown'){ e.preventDefault(); setSelIdx(i=>Math.min(i+1,allItems.length-1)); }
    if (e.key==='ArrowUp')  { e.preventDefault(); setSelIdx(i=>Math.max(i-1,0)); }
    if (e.key==='Escape') onClose();
    if (e.key==='Enter') { e.preventDefault(); pick(allItems[selIdx]); }
  };

  const pick = item => {
    if (!item) return;
    if (item.type==='file') onOpenFile(item.f);
    else onRunCmd(item.action);
    onClose();
  };

  return (
    <div className="palette-overlay" onClick={onClose}>
      <div className="palette-box" onClick={e=>e.stopPropagation()}>
        <div className="palette-input-row">
          <span style={{display:'flex',color:'var(--muted)'}}>{ICONS.search}</span>
          <input ref={inputRef} className="palette-input" placeholder="Search files, run commands…"
            value={q} onChange={e=>{setQ(e.target.value);setSelIdx(0);}} onKeyDown={onKey}/>
          <span style={{fontSize:11,color:'var(--muted2)',fontFamily:'var(--mono)'}}>Esc</span>
        </div>
        <div className="palette-results">
          {fileItems.length>0 && <>
            <div className="palette-section-label">Files</div>
            {fileItems.map((item,i)=>(
              <div key={item.label} className={`palette-item ${selIdx===i?'sel':''}`} onClick={()=>pick(item)}>
                <span className="pi-icon">{ICONS.file}</span>
                <span className="pi-label">{item.label}</span>
                <span className="pi-badge">open</span>
              </div>
            ))}
          </>}
          {cmdItems.length>0 && <>
            <div className="palette-section-label">Commands</div>
            {cmdItems.map((item,i)=>{
              const globalIdx = fileItems.length+i;
              return (
                <div key={item.label} className={`palette-item ${selIdx===globalIdx?'sel':''}`} onClick={()=>pick(item)}>
                  <span className="pi-icon">{ICONS[item.icon]||ICONS.bolt}</span>
                  <span className="pi-label">{item.label}</span>
                  <span className="pi-hint">{item.hint}</span>
                </div>
              );
            })}
          </>}
          {allItems.length===0 && <div style={{padding:'20px 16px',fontSize:12.5,color:'var(--muted)',textAlign:'center'}}>No results for "{q}"</div>}
        </div>
        <div className="palette-footer">
          <span><kbd>↑↓</kbd> navigate</span>
          <span><kbd>Enter</kbd> open</span>
          <span><kbd>Esc</kbd> close</span>
          <span style={{marginLeft:'auto'}}><kbd>Ctrl</kbd>+<kbd>K</kbd> to reopen</span>
        </div>
      </div>
    </div>
  );
}


// ── Git Panel ─────────────────────────────────────────────────
function GitPanel({ connected, maxUrl, gitStaged, setGitStaged, openFile, onRunInTerminal, onChangedCount }) {
  const [gitFiles, setGitFiles] = React.useState([]);
  const [commitMsg, setCommitMsg] = React.useState('');
  const [gitLoading, setGitLoading] = React.useState(false);
  const [gitBranch, setGitBranch] = React.useState('main');
  const [gitLog, setGitLog] = React.useState([]);
  const [showLog, setShowLog] = React.useState(false);

  const runGit = React.useCallback(async (cmd) => {
    if (!connected) return null;
    try {
      const r = await fetch(maxUrl + '/api/tools/shell/run', {
        method:'POST', headers:authHdrs(),
        body: JSON.stringify({ command: cmd, timeoutMs: 10000 })
      });
      const d = await r.json();
      return d.stdout || d.output || '';
    } catch { return null; }
  }, [connected, maxUrl]);

  const refresh = React.useCallback(async () => {
    setGitLoading(true);
    const status = await runGit('git status --porcelain');
    if (status !== null) {
      const files = status.split('\n').filter(Boolean).map(l => ({
        status: l.slice(0,2).trim() || '?',
        file: l.slice(3).trim()
      }));
      setGitFiles(files.length ? files : []);
      onChangedCount?.(files.length);
    } else {
      setGitFiles([]);
      onChangedCount?.(0);
    }
    const branch = await runGit('git branch --show-current');
    if (branch) setGitBranch(branch.trim());
    setGitLoading(false);
  }, [runGit]);

  React.useEffect(() => { refresh(); }, [connected]);

  const commit = async () => {
    if (!commitMsg.trim()) return;
    const stagedFiles = gitFiles.filter(f => gitStaged[f.file]);
    if (stagedFiles.length === 0) { alert('No files staged. Check the checkboxes first.'); return; }
    const escFile = f => `'${f.file.replace(/'/g,"'\\''")}'`;
    const escMsg  = commitMsg.replace(/'/g,"'\\''");
    onRunInTerminal(`git add ${stagedFiles.map(escFile).join(' ')} && git commit -m '${escMsg}'`);
    setCommitMsg('');
    setTimeout(refresh, 1500);
  };

  const stageAll = () => {
    const all = {};
    gitFiles.forEach(f => all[f.file] = true);
    setGitStaged(all);
  };

  const stagedCount = gitFiles.filter(f => gitStaged[f.file]).length;

  const statusColor = s => s==='M'?'var(--amber)':s==='A'?'var(--green)':s==='D'?'var(--red)':s==='?'?'var(--muted)':'var(--muted)';
  const statusLabel = s => s==='M'?'M':s==='A'?'A':s==='D'?'D':s==='??'?'U':s||'?';

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      {/* Header */}
      <div className="sb-header">
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {ICONS.git}
          <span style={{fontWeight:600}}>Git</span>
          <span style={{fontSize:10,color:'var(--accent2)',fontFamily:'var(--mono)',background:'var(--s4)',padding:'1px 6px',borderRadius:10,border:'1px solid var(--border)'}}>{gitBranch}</span>
        </div>
        <button className="sb-icon-btn" title="Refresh" onClick={refresh} style={{opacity:gitLoading?.5:1}}>{ICONS.reload}</button>
      </div>

      {/* Commit area */}
      <div style={{padding:'8px 10px',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <textarea className="add-goal-input"
          style={{width:'100%',resize:'none',height:52,marginBottom:6,padding:'5px 8px',boxSizing:'border-box',fontFamily:'inherit',fontSize:11.5,lineHeight:1.5}}
          placeholder="Commit message…" value={commitMsg}
          onChange={e=>setCommitMsg(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))commit();}}/>
        <div style={{display:'flex',gap:5,alignItems:'center'}}>
          <button onClick={stageAll} style={{flex:1,fontSize:10.5,color:'var(--muted)',background:'var(--s3)',border:'1px solid var(--border)',borderRadius:4,padding:'3px 0',cursor:'pointer',whiteSpace:'nowrap'}}>
            Stage all <span style={{color:'var(--accent2)'}}>{gitFiles.length}</span>
          </button>
          <button onClick={()=>setGitStaged({})} style={{fontSize:10.5,color:'var(--muted)',background:'none',border:'1px solid var(--border)',borderRadius:4,padding:'3px 8px',cursor:'pointer'}}>
            Clear
          </button>
          <button onClick={commit}
            style={{flex:1,fontSize:11,fontWeight:600,
              background:commitMsg.trim()&&stagedCount>0?'var(--accent)':'var(--s3)',
              color:commitMsg.trim()&&stagedCount>0?'#fff':'var(--muted)',
              border:'none',borderRadius:4,padding:'4px 0',cursor:'pointer',
              opacity:commitMsg.trim()&&stagedCount>0?1:.5,
              display:'flex',alignItems:'center',justifyContent:'center',gap:4}}>
            {ICONS.check} Commit{stagedCount>0?` ${stagedCount}`:''}
          </button>
        </div>
      </div>

      {/* File list */}
      <div className="sb-scroll" style={{flex:1}}>
        {gitLoading && <div style={{padding:'14px 12px',fontSize:11.5,color:'var(--muted)',display:'flex',alignItems:'center',gap:6}}><span className="term-spinner">◌</span> Refreshing…</div>}
        {!gitLoading && gitFiles.length===0 && (
          <div style={{padding:'20px 12px',fontSize:11.5,color:'var(--muted)',textAlign:'center',lineHeight:1.7}}>
            {connected ? <>{ICONS.check}<br/>No changes detected</> : 'Connect MAX to see git status'}
          </div>
        )}
        {!gitLoading && gitFiles.map((f,i)=>{
          const fname = f.file.split('/').pop();
          const fdir  = f.file.includes('/') ? f.file.slice(0, f.file.lastIndexOf('/')) : '';
          return (
            <div key={i} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 10px',cursor:'pointer',borderRadius:4,margin:'1px 4px'}}
              onClick={()=>openFile({name:fname,path:f.file,type:'file'})}
              onMouseEnter={e=>e.currentTarget.style.background='var(--s3)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <span style={{width:14,height:14,borderRadius:3,background:'var(--s4)',border:`1px solid ${statusColor(statusLabel(f.status))}`,
                display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,fontWeight:700,
                color:statusColor(statusLabel(f.status)),flexShrink:0,fontFamily:'var(--mono)'}}>
                {statusLabel(f.status)}
              </span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:11.5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--fg)'}}>{fname}</div>
                {fdir && <div style={{fontSize:9.5,color:'var(--muted)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{fdir}</div>}
              </div>
              <input type="checkbox" checked={!!gitStaged[f.file]}
                onChange={e=>setGitStaged(s=>({...s,[f.file]:e.target.checked}))}
                onClick={e=>e.stopPropagation()} style={{accentColor:'var(--accent)',flexShrink:0,width:13,height:13}}/>
            </div>
          );
        })}
      </div>

      {/* Log toggle */}
      <div style={{borderTop:'1px solid var(--border)',flexShrink:0}}>
        <button onClick={()=>{setShowLog(s=>!s);if(!showLog)runGit('git log --oneline -10').then(l=>setGitLog(l?l.split('\n').filter(Boolean):[]));}}
          style={{width:'100%',padding:'5px 10px',background:'none',border:'none',color:'var(--muted)',fontSize:10.5,cursor:'pointer',display:'flex',alignItems:'center',gap:4,justifyContent:'center'}}>
          {showLog?ICONS.logUp:ICONS.logDown} {showLog?'Hide log':'Git log'}
        </button>
        {showLog && (
          <div style={{padding:'4px 10px 8px',maxHeight:110,overflowY:'auto',borderTop:'1px solid var(--border)'}}>
            {gitLog.map((l,i)=>(
              <div key={i} style={{fontSize:10.5,fontFamily:'var(--mono)',color:'var(--muted)',lineHeight:1.7,display:'flex',gap:8}}>
                <span style={{color:'var(--accent2)',flexShrink:0}}>{l.slice(0,7)}</span>
                <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.slice(8)}</span>
              </div>
            ))}
            {gitLog.length===0 && <div style={{fontSize:10.5,color:'var(--muted2)'}}>No commits yet</div>}
          </div>
        )}
      </div>

      {/* Push / Pull / Diff row */}
      <div style={{padding:'6px 8px',borderTop:'1px solid var(--border)',display:'flex',gap:4,flexShrink:0}}>
        {[['Push',ICONS.arrowUp,'git push'],['Pull',ICONS.arrowDn,'git pull'],['Diff',ICONS.diff,'git diff']].map(([label,icon,cmd])=>(
          <button key={label} onClick={()=>onRunInTerminal(cmd)}
            style={{flex:1,fontSize:10.5,color:'var(--muted)',background:'var(--s3)',border:'1px solid var(--border)',
              borderRadius:5,padding:'4px 0',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:3}}>
            {icon}{label}
          </button>
        ))}
      </div>
    </div>
  );
}

// ── Subtle sound effects ──────────────────────────────────────
function playTone(freq, duration, vol, type='sine') {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch {}
}

// ── Monaco provider registration (LSP + AI ghost text) ──────
// Called once after Monaco loads. All providers use window.MAX_URL lazily
// so they work even though the URL is set in a later React effect.
function _registerMaxwellProviders(monaco) {
    // LSP completion kind → Monaco kind mapping
    const CIK = monaco.languages.CompletionItemKind;
    const LSP_KIND = {
        1:CIK.Text, 2:CIK.Method, 3:CIK.Function, 4:CIK.Constructor,
        5:CIK.Field, 6:CIK.Variable, 7:CIK.Class, 8:CIK.Interface,
        9:CIK.Module, 10:CIK.Property, 11:CIK.Unit, 12:CIK.Value,
        13:CIK.Enum, 14:CIK.Keyword, 15:CIK.Snippet, 16:CIK.Color,
        17:CIK.File, 18:CIK.Reference, 19:CIK.Folder, 20:CIK.EnumMember,
        21:CIK.Constant, 22:CIK.Struct, 23:CIK.Event, 24:CIK.Operator,
        25:CIK.TypeParameter
    };

    // ── 1. LSP popup completions (dropdown) ────────────────────────────
    monaco.languages.registerCompletionItemProvider({ pattern: '**' }, {
        triggerCharacters: ['.', '(', '{', '[', '<', ' ', '"', "'", ':', '/'],
        provideCompletionItems: async (model, position) => {
            const baseUrl = window.MAX_URL;
            if (!baseUrl) return { suggestions: [] };
            try {
                const r = await fetch(`${baseUrl}/api/lsp/complete`, {
                    method: 'POST', headers: authHdrs(),
                    body: JSON.stringify({
                        uri:        model.uri.toString(),
                        position:   { line: position.lineNumber - 1, character: position.column - 1 },
                        languageId: model.getLanguageId(),
                        content:    model.getValue()
                    })
                });
                const data = await r.json();
                const word = model.getWordUntilPosition(position);
                const range = {
                    startLineNumber: position.lineNumber, startColumn: word.startColumn,
                    endLineNumber:   position.lineNumber, endColumn:   position.column
                };
                return {
                    suggestions: (data.items || []).slice(0, 150).map(item => {
                        const doc = item.documentation;
                        return {
                            label:      { label: item.label, detail: item.detail ? `  ${item.detail}` : '' },
                            kind:       LSP_KIND[item.kind] ?? CIK.Text,
                            documentation: doc ? (typeof doc === 'string' ? doc : doc.value) : undefined,
                            insertText: item.insertText ?? item.textEdit?.newText ?? item.label,
                            insertTextRules: item.insertTextFormat === 2
                                ? monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet : 0,
                            range,
                            sortText:   item.sortText,
                            filterText: item.filterText ?? item.label
                        };
                    })
                };
            } catch { return { suggestions: [] }; }
        }
    });

    // ── 2. Hover provider (type info + docs on mouse-over) ─────────────
    monaco.languages.registerHoverProvider({ pattern: '**' }, {
        provideHover: async (model, position) => {
            const baseUrl = window.MAX_URL;
            if (!baseUrl) return null;
            try {
                const r = await fetch(`${baseUrl}/api/lsp/hover`, {
                    method: 'POST', headers: authHdrs(),
                    body: JSON.stringify({
                        uri:        model.uri.toString(),
                        position:   { line: position.lineNumber - 1, character: position.column - 1 },
                        languageId: model.getLanguageId()
                    })
                });
                const data = await r.json();
                if (!data?.contents) return null;
                const contents = Array.isArray(data.contents)
                    ? data.contents.map(c => typeof c === 'string' ? { value: c } : c)
                    : [typeof data.contents === 'string' ? { value: data.contents } : data.contents];
                return { contents };
            } catch { return null; }
        }
    });

    // ── 3. Go-to-definition provider (F12 / Ctrl+Click) ────────────────
    monaco.languages.registerDefinitionProvider({ pattern: '**' }, {
        provideDefinition: async (model, position) => {
            const baseUrl = window.MAX_URL;
            if (!baseUrl) return null;
            try {
                const r = await fetch(`${baseUrl}/api/lsp/definition`, {
                    method: 'POST', headers: authHdrs(),
                    body: JSON.stringify({
                        uri:        model.uri.toString(),
                        position:   { line: position.lineNumber - 1, character: position.column - 1 },
                        languageId: model.getLanguageId()
                    })
                });
                const data = await r.json();
                if (!data) return null;
                const locs = Array.isArray(data) ? data : [data];
                return locs
                    .filter(l => l?.uri && l?.range)
                    .map(l => ({
                        uri: monaco.Uri.parse(l.uri),
                        range: {
                            startLineNumber: (l.range.start.line ?? 0) + 1,
                            startColumn:     (l.range.start.character ?? 0) + 1,
                            endLineNumber:   (l.range.end.line ?? 0) + 1,
                            endColumn:       (l.range.end.character ?? 0) + 1
                        }
                    }));
            } catch { return null; }
        }
    });

    // ── 4. AI inline ghost-text completions (Cursor-style Tab) ─────────
    // Debounce: only fire after 600 ms of typing inactivity
    let _ghostTimer  = null;
    let _ghostCancel = null;
    let _lastGhostText = '';

    monaco.languages.registerInlineCompletionsProvider({ pattern: '**' }, {
        provideInlineCompletions: (model, position, context, token) => {
            return new Promise(resolve => {
                if (_ghostTimer) clearTimeout(_ghostTimer);
                if (_ghostCancel) _ghostCancel();

                let cancelled = false;
                _ghostCancel = () => { cancelled = true; resolve({ items: [] }); };

                _ghostTimer = setTimeout(async () => {
                    _ghostTimer  = null;
                    _ghostCancel = null;

                    const baseUrl = window.MAX_URL;
                    if (!baseUrl || token.isCancellationRequested || cancelled) {
                        return resolve({ items: [] });
                    }

                    const textBefore = model.getValueInRange({
                        startLineNumber: 1, startColumn: 1,
                        endLineNumber: position.lineNumber, endColumn: position.column
                    });

                    // Skip if too short or identical to last request
                    if (textBefore.trim().length < 25 || textBefore === _lastGhostText) {
                        return resolve({ items: [] });
                    }
                    _lastGhostText = textBefore;

                    try {
                        const r = await fetch(`${baseUrl}/api/lsp/ai-complete`, {
                            method: 'POST', headers: authHdrs(),
                            body: JSON.stringify({
                                text:       textBefore.slice(-2000),
                                languageId: model.getLanguageId(),
                                fileName:   model.uri.path?.split('/').pop() ?? ''
                            })
                        });
                        if (token.isCancellationRequested || cancelled) return resolve({ items: [] });
                        const data = await r.json();
                        if (!data.completion || data.completion.trim().length < 2) {
                            return resolve({ items: [] });
                        }
                        resolve({
                            items: [{
                                insertText: data.completion,
                                range: new monaco.Range(
                                    position.lineNumber, position.column,
                                    position.lineNumber, position.column
                                )
                            }],
                            enableForwardStability: true
                        });
                    } catch { resolve({ items: [] }); }
                }, 150);
            });
        },
        freeInlineCompletions: () => {}
    });
}

  if (monacoReady) { cb(); return; }
  monacoLoadCallbacks.push(cb);
  if (monacoLoadCallbacks.length > 1) return;
  const load = () => {
    const req = window.__monacoRequire;
    if (typeof req !== 'function') { setTimeout(load, 50); return; }
    req.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs' } });
    req(['vs/editor/editor.main'], function() {
      // Define Maxwell dark theme
      window.monaco.editor.defineTheme('maxwell-dark', {
        base: 'vs-dark',

        rules: [
          { token: 'comment',    foreground: '4a5568', fontStyle: 'italic' },
          { token: 'keyword',    foreground: 'c084fc' },
          { token: 'string',     foreground: '86efac' },
          { token: 'number',     foreground: 'fbbf24' },
          { token: 'type',       foreground: '67e8f9' },
          { token: 'class',      foreground: '67e8f9' },
          { token: 'function',   foreground: '93c5fd' },
          { token: 'variable',   foreground: 'd4d4e0' },
          { token: 'delimiter',  foreground: 'a78bfa' },

          'editor.foreground':           '#d4d4e0',
          'editor.lineHighlightBackground':'#14141900',
          'editor.lineHighlightBorder':  '#7c3aed18',

          'editorWidget.background':     '#0f0f14',
          'editorWidget.border':         '#2a2a38',
          'editorSuggestWidget.background': '#0f0f14',
          'editorSuggestWidget.border':  '#2a2a38',
          'editorSuggestWidget.selectedBackground': '#7c3aed22',
          'input.background':            '#141419',
          'input.border':                '#2a2a38',

// ── Find in files panel ───────────────────────────────────────
function FindInFiles({ connected, maxUrl, onOpenFile, onClose }) {
  const [q, setQ] = React.useState('');
  const [results, setResults] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const inputRef = React.useRef(null);
  React.useEffect(() => { inputRef.current?.focus(); }, []);

  const search = React.useCallback(async (query) => {
    if (!query.trim() || !connected) return;
    setLoading(true); setResults(null);
    try {
      const escaped = query.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
      // Cross-platform Node.js search — no grep dependency
      const script = `
const fs=require('fs'),path=require('path');
const q=${JSON.stringify(query.toLowerCase())};
const SKIP=new Set(['node_modules','.git','dist','build','coverage','.next']);
const EXT=new Set(['.ts','.js','.tsx','.jsx','.json','.md','.css','.html','.py','.go','.rs','.sh','.env']);
const out=[];
function walk(dir,depth){
  if(depth>6)return;
  let en;try{en=fs.readdirSync(dir,{withFileTypes:true})}catch{return}
  for(const e of en){
    if(SKIP.has(e.name)||e.name.startsWith('.'))continue;
    const full=path.join(dir,e.name);
    if(e.isDirectory())walk(full,depth+1);
    else if(EXT.has(path.extname(e.name).toLowerCase())){
      try{
        const lines=fs.readFileSync(full,'utf8').split('\\n');
        lines.forEach((l,i)=>{if(l.toLowerCase().includes(q))out.push(full.replace(/\\\\/g,'/')+'::'+(i+1)+'::'+l.trim().slice(0,120))});
      }catch{}
    }
    if(out.length>=60)return;
  }
}
walk('.',0);out.forEach(r=>console.log(r));`;
      const r = await fetch(`${maxUrl}/api/tools/shell/run`, {
        method:'POST', headers:authHdrs(),
        body: JSON.stringify({ command: `node -e ${JSON.stringify(script)}`, timeoutMs:15000 })
      });
      const d = await r.json();
      const raw = (d.stdout || d.output || '').trim();
      if (!raw) { setResults([]); setLoading(false); return; }
      const parsed = raw.split('\n').filter(Boolean).map(line => {
        const parts = line.split('::');
        if (parts.length >= 3) return { file: parts[0].replace(/^\.\//,''), line: parseInt(parts[1]), text: parts.slice(2).join('::') };
        return null;
      }).filter(Boolean);
      // Group by file
      const grouped = {};
      parsed.forEach(r => { if (!grouped[r.file]) grouped[r.file] = []; grouped[r.file].push(r); });
      setResults(grouped);
    } catch { setResults({}); }
    setLoading(false);
  }, [connected, maxUrl]);

  const handleKey = e => { if (e.key === 'Enter') search(q); if (e.key === 'Escape') onClose(); };
  const fileCount = results ? Object.keys(results).length : 0;
  const matchCount = results ? Object.values(results).flat().length : 0;

  return (
    <>
      <div className="sb-header">
        <span>Find in Files</span>
        <button className="sb-icon-btn" onClick={onClose} style={{display:'flex'}}>{ICONS.close}</button>
      </div>
      <div className="search-input-wrap">
        <input ref={inputRef} className="search-input" placeholder="Search… (Enter)" value={q}
          onChange={e=>setQ(e.target.value)} onKeyDown={handleKey}/>
        <div style={{marginTop:5,display:'flex',gap:6,alignItems:'center'}}>
          <button onClick={()=>search(q)} style={{padding:'3px 10px',fontSize:11,background:'var(--accent)',border:'none',borderRadius:4,color:'#fff',cursor:'pointer',fontWeight:600}}>Search</button>
          {results!==null&&<span style={{fontSize:10.5,color:'var(--muted)'}}>{matchCount} matches in {fileCount} files</span>}
          {loading&&<span style={{fontSize:10.5,color:'var(--muted)'}}>◌ searching…</span>}
        </div>
      </div>
      <div className="sb-scroll">
        {results!==null&&matchCount===0&&<div style={{padding:'16px 12px',color:'var(--muted)',fontSize:11.5,textAlign:'center'}}>No results</div>}
        {results&&Object.entries(results).map(([file,lines])=>(
          <div key={file}>
            <div className="search-result-file">{file}</div>
            {lines.map((r,i)=>(
              <div key={i} className="search-result-line" onClick={()=>{
                const name=file.split('/').pop();
                onOpenFile({name,path:file,type:'file'});
              }}>
                <span className="srl-num">{r.line}</span>
                <span className="srl-text">{r.text}</span>
              </div>
            ))}
          </div>
        ))}
      </div>
    </>
  );
}

function getMonacoLanguage(fileName) {
  if (!fileName) return 'plaintext';
  const ext = fileName.split('.').pop().toLowerCase();
  const map = {
    ts:'typescript', tsx:'typescript', js:'javascript', jsx:'javascript',
    json:'json', md:'markdown', css:'css', html:'html', sh:'shell',
    py:'python', rs:'rust', go:'go', env:'ini', yml:'yaml', yaml:'yaml',
    sql:'sql', graphql:'graphql', prisma:'prisma',
  };
  return map[ext] || 'plaintext';
}

function MonacoEditor({ fileName, content, onChange, readOnly, langOverride, diagnostics = [] }) {
  const containerRef = React.useRef(null);
  const editorRef    = React.useRef(null);
  const modelRef     = React.useRef(null);

  // Apply language override without recreating the editor
  React.useEffect(() => {
    if (langOverride && modelRef.current && window.monaco) {
      window.monaco.editor.setModelLanguage(modelRef.current, langOverride);
    }
  }, [langOverride]);

  React.useEffect(() => {
    ensureMonaco(() => {
      if (!containerRef.current) return;
      if (editorRef.current) { editorRef.current.dispose(); }
      const lang = langOverride || getMonacoLanguage(fileName);
      const model = window.monaco.editor.createModel(content || '', lang);
      modelRef.current = model;
      const editor = window.monaco.editor.create(containerRef.current, {
        model,
        theme: 'maxwell-dark',
        fontSize: 13,
        fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace",
        fontLigatures: true,
        lineHeight: 22,
        padding: { top: 12, bottom: 12 },
        minimap: { enabled: true, scale: 1 },
        scrollBeyondLastLine: false,
        smoothScrolling: true,
        cursorBlinking: 'smooth',
        cursorSmoothCaretAnimation: 'on',
        renderLineHighlight: 'gutter',
        bracketPairColorization: { enabled: true },
        guides: { bracketPairs: true, indentation: true },
        suggest: { showKeywords: true, showSnippets: true },
        quickSuggestions: { other: true, comments: false, strings: false },
        parameterHints: { enabled: true },
        formatOnPaste: true,
        tabSize: 2,
        insertSpaces: true,
        wordWrap: 'off',
        readOnly: !!readOnly,
        scrollbar: { vertical: 'auto', horizontal: 'auto', verticalScrollbarSize: 6, horizontalScrollbarSize: 6 },
        overviewRulerLanes: 0,
      });
      editorRef.current = editor;
      if (onChange) {
        model.onDidChangeContent(() => {
          onChange(model.getValue());
        });
      }
    });
    return () => {
      if (editorRef.current) { editorRef.current.dispose(); editorRef.current = null; }
      if (modelRef.current) { modelRef.current.dispose(); modelRef.current = null; }
    };
  }, [fileName]);

  // Update diagnostics (squiggles)
  React.useEffect(() => {
    if (modelRef.current && window.monaco) {
      window.monaco.editor.setModelMarkers(modelRef.current, 'maxwell-lsp', (diagnostics || []).map(d => ({
        startLineNumber: d.range.start.line + 1,
        startColumn: d.range.start.character + 1,
        endLineNumber: d.range.end.line + 1,
        endColumn: d.range.end.character + 1,
        message: d.message,
        severity: d.severity === 1 ? window.monaco.MarkerSeverity.Error : 
                  d.severity === 2 ? window.monaco.MarkerSeverity.Warning : 
                  window.monaco.MarkerSeverity.Info
      })));
    }
  }, [diagnostics]);

  // Update content when it changes externally (file switch)
  React.useEffect(() => {
    if (modelRef.current && content !== undefined) {
      const cur = modelRef.current.getValue();
      if (cur !== content) {
        modelRef.current.setValue(content || '');
      }
    }
  }, [content]);

  return <div ref={containerRef} style={{width:'100%',height:'100%',minHeight:300}} />;
}

// ── Diff viewer (Monaco diff editor) ─────────────────────────
function DiffViewer({ fileName, original, modified, onAccept, onReject, onClose }) {
  const containerRef = React.useRef(null);
  const diffEditorRef = React.useRef(null);

  React.useEffect(() => {
    ensureMonaco(() => {
      if (!containerRef.current) return;
      const originalModel  = window.monaco.editor.createModel(original  || '', getMonacoLanguage(fileName));
      const modifiedModel  = window.monaco.editor.createModel(modified  || '', getMonacoLanguage(fileName));
      const diffEditor = window.monaco.editor.createDiffEditor(containerRef.current, {
        theme: 'maxwell-dark',
        fontSize: 13,
        fontFamily: "'JetBrains Mono', monospace",
        readOnly: true,
        renderSideBySide: true,
        ignoreTrimWhitespace: false,
        scrollBeyondLastLine: false,
        minimap: { enabled: false },
      });
      diffEditor.setModel({ original: originalModel, modified: modifiedModel });
      diffEditorRef.current = diffEditor;
    });
    return () => { if (diffEditorRef.current) diffEditorRef.current.dispose(); };
  }, [fileName, original, modified]);

  return (
    <div className="diff-overlay" onClick={onClose}>
      <div className="diff-box" onClick={e=>e.stopPropagation()}>
        <div className="diff-header">
          <span style={{display:'flex'}}>{ICONS.diff}</span>

            <span style={{color:'var(--green)'}}>+ proposed</span>

            <button className="cb-accept-all" onClick={onAccept}>Accept</button>

  'file:write':   [ "MAX just wrote a file! fresh code incoming. 🍫", "new code appeared! choko is inspecting. 🔍", "MAX added something new!" ],
  'file:read':    [ "MAX is reading files. eyes on the case. 👀", "scanning the codebase. MAX is on it!" ],
  'file:replace': [ "MAX is editing. something's getting better. ✏️", "code improvement in progress. MAX is on it." ],
  'shell:run':    [ "MAX fired up the terminal! ⚡", "commands running. choko is listening.", "the terminal is humming. MAX is working. 💪" ],
  'shell:start':  [ "background process started! MAX is multitasking. 🌟", "something is running in the background." ],
  'web:search':   [ "MAX is searching the web. intel incoming. 📡", "gathering info from the internet! 🍫" ],
  'git:commit':   [ "MAX committed the code! nice. 🌿", "fresh commit! choko approves." ],

};

function getChokoReaction(toolAction) {
  const reactions = CHOKO_TOOL_REACTIONS[toolAction];
  if (!reactions) return null;
  return reactions[Math.floor(Math.random() * reactions.length)];
}

class ErrorBoundary extends React.Component {

// ── Persona picker dropdown ───────────────────────────────────────────────
function PersonaPicker({ persona, maxUrl, setMaxStatus, authHdrs, onMuse, onLeaveMuse }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);

  React.useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    if (open) document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);

  const select = async (id) => {
    setOpen(false);
    try {
      await fetch(`${maxUrl}/api/persona`, { method:'POST', headers:authHdrs(), body:JSON.stringify({ persona: id }) });
      setMaxStatus(s => ({ ...s, persona: id }));
      if (id === 'muse') onMuse?.();
      else onLeaveMuse?.();
    } catch {}
  };

  return (
    <div ref={ref} style={{ position:'relative' }}>
      <div className="tb-persona" title="Switch persona" style={{ cursor:'pointer' }} onClick={() => setOpen(o => !o)}>
        <span className="p-name" style={{ color:persona.color, fontFamily:'var(--mono)' }}>{persona.icon}</span>
        <span className="p-name" style={{ color:persona.color }}>{persona.label}</span>
        <span style={{ fontSize:8, color:'var(--muted)', marginLeft:2, opacity:.7 }}>▾</span>
      </div>
      {open && (
        <div style={{
          position:'absolute', top:'calc(100% + 6px)', right:0, zIndex:300,
          background:'var(--s2)', border:'1px solid var(--border)', borderRadius:10,
          boxShadow:'0 8px 32px rgba(0,0,0,.5)', padding:'6px', minWidth:260,
        }}>
          {Object.entries(PERSONAS).map(([id, p]) => (
            <div key={id} onClick={() => select(id)}
              style={{
                padding:'8px 10px', borderRadius:7, cursor:'pointer',
                background: persona.label === p.label ? 'var(--s4)' : 'transparent',
                transition:'background .12s',
              }}
              onMouseEnter={e => e.currentTarget.style.background='var(--s3)'}
              onMouseLeave={e => e.currentTarget.style.background=persona.label===p.label?'var(--s4)':'transparent'}
            >
              <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:3 }}>
                <span style={{ color:p.color, fontFamily:'var(--mono)', fontSize:13 }}>{p.icon}</span>
                <span style={{ fontSize:12, fontWeight:600, color:p.color }}>{p.label}</span>

              <div style={{ fontSize:10.5, color:'var(--muted)', lineHeight:1.5, paddingLeft:20 }}>{p.desc}</div>
            </div>
          ))}
        </div>
