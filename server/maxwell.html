<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:       #0a0a0d;
  --s1:       #0f0f14;
  --s2:       #141419;
  --s3:       #1a1a22;
  --s4:       #22222e;
  --border:   #2a2a38;
  --border2:  #333345;
  --text:     #d4d4e0;
  --muted:    #6b6b82;
  --muted2:   #4a4a60;
  --accent:   #7c3aed;
  --accent2:  #9d5cf6;
  --aglow:    rgba(124,58,237,0.15);
  --aglow2:   rgba(124,58,237,0.08);
  --green:    #10b981;
  --amber:    #f59e0b;
  --red:      #ef4444;
  --blue:     #60a5fa;
  --pink:     #f472b6;
  --mono:     'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  --ui:       'Inter', system-ui, sans-serif;
}

html,body,#root { height:100%; background:var(--bg); color:var(--text); font-family:var(--ui); font-size:13px; overflow:hidden; }

/* ── Scrollbars ── */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--border2); }

/* ── Layout shell ── */
.ide { display:flex; flex-direction:column; height:100vh; }

/* ── Title bar ── */
.titlebar {
  height:38px; display:flex; align-items:center; gap:0;
  background:var(--s1); border-bottom:1px solid var(--border);
  flex-shrink:0; user-select:none;
}
.titlebar-drag { -webkit-app-region:drag; flex:1; display:flex; align-items:center; }
.tb-logo { font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:4px; color:var(--accent2); padding:0 16px; }
.tb-sep { width:1px; height:16px; background:var(--border); margin:0 4px; }
.tb-project { font-size:12px; color:var(--muted); padding:0 12px; display:flex; align-items:center; gap:6px; }
.tb-project span { color:var(--text); font-weight:500; }
.tb-spacer { flex:1; }
.tb-status { display:flex; align-items:center; gap:10px; padding:0 12px; }
.tb-persona { display:flex; align-items:center; gap:5px; font-size:11px; padding:3px 8px; border-radius:4px; background:var(--s3); border:1px solid var(--border); }
.tb-persona .p-icon { font-size:13px; }
.tb-persona .p-name { color:var(--text); font-weight:500; letter-spacing:.3px; }
.tension-wrap { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
.tension-track { width:60px; height:4px; background:var(--s4); border-radius:2px; overflow:hidden; }
.tension-bar { height:100%; background:var(--accent); border-radius:2px; transition:width .8s ease; }
.conn-dot { width:7px; height:7px; border-radius:50%; background:var(--muted2); flex-shrink:0; }
.conn-dot.live { background:var(--green); box-shadow:0 0 6px rgba(16,185,129,.6); animation:pulse 2.5s infinite; }
.conn-dot.err  { background:var(--red); }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.soma-pill { display:flex; align-items:center; gap:5px; font-size:11px; padding:3px 8px; border-radius:4px; background:var(--s3); border:1px solid var(--border); color:var(--muted); cursor:default; }
.soma-pill.live { border-color:rgba(16,185,129,.35); color:var(--green); }
.soma-pill .soma-dot { width:6px; height:6px; border-radius:50%; background:var(--muted2); flex-shrink:0; }
.soma-pill.live .soma-dot { background:var(--green); box-shadow:0 0 5px rgba(16,185,129,.7); animation:pulse 2.5s infinite; }

/* ── Main body ── */
.ide-body { display:flex; flex:1; overflow:hidden; }

/* ── Activity bar ── */
.actbar {
  width:44px; flex-shrink:0; background:var(--s1); border-right:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; padding:8px 0; gap:2px;
}
.act-btn {
  width:34px; height:34px; border-radius:7px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; background:transparent; border:none; color:var(--muted); transition:all .15s;
  font-size:16px; position:relative;
}
.act-btn:hover { background:var(--s3); color:var(--text); }
.act-btn.active { background:var(--aglow); color:var(--accent2); }
.act-btn.active::before { content:''; position:absolute; left:0; top:50%; transform:translateY(-50%); width:2px; height:18px; background:var(--accent); border-radius:0 2px 2px 0; }
.act-spacer { flex:1; }
.act-badge { position:absolute; top:3px; right:3px; width:8px; height:8px; border-radius:50%; background:var(--accent); border:1.5px solid var(--s1); }

/* ── Sidebar ── */
.sidebar {
  width:220px; flex-shrink:0; background:var(--s2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
.sb-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 12px; font-size:10px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.sb-actions { display:flex; gap:2px; }
.sb-icon-btn { width:22px; height:22px; border-radius:4px; display:flex; align-items:center; justify-content:center; border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:14px; transition:all .12s; }
.sb-icon-btn:hover { background:var(--s4); color:var(--text); }
.sb-scroll { flex:1; overflow-y:auto; }

/* File tree */
.tree-item {
  display:flex; align-items:center; gap:5px; padding:3px 8px; cursor:pointer;
  border-radius:4px; margin:0 4px; transition:background .1s; user-select:none;
  font-size:12.5px;
}
.tree-item:hover { background:var(--s3); }
.tree-item.active { background:var(--aglow); color:var(--accent2); }
.tree-item .ti-icon { font-size:13px; flex-shrink:0; }
.tree-item .ti-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tree-item .ti-ext { font-size:10px; color:var(--muted2); }
.tree-group { padding:4px 0; }
.tree-group-label {
  padding:5px 12px 3px; font-size:10px; font-weight:700; letter-spacing:.8px;
  text-transform:uppercase; color:var(--muted2);
}
.tree-indent { padding-left:14px; }

/* Goals */
.goal-item {
  display:flex; align-items:flex-start; gap:7px; padding:6px 12px;
  border-bottom:1px solid var(--border); transition:background .1s;
}
.goal-item:hover { background:var(--s3); }
.goal-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); margin-top:4px; flex-shrink:0; }
.goal-dot.done { background:var(--green); }
.goal-text { font-size:12px; line-height:1.45; flex:1; }
.goal-done-btn { width:20px; height:20px; border-radius:3px; border:none; background:transparent; color:var(--muted2); cursor:pointer; font-size:12px; transition:all .12s; flex-shrink:0; }
.goal-done-btn:hover { color:var(--green); }
.add-goal-form { padding:8px 12px; display:flex; gap:6px; border-top:1px solid var(--border); }
.add-goal-input {
  flex:1; background:var(--s3); border:1px solid var(--border); color:var(--text);
  padding:5px 8px; border-radius:5px; font-size:11.5px; font-family:var(--ui); outline:none;
}
.add-goal-input:focus { border-color:var(--accent); }
.add-goal-btn { background:var(--accent); border:none; color:#fff; padding:5px 8px; border-radius:5px; font-size:11px; cursor:pointer; font-weight:600; }

/* ── Editor pane ── */
.editor-pane { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }

/* Tabs */
.tabs-bar {
  display:flex; align-items:center; background:var(--s1); border-bottom:1px solid var(--border);
  flex-shrink:0; overflow-x:auto; height:34px;
}
.tabs-bar::-webkit-scrollbar { height:0; }
.tab {
  display:flex; align-items:center; gap:6px; padding:0 12px; height:34px;
  border-right:1px solid var(--border); cursor:pointer; font-size:12px;
  white-space:nowrap; transition:background .1s; flex-shrink:0;
  color:var(--muted); position:relative;
}
.tab:hover { background:var(--s2); color:var(--text); }
.tab.active { background:var(--bg); color:var(--text); }
.tab.active::after { content:''; position:absolute; bottom:0; left:0; right:0; height:1px; background:var(--accent); }
.tab-icon { font-size:12px; }
.tab-close { width:16px; height:16px; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:11px; color:transparent; transition:all .1s; }
.tab:hover .tab-close { color:var(--muted); }
.tab-close:hover { background:var(--s4); color:var(--text) !important; }
.tab-welcome { margin-left:auto; padding:0 10px; color:var(--muted2); font-size:11px; font-style:italic; }

/* Code editor */
.code-editor-wrap { flex:1; display:flex; overflow:hidden; position:relative; }
.line-numbers {
  width:44px; flex-shrink:0; background:var(--s1); border-right:1px solid var(--border);
  overflow:hidden; padding:10px 0; text-align:right; user-select:none;
}
.line-num { font-family:var(--mono); font-size:12px; color:var(--muted2); line-height:1.7; padding:0 8px; }
.code-area {
  flex:1; overflow:auto; padding:10px 16px;
  font-family:var(--mono); font-size:12.5px; line-height:1.7;
  color:var(--text); background:var(--bg); outline:none; white-space:pre;
  tab-size:2;
}
.code-area::-webkit-scrollbar { width:6px; height:6px; }

/* Syntax tokens */
.t-kw   { color:#c084fc; }
.t-str  { color:#86efac; }
.t-num  { color:#fbbf24; }
.t-cmt  { color:#4a5568; font-style:italic; }
.t-type { color:#67e8f9; }
.t-fn   { color:#93c5fd; }
.t-op   { color:#f0abfc; }
.t-prop { color:#fda4af; }

/* Welcome screen */
.welcome {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; color:var(--muted); padding:40px;
}
.welcome-logo { font-family:var(--mono); font-size:32px; font-weight:600; letter-spacing:8px; color:var(--accent); opacity:.4; }
.welcome-hint { font-size:12px; text-align:center; line-height:1.8; }
.welcome-hint kbd { background:var(--s3); border:1px solid var(--border); padding:2px 6px; border-radius:3px; font-family:var(--mono); font-size:11px; color:var(--text); }

/* ── Bottom panel ── */
.bottom-panel { display:flex; flex-direction:column; border-top:1px solid var(--border); background:var(--s1); flex-shrink:0; }
.bp-resize { height:4px; cursor:ns-resize; background:transparent; flex-shrink:0; }
.bp-resize:hover { background:var(--accent); opacity:.5; }
.bp-tabs { display:flex; align-items:center; border-bottom:1px solid var(--border); height:30px; padding:0 8px; gap:0; }
.bp-tab { padding:0 12px; height:30px; display:flex; align-items:center; font-size:11.5px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; transition:all .12s; }
.bp-tab:hover { color:var(--text); }
.bp-tab.active { color:var(--text); border-bottom-color:var(--accent); }
.bp-close { margin-left:auto; }
.terminal-body { flex:1; overflow-y:auto; padding:8px 12px; font-family:var(--mono); font-size:12px; line-height:1.65; }
.term-line { display:flex; gap:8px; }
.term-prompt { color:var(--accent2); flex-shrink:0; }
.term-cmd { color:var(--text); }
.term-out { color:var(--muted); }
.term-err { color:var(--red); }
.term-ok  { color:var(--green); }
.term-info{ color:var(--blue); }
.term-cursor { display:inline-block; width:8px; height:14px; background:var(--accent); vertical-align:middle; animation:blink 1s infinite; }
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.term-explain { display:block; margin:4px 0 6px 0; padding:6px 10px; background:rgba(96,165,250,.08); border-left:2px solid var(--blue); border-radius:0 4px 4px 0; color:var(--blue); font-size:11.5px; line-height:1.55; white-space:pre-wrap; }
/* @mention picker */
.at-picker { position:absolute; bottom:100%; left:0; right:0; background:var(--s2); border:1px solid var(--border); border-radius:8px 8px 0 0; max-height:180px; overflow-y:auto; z-index:100; }
.at-item { display:flex; align-items:center; gap:8px; padding:6px 12px; cursor:pointer; font-size:12px; transition:background .1s; }
.at-item:hover,.at-item.active { background:var(--aglow); }
.at-item-icon { color:var(--muted); font-size:13px; }
.at-item-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.at-item-hint { font-size:10.5px; color:var(--muted2); }
.mention-badge { display:inline-flex; align-items:center; gap:3px; background:rgba(124,58,237,.18); border:1px solid rgba(124,58,237,.35); border-radius:4px; padding:0 5px; font-size:11px; color:var(--accent2); margin:0 2px; }
.mention-chips { display:flex; flex-wrap:wrap; gap:4px; padding:4px 12px 0; }

/* ── MAX chat panel ── */
.max-panel {
  width:380px; flex-shrink:0; border-left:1px solid var(--border);
  display:flex; flex-direction:column; background:var(--s1);
}
.mp-header {
  display:flex; align-items:center; gap:10px; padding:0 14px; height:38px;
  border-bottom:1px solid var(--border); flex-shrink:0;
}
.mp-title { font-size:12px; font-weight:700; letter-spacing:2px; color:var(--accent2); font-family:var(--mono); }
.mp-mode { margin-left:auto; display:flex; gap:4px; }
.mp-mode-btn {
  padding:2px 8px; border-radius:4px; font-size:10.5px; border:1px solid var(--border);
  background:transparent; color:var(--muted); cursor:pointer; transition:all .12s;
  font-weight:600; letter-spacing:.3px;
}
.mp-mode-btn:hover { border-color:var(--border2); color:var(--text); }
.mp-mode-btn.active { background:var(--aglow); border-color:var(--accent); color:var(--accent2); }

/* Messages */
.mp-messages { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:14px; }
.msg { display:flex; gap:8px; animation:fadeUp .2s ease; }
.msg.user { flex-direction:row-reverse; }
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
.msg-avatar {
  width:26px; height:26px; border-radius:7px; display:flex; align-items:center;
  justify-content:center; font-size:13px; flex-shrink:0; margin-top:1px;
}
.msg.user .msg-avatar { background:var(--accent); color:#fff; font-size:11px; font-weight:700; }
.msg.max .msg-avatar  { background:var(--s3); border:1px solid var(--border); }
.msg-body { flex:1; min-width:0; }
.msg-meta { font-size:10px; color:var(--muted2); margin-bottom:3px; display:flex; align-items:center; gap:6px; }
.msg.user .msg-meta { justify-content:flex-end; }
.msg-persona { font-size:10px; font-weight:600; letter-spacing:.3px; }
.bubble {
  padding:8px 12px; border-radius:8px; line-height:1.65; font-size:12.5px;
  word-break:break-word;
}
.msg.user .bubble { background:#1e1040; border:1px solid #3d1f80; color:var(--text); border-radius:8px 2px 8px 8px; }
.msg.max  .bubble { background:var(--s2); border:1px solid var(--border); border-radius:2px 8px 8px 8px; }

/* Markdown in bubbles */
.bubble p { margin:4px 0; }
.bubble p:first-child { margin-top:0; }
.bubble p:last-child  { margin-bottom:0; }
.bubble strong { font-weight:600; color:#e0e0f0; }
.bubble em { font-style:italic; color:#b8a9f0; }
.bubble code { background:#0a0a10; border:1px solid var(--border); padding:1px 4px; border-radius:3px; font-family:var(--mono); font-size:11.5px; color:#c4b5fd; }
.bubble pre { background:#05050a; border:1px solid var(--border); border-radius:6px; padding:10px; margin:6px 0; overflow-x:auto; }
.bubble pre code { background:none; border:none; padding:0; font-size:11.5px; }
.bubble ul { padding-left:16px; margin:4px 0; }
.bubble li { margin:2px 0; }
.bubble h2 { font-size:13px; font-weight:700; margin:6px 0 3px; color:#e0e0f0; }
.bubble h3, .bubble h4 { font-size:12.5px; font-weight:700; margin:6px 0 3px; color:#d0d0e8; }

/* Tool call chips */
.tool-call {
  display:flex; align-items:center; gap:6px; padding:5px 9px; margin:4px 0;
  background:var(--bg); border:1px solid var(--border); border-radius:5px;
  font-family:var(--mono); font-size:11px; color:var(--muted);
}
.tool-call .tc-icon { color:var(--amber); }
.tool-call .tc-path { color:var(--accent2); }
.tool-call .tc-ok   { color:var(--green); margin-left:auto; }

/* ── Inline tool call animation blocks ── */
.tcb { display:flex; align-items:center; gap:8px; padding:5px 10px; margin:3px 0;
  border-radius:6px; font-family:var(--mono); font-size:11px;
  border:1px solid var(--border); background:var(--s3);
  transition:border-color .3s, background .3s; }
.tcb.tcb-running { border-color:rgba(124,58,237,.5); background:rgba(124,58,237,.07); animation:tcb-pulse 1.8s ease-in-out infinite; }
.tcb.tcb-done    { border-color:rgba(16,185,129,.35); background:rgba(16,185,129,.05); }
.tcb.tcb-error   { border-color:rgba(239,68,68,.35);  background:rgba(239,68,68,.05); }
@keyframes tcb-pulse { 0%,100%{border-color:rgba(124,58,237,.3)} 50%{border-color:rgba(124,58,237,.7)} }
.tcb-icon { font-size:13px; flex-shrink:0; }
.tcb-verb { color:var(--muted); font-size:10.5px; flex-shrink:0; min-width:56px; }
.tcb-param { color:var(--accent2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
.tcb-state { margin-left:auto; flex-shrink:0; font-size:11px; display:flex; align-items:center; gap:4px; }
.tcb-spinner { display:inline-block; animation:tcb-spin .8s linear infinite; }
@keyframes tcb-spin { to { transform:rotate(360deg); } }

/* ── Agent task tracker bar ── */
.atb { margin:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--s2); overflow:hidden; transition:all .3s; }
.atb.atb-running { border-color:rgba(124,58,237,.4); animation:tcb-pulse 2s ease-in-out infinite; }
.atb.atb-done    { border-color:rgba(16,185,129,.4); background:rgba(16,185,129,.04); animation:none; }
.atb.atb-failed  { border-color:rgba(239,68,68,.4);  background:rgba(239,68,68,.04);  animation:none; }
.atb-header { display:flex; align-items:center; gap:8px; padding:7px 12px; font-size:12px; font-weight:600; }
.atb-icon { font-size:14px; flex-shrink:0; }
.atb-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.atb-badge { font-size:10px; font-weight:700; padding:2px 6px; border-radius:3px; flex-shrink:0; }
.atb-badge.running { background:rgba(124,58,237,.2); color:var(--accent2); }
.atb-badge.done    { background:rgba(16,185,129,.2);  color:var(--green); }
.atb-badge.failed  { background:rgba(239,68,68,.2);   color:var(--red); }
.atb-steps { padding:0 12px 8px; display:flex; flex-direction:column; gap:2px; }
.atb-step { display:flex; align-items:center; gap:6px; font-size:10.5px; font-family:var(--mono); color:var(--muted); padding:2px 0; }
.atb-step.done    { color:var(--text); }
.atb-step.failed  { color:var(--red); }
.atb-step.running { color:var(--accent2); }
.atb-step-icon { flex-shrink:0; width:14px; text-align:center; }
.atb-step-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }

/* ── Agent activity message — Cursor-style live tool stream in chat ── */
.aam { margin:2px 0 10px; border-radius:10px; border:1px solid var(--border);
       background:rgba(12,12,20,.7); overflow:hidden; }
.aam.running { border-color:rgba(124,58,237,.5); box-shadow:0 0 12px rgba(124,58,237,.08); }
.aam.done    { border-color:rgba(16,185,129,.3); }
.aam.failed  { border-color:rgba(239,68,68,.3); }
.aam-header  { display:flex; align-items:center; gap:8px; padding:8px 12px 7px;
               background:rgba(255,255,255,.02); border-bottom:1px solid rgba(255,255,255,.05); }
.aam-hicon   { font-size:15px; flex-shrink:0; }
.aam-spinner { display:inline-block; animation:tcb-spin .75s linear infinite; }
.aam-title   { flex:1; font-size:12px; font-weight:600; color:var(--text);
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.aam-badge   { font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px;
               flex-shrink:0; letter-spacing:.03em; }
.aam-badge.running { background:rgba(124,58,237,.18); color:#a78bfa; }
.aam-badge.done    { background:rgba(16,185,129,.15);  color:#34d399; }
.aam-badge.failed  { background:rgba(239,68,68,.15);   color:#f87171; }
.aam-steps   { display:flex; flex-direction:column; }
.aam-step    { display:flex; align-items:center; gap:6px; padding:5px 12px;
               font-family:var(--mono); font-size:11px; color:#475569;
               border-bottom:1px solid rgba(255,255,255,.025); transition:background .12s; }
.aam-step:last-child { border-bottom:none; }
.aam-step.running { background:rgba(124,58,237,.05); color:var(--text); }
.aam-step.done    { color:#4b5563; }
.aam-step.failed  { color:#f87171; background:rgba(239,68,68,.04); }
.aam-step-status  { flex-shrink:0; width:13px; font-size:10px; text-align:center; }
.aam-step-icon    { flex-shrink:0; font-size:12px; }
.aam-step-verb    { flex-shrink:0; font-size:10px; min-width:52px; }
.aam-step-file    { flex-shrink:0; font-weight:700; font-size:11px;
                    max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.aam-step-desc    { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
                    color:#374151; font-size:10.5px; }
.aam-summary      { padding:8px 12px 9px; font-size:12px; color:var(--text); line-height:1.5;
                    border-top:1px solid rgba(255,255,255,.05);
                    background:rgba(16,185,129,.03); }

/* Thinking indicator */
.thinking { display:flex; align-items:center; gap:8px; padding:6px 12px; }
.thinking-dots span { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--accent); margin:0 2px; animation:thinking .8s infinite; }
.thinking-dots span:nth-child(2) { animation-delay:.15s; }
.thinking-dots span:nth-child(3) { animation-delay:.3s; }
@keyframes thinking{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.thinking-label { font-size:11px; color:var(--muted); font-style:italic; }

/* Typing cursor + float-fab pulse */
.typing-cursor { display:inline-block; width:2px; height:.85em; background:var(--accent); margin-left:2px; vertical-align:text-bottom; animation:blink 1s step-end infinite; border-radius:1px; }
@keyframes blink{50%{opacity:0}}
.float-fab.thinking-fab { animation:fab-pulse 1.6s ease-in-out infinite; }
@keyframes fab-pulse{
  0%,100%{box-shadow:0 4px 20px rgba(124,58,237,.5)}
  50%{box-shadow:0 4px 32px rgba(255,140,0,.7),0 0 0 5px rgba(255,140,0,.18)}
}

/* Insight chip */
.insight {
  padding:6px 10px; background:var(--aglow2); border:1px solid rgba(124,58,237,.3);
  border-radius:6px; font-size:11.5px; color:var(--muted); margin:2px 0;
}
.insight .ins-label { color:var(--accent2); font-weight:600; font-size:10px; letter-spacing:.5px; margin-bottom:2px; text-transform:uppercase; }

/* Input */
.mp-input-wrap { border-top:1px solid var(--border); padding:10px 12px; background:var(--s1); flex-shrink:0; }
.cmd-mode-badge {
  display:inline-flex; align-items:center; gap:4px; padding:2px 8px; margin-bottom:6px;
  background:var(--aglow); border:1px solid rgba(124,58,237,.3); border-radius:4px;
  font-size:10.5px; color:var(--accent2); font-weight:700; letter-spacing:.5px;
}
.cmd-mode-badge button { background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:0 0 0 4px; }
.input-row { display:flex; gap:8px; align-items:flex-end; }
.mp-textarea {
  flex:1; background:var(--s3); border:1px solid var(--border); color:var(--text);
  padding:8px 12px; border-radius:8px; font-size:13px; resize:none; outline:none;
  font-family:var(--ui); line-height:1.5; min-height:38px; max-height:110px;
  transition:border-color .15s;
}
.mp-textarea:focus { border-color:var(--accent); box-shadow:0 0 0 2px var(--aglow); }
.mp-textarea::placeholder { color:var(--muted2); }
.send-btn {
  width:34px; height:34px; border-radius:7px; background:var(--accent); border:none;
  color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:15px; transition:all .15s; flex-shrink:0;
}
.send-btn:hover { background:var(--accent2); }
.send-btn:disabled { opacity:.35; cursor:not-allowed; }

/* Slash command picker */
.slash-picker {
  position:absolute; bottom:calc(100% + 4px); left:0; right:0;
  background:var(--s2); border:1px solid var(--border); border-radius:8px;
  overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,.5);
}
.slash-item {
  display:flex; align-items:center; gap:10px; padding:7px 12px;
  cursor:pointer; transition:background .1s; font-size:12px;
}
.slash-item:hover, .slash-item.sel { background:var(--aglow); }
.slash-item .sc-cmd { color:var(--accent2); font-family:var(--mono); font-weight:600; min-width:80px; }
.slash-item .sc-desc { color:var(--muted); }

/* Status bar */
.statusbar {
  height:25px; display:flex; align-items:center; gap:0;
  background:var(--s2); color:var(--muted); font-size:11px;
  border-top:1px solid var(--border); flex-shrink:0; padding:0 10px;
}
.sb-item { display:flex; align-items:center; gap:4px; padding:0 8px; border-right:1px solid var(--border); height:25px; }
.sb-branch-text { max-width:140px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.sb-item:last-child { border-right:none; }
.sb-spacer { flex:1; }
.sb-conn { display:flex; align-items:center; gap:4px; padding:0 8px; }

/* No connection overlay */
.no-conn {
  position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
  background:var(--s2); border:1px solid var(--border); border-radius:8px;
  padding:10px 16px; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px;
  box-shadow:0 4px 16px rgba(0,0,0,.4); white-space:nowrap;
}
.no-conn .nc-dot { width:7px; height:7px; border-radius:50%; background:var(--red); flex-shrink:0; }


/* ── Pending changes banner ── */
.changes-banner {
  display:flex; align-items:center; gap:10px; padding:0 14px; height:38px;
  background:rgba(245,158,11,.08); border-bottom:2px solid rgba(245,158,11,.35);
  flex-shrink:0; animation:fadeUp .2s ease;
}
.changes-banner .cb-label { font-size:12px; color:var(--amber); font-weight:600; display:flex; align-items:center; gap:6px; flex:1; }
.cb-accept-all { padding:4px 14px; border-radius:5px; background:rgba(16,185,129,.15); border:1px solid rgba(16,185,129,.4); color:var(--green); font-size:11.5px; font-weight:700; cursor:pointer; transition:all .15s; }
.cb-accept-all:hover { background:rgba(16,185,129,.28); }
.cb-reject-all { padding:4px 12px; border-radius:5px; background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:var(--red); font-size:11.5px; font-weight:700; cursor:pointer; transition:all .15s; }
.cb-reject-all:hover { background:rgba(239,68,68,.2); }
/* ── Tool chip accept/reject ── */
.tc-actions { display:flex; gap:4px; margin-left:auto; }
.tc-accept { width:22px; height:22px; border-radius:4px; border:none; background:rgba(16,185,129,.12); color:var(--green); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; transition:all .12s; }
.tc-accept:hover { background:rgba(16,185,129,.28); }
.tc-reject { width:22px; height:22px; border-radius:4px; border:none; background:rgba(239,68,68,.1); color:var(--red); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; transition:all .12s; }
.tc-reject:hover { background:rgba(239,68,68,.2); }
.tc-accepted { color:var(--green); font-size:11px; font-weight:700; display:flex; align-items:center; gap:3px; margin-left:auto; }
.tc-rejected { color:var(--muted2); font-size:11px; font-weight:700; text-decoration:line-through; margin-left:auto; }


/* ── Model picker pill (titlebar) ── */
.model-pill {
  display:flex; align-items:center; gap:6px; padding:4px 10px;
  background:var(--s3); border:1px solid var(--border); border-radius:6px;
  cursor:pointer; font-size:11.5px; font-weight:600; transition:all .15s;
  user-select:none; position:relative;
}
.model-pill:hover { border-color:var(--border2); background:var(--s4); }
.model-pill .mp-tier { font-weight:800; letter-spacing:.3px; }
.model-pill .mp-name { color:var(--muted); font-weight:400; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.model-pill .mp-caret { color:var(--muted2); font-size:9px; }
.model-dropdown {
  position:absolute; top:calc(100% + 6px); left:0; width:320px;
  background:var(--s2); border:1px solid var(--border); border-radius:10px;
  box-shadow:0 8px 32px rgba(0,0,0,.6); z-index:300;
  animation:popUp .15s ease;
}
.md-scroll-area {
  overflow-y:auto; max-height:320px;
}
.md-scroll-area::-webkit-scrollbar { width:4px; }
.md-scroll-area::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
.md-section { padding:8px 0; border-bottom:1px solid var(--border); }
.md-section:last-child { border-bottom:none; }
.md-section-label { padding:6px 14px 4px; font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted2); }
.md-row {
  display:flex; align-items:center; gap:10px; padding:7px 14px;
  cursor:pointer; transition:background .1s;
}
.md-row:hover { background:var(--s3); }
.md-row.active { background:var(--aglow); }
.md-row .mr-icon { font-size:15px; width:22px; text-align:center; flex-shrink:0; font-family:var(--mono); }
.md-row .mr-info { flex:1; min-width:0; }
.md-row .mr-name { font-size:12px; font-weight:600; }
.md-row .mr-desc { font-size:10.5px; color:var(--muted); margin-top:1px; }
.md-row .mr-badge {
  font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:3px;
  letter-spacing:.4px; flex-shrink:0;
}
.badge-free   { background:rgba(16,185,129,.12); color:var(--green); border:1px solid rgba(16,185,129,.25); }
.badge-fast   { background:rgba(96,165,250,.12); color:var(--blue);  border:1px solid rgba(96,165,250,.25); }
.badge-smart  { background:rgba(124,58,237,.12); color:var(--accent2); border:1px solid rgba(124,58,237,.25); }
.badge-genius { background:rgba(244,114,182,.12); color:var(--pink); border:1px solid rgba(244,114,182,.25); }
.md-credits-bar {
  padding:10px 14px; border-top:1px solid var(--border);
  background:var(--bg);
}
.mcb-row { display:flex; align-items:center; justify-content:space-between; font-size:11px; margin-bottom:5px; }
.mcb-label { color:var(--muted); }
.mcb-val { color:var(--text); font-weight:600; font-family:var(--mono); }
.mcb-track { height:5px; background:var(--s4); border-radius:3px; overflow:hidden; }
.mcb-fill  { height:100%; border-radius:3px; transition:width .4s ease; }

/* ── Settings modal tabs ── */
.settings-tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:16px; }
.stab { padding:7px 14px; font-size:12px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; transition:all .12s; }
.stab:hover { color:var(--text); }
.stab.active { color:var(--text); border-bottom-color:var(--accent); }
.settings-section { margin-bottom:18px; }
.ss-label { font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted2); margin-bottom:8px; }
.ss-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
.ss-row:last-child { border-bottom:none; }
.ss-key { font-size:12.5px; color:var(--text); }
.ss-val { font-size:12px; color:var(--muted); }
.settings-input {
  background:var(--s3); border:1px solid var(--border); color:var(--text);
  padding:5px 8px; border-radius:5px; font-size:12px; font-family:var(--mono);
  outline:none; transition:border-color .15s; width:100%;
}
.settings-input:focus { border-color:var(--accent); }
.settings-input-row { display:flex; gap:6px; margin-bottom:8px; }
.key-status { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.model-local-row {
  display:flex; align-items:center; gap:8px; padding:6px 0;
  border-bottom:1px solid var(--border); font-size:12px;
}
.model-local-row:last-child { border-bottom:none; }
.mlr-name { flex:1; font-family:var(--mono); font-size:11.5px; }
.mlr-size { color:var(--muted); font-size:11px; width:40px; text-align:right; }
.mlr-pull { padding:3px 8px; border-radius:4px; font-size:10.5px; font-weight:600; cursor:pointer; border:1px solid; transition:all .15s; }
.mlr-pull.installed { background:rgba(16,185,129,.1); color:var(--green); border-color:rgba(16,185,129,.3); }
.mlr-pull.available { background:transparent; color:var(--muted); border-color:var(--border); }
.mlr-pull.available:hover { border-color:var(--accent); color:var(--accent2); }
.mlr-pull.pulling { background:rgba(245,158,11,.1); color:var(--amber); border-color:rgba(245,158,11,.3); animation:pulse 1s infinite; }
.usage-bar-wrap { margin-bottom:12px; }
.usage-bar-label { display:flex; justify-content:space-between; font-size:11px; margin-bottom:5px; }
.usage-track { height:8px; background:var(--s4); border-radius:4px; overflow:hidden; }
.usage-fill  { height:100%; border-radius:4px; }
.usage-breakdown { display:flex; flex-direction:column; gap:4px; }
.ub-row { display:flex; align-items:center; gap:8px; font-size:11.5px; }
.ub-dot { width:8px; height:8px; border-radius:2px; flex-shrink:0; }
.ub-name { flex:1; color:var(--muted); }
.ub-val { color:var(--text); font-family:var(--mono); font-size:11px; }


/* ── Auto-route / model badge ── */
.msg-model-badge {
  display:inline-flex; align-items:center; gap:4px;
  font-size:9.5px; font-weight:700; letter-spacing:.4px;
  padding:1px 6px; border-radius:3px; margin-left:4px;
  text-transform:uppercase; opacity:.8;
}
.mmb-local  { background:rgba(16,185,129,.1); color:var(--green); border:1px solid rgba(16,185,129,.2); }
.mmb-cloud  { background:rgba(124,58,237,.1); color:var(--accent2); border:1px solid rgba(124,58,237,.2); }
.mmb-genius { background:rgba(244,114,182,.1); color:var(--pink); border:1px solid rgba(244,114,182,.2); }
.routing-chip {
  display:flex; align-items:center; gap:5px; padding:3px 8px;
  background:var(--bg); border:1px solid var(--border); border-radius:4px;
  font-size:10.5px; color:var(--muted); margin-bottom:5px; width:fit-content;
}
.routing-chip .rc-local { color:var(--green); font-weight:700; }
.routing-chip .rc-cloud { color:var(--accent2); font-weight:700; }

/* ── Token savings bar ── */
.savings-bar {
  display:flex; align-items:center; gap:8px; padding:5px 12px;
  background:rgba(16,185,129,.05); border-bottom:1px solid rgba(16,185,129,.15);
  font-size:11px; flex-shrink:0;
}
.sb-saved { color:var(--green); font-weight:700; display:flex; align-items:center; gap:4px; }
.sb-track { flex:1; height:4px; background:var(--s4); border-radius:2px; overflow:hidden; }
.sb-fill  { height:100%; background:var(--green); border-radius:2px; transition:width .6s ease; }
.sb-label { color:var(--muted); font-size:10.5px; }

/* ── Setup wizard ── */
.setup-modal { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:400; display:flex; align-items:center; justify-content:center; }
.setup-card {
  background:var(--s1); border:1px solid var(--border); border-radius:14px;
  width:480px; overflow:hidden; box-shadow:0 12px 48px rgba(0,0,0,.7);
  animation:popUp .2s ease;
}
.setup-header { background:var(--s2); padding:20px 24px; border-bottom:1px solid var(--border); }
.setup-header h2 { font-size:16px; font-weight:700; margin-bottom:4px; }
.setup-header p  { font-size:12.5px; color:var(--muted); line-height:1.6; }
.setup-steps { padding:20px 24px; display:flex; flex-direction:column; gap:14px; }
.setup-step {
  display:flex; gap:14px; align-items:flex-start;
  padding:12px 14px; border-radius:8px; border:1px solid var(--border);
  background:var(--s2); transition:all .2s;
}
.setup-step.done  { border-color:rgba(16,185,129,.4); background:rgba(16,185,129,.05); }
.setup-step.active{ border-color:rgba(124,58,237,.4); background:var(--aglow); }
.step-num {
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-size:11px; font-weight:800; flex-shrink:0;
  border:2px solid var(--border); color:var(--muted); background:var(--s3);
}
.setup-step.done  .step-num { background:var(--green); border-color:var(--green); color:#fff; }
.setup-step.active .step-num { background:var(--accent); border-color:var(--accent); color:#fff; }
.step-content { flex:1; }
.step-title { font-size:13px; font-weight:600; margin-bottom:3px; }
.step-desc  { font-size:11.5px; color:var(--muted); line-height:1.5; }
.step-action { margin-top:8px; display:flex; gap:6px; align-items:center; }
.step-btn {
  padding:5px 14px; border-radius:6px; font-size:12px; font-weight:600;
  cursor:pointer; transition:all .15s; border:none;
}
.step-btn-primary { background:var(--accent); color:#fff; }
.step-btn-primary:hover { background:var(--accent2); }
.step-btn-secondary { background:var(--s4); color:var(--muted); border:1px solid var(--border); }
.step-btn-secondary:hover { color:var(--text); }
.step-progress { font-size:11px; color:var(--amber); display:flex; align-items:center; gap:5px; animation:pulse 1s infinite; }
.step-done-label { font-size:11px; color:var(--green); display:flex; align-items:center; gap:4px; font-weight:600; }
.setup-footer { padding:14px 24px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.auto-badge {
  display:inline-flex; align-items:center; gap:5px; padding:3px 10px;
  background:rgba(16,185,129,.1); border:1px solid rgba(16,185,129,.3);
  border-radius:5px; font-size:11px; font-weight:700; color:var(--green);
}


/* ── Sidebar collapse / resize ── */
.sidebar { transition: width .2s ease; }
.sidebar.collapsed { width:0; min-width:0; overflow:hidden; border:none; }
.sidebar-resize {
  width:4px; cursor:col-resize; background:transparent; flex-shrink:0;
  transition:background .15s; z-index:10;
}
.sidebar-resize:hover { background:var(--accent); opacity:.6; }


/* ── Command palette ── */
.palette-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:500;
  display:flex; align-items:flex-start; justify-content:center; padding-top:15vh;
}
.palette-box {
  width:520px; background:var(--s2); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; box-shadow:0 12px 48px rgba(0,0,0,.7);
  animation:popUp .15s ease;
}
.palette-input-row {
  display:flex; align-items:center; gap:10px; padding:12px 16px;
  border-bottom:1px solid var(--border);
}
.palette-input {
  flex:1; background:transparent; border:none; color:var(--text);
  font-size:14px; outline:none; font-family:var(--ui);
}
.palette-input::placeholder { color:var(--muted2); }
.palette-results { max-height:340px; overflow-y:auto; }
.palette-section-label {
  padding:6px 16px 3px; font-size:10px; font-weight:700;
  letter-spacing:.8px; text-transform:uppercase; color:var(--muted2);
}
.palette-item {
  display:flex; align-items:center; gap:10px; padding:8px 16px;
  cursor:pointer; transition:background .1s; font-size:13px;
}
.palette-item:hover, .palette-item.sel { background:var(--aglow); }
.palette-item .pi-icon { color:var(--muted); display:flex; flex-shrink:0; }
.palette-item .pi-label { flex:1; }
.palette-item .pi-hint { font-size:11px; color:var(--muted2); font-family:var(--mono); }
.palette-item .pi-badge { font-size:10px; background:var(--s4); border:1px solid var(--border); padding:1px 6px; border-radius:3px; color:var(--muted); }
.palette-footer {
  display:flex; align-items:center; gap:12px; padding:7px 16px;
  border-top:1px solid var(--border); font-size:10.5px; color:var(--muted2);
}
.palette-footer kbd { background:var(--s4); border:1px solid var(--border); padding:1px 5px; border-radius:3px; font-family:var(--mono); font-size:10px; color:var(--text); }

/* ── Context menu ── */
.ctx-menu { position:fixed; z-index:9000; background:var(--s2); border:1px solid var(--border); border-radius:7px; padding:4px; min-width:160px; box-shadow:0 8px 32px rgba(0,0,0,.55); }
.ctx-item { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:5px; font-size:12px; cursor:pointer; color:var(--text); transition:background .1s; }
.ctx-item:hover { background:rgba(124,58,237,.18); }
.ctx-item.danger:hover { background:rgba(239,68,68,.15); color:var(--red); }
.ctx-sep { height:1px; background:var(--border); margin:3px 0; }

/* ── Find in files ── */
.search-result-file { font-size:11px; color:var(--accent2); font-family:var(--mono); padding:6px 10px 2px; font-weight:600; }
.search-result-line { display:flex; gap:8px; padding:3px 10px 3px 20px; cursor:pointer; border-radius:4px; font-size:11px; }
.search-result-line:hover { background:rgba(124,58,237,.12); }
.search-result-line .srl-num { color:var(--muted2); font-family:var(--mono); flex-shrink:0; min-width:28px; text-align:right; }
.search-result-line .srl-text { color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono); }
.search-input-wrap { padding:8px; border-bottom:1px solid var(--border); }
.search-input { width:100%; background:var(--s3); border:1px solid var(--border); color:var(--text); padding:6px 10px; border-radius:6px; font-size:12px; font-family:var(--mono); outline:none; box-sizing:border-box; }
.search-input:focus { border-color:var(--accent); }



/* ── Terminal tabs ── */
.term-tab-bar {
  display:flex; align-items:center; background:var(--s2);
  border-bottom:1px solid var(--border); height:28px; padding:0 4px; gap:0; flex-shrink:0;
}
.term-tab {
  display:flex; align-items:center; gap:5px; padding:0 10px; height:28px;
  font-size:11px; cursor:pointer; color:var(--muted); border-right:1px solid var(--border);
  white-space:nowrap; transition:background .1s; position:relative; flex-shrink:0;
}
.term-tab:hover { background:var(--s3); color:var(--text); }
.term-tab.active { background:var(--bg); color:var(--text); }
.term-tab.active::after { content:''; position:absolute; bottom:0; left:0; right:0; height:1px; background:var(--accent); }
.term-tab-close { width:14px; height:14px; border-radius:2px; display:flex; align-items:center; justify-content:center; font-size:10px; color:transparent; transition:all .1s; }
.term-tab:hover .term-tab-close { color:var(--muted); }
.term-tab-close:hover { background:var(--s4); color:var(--text) !important; }
.term-tab-add { padding:0 8px; height:28px; display:flex; align-items:center; color:var(--muted); cursor:pointer; font-size:16px; transition:color .1s; flex-shrink:0; }
.term-tab-add:hover { color:var(--text); }

/* ── Pane resize handle (horizontal, between split panes) ── */
.pane-resize-h {
  width:4px; cursor:col-resize; background:transparent; flex-shrink:0;
  transition:background .15s; z-index:10; position:relative;
}
.pane-resize-h:hover, .pane-resize-h.dragging { background:var(--accent); opacity:.6; }

/* ── Real terminal ── */
.term-input-row {
  display:flex; align-items:center; gap:8px; padding:4px 12px 8px;
  flex-shrink:0; border-top:1px solid var(--border);
}
.term-input {
  flex:1; background:transparent; border:none; color:var(--text);
  font-family:var(--mono); font-size:12px; outline:none; caret-color:var(--accent2);
}
.term-input::placeholder { color:var(--muted2); }
.term-line { display:flex; gap:8px; font-family:var(--mono); font-size:12px; line-height:1.65; flex-wrap:wrap; }
.term-line.clickable { cursor:pointer; }
.term-line.clickable:hover .term-cmd { text-decoration:underline; }
.term-spinner { display:inline-block; animation:spin .6s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }


/* ── Choko companion toast ── */
.choko-toast {
  position:fixed; bottom:88px; right:20px; z-index:200;
  display:flex; align-items:flex-end; gap:10px;
  animation:choko-in .35s cubic-bezier(.34,1.56,.64,1);
  pointer-events:all;
}
.choko-toast.choko-out { animation:choko-out .25s ease forwards; }
@keyframes choko-in {
  from { opacity:0; transform:translateY(20px) scale(.88); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}
@keyframes choko-out {
  to { opacity:0; transform:translateY(16px) scale(.92); }
}
.choko-avatar {
  width:86px; height:86px; flex-shrink:0; cursor:pointer;
  position:relative; user-select:none;
  border-radius:50%;
  box-shadow:0 6px 26px rgba(0,0,0,0.6), 0 0 0 2.5px rgba(244,114,182,.6);
  animation:choko-float 3.4s ease-in-out infinite;
  transition:transform .2s ease, box-shadow .2s ease;
}
.choko-avatar:hover { transform:scale(1.12) translateY(-4px) rotate(-3deg); box-shadow:0 8px 30px rgba(244,114,182,.8), 0 0 0 3px var(--pink); }
.choko-mascot-img {
  width:100%; height:100%; object-fit:cover;
  border-radius:50%;
  display:block;
  animation:choko-bounce-in .4s cubic-bezier(.34,1.56,.64,1);
  transition:transform .25s ease, filter .25s ease;
}
.choko-avatar:hover .choko-mascot-img {
  filter:brightness(1.05);
}
.choko-docked-pet {
  position:fixed; bottom:34px; right:18px; z-index:90;
  width:48px; height:48px; border-radius:50%;
  cursor:pointer; user-select:none;
  box-shadow:0 4px 18px rgba(0,0,0,0.5), 0 0 0 2px rgba(244,114,182,0.6);
  animation:choko-float 3.2s ease-in-out infinite;
  transition:all .2s ease;
  display:flex; align-items:center; justify-content:center;
  background:var(--s2);
}
.choko-docked-pet:hover {
  transform:scale(1.18) translateY(-3px) rotate(-4deg);
  box-shadow:0 6px 24px rgba(244,114,182,0.8), 0 0 0 3px var(--pink);
}
.choko-docked-img {
  width:100%; height:100%; border-radius:50%; object-fit:cover;
  display:block;
}
.choko-sparkles-overlay {
  position:absolute; inset:0; pointer-events:none; overflow:visible;
}
.choko-sparkle {
  position:absolute; font-size:12px; pointer-events:none;
  animation:choko-sparkle-float 2.2s ease-in-out infinite;
}
.choko-sparkle.s1 { top:-10px; left:0px; animation-delay:0s; }
.choko-sparkle.s2 { top:-12px; right:-6px; animation-delay:.8s; font-size:14px; }
.choko-sparkle.s3 { bottom:4px; left:-8px; animation-delay:1.4s; font-size:11px; }

@keyframes choko-float {
  0%, 100% { transform:translateY(0) rotate(0deg); }
  50%      { transform:translateY(-6px) rotate(2.5deg); }
}
@keyframes choko-sparkle-float {
  0%   { opacity:0; transform:translateY(0) scale(0.6) rotate(0deg); }
  50%  { opacity:0.95; transform:translateY(-8px) scale(1.2) rotate(15deg); }
  100% { opacity:0; transform:translateY(-16px) scale(0.5) rotate(35deg); }
}
@keyframes choko-bounce-in {
  0%   { transform:scale(0.6) rotate(-10deg); }
  60%  { transform:scale(1.14) rotate(4deg); }
  100% { transform:scale(1) rotate(0deg); }
}
.choko-bubble {
  background:#1a0f2e;
  border:1.5px solid rgba(244,114,182,.5);
  border-radius:14px 14px 14px 2px;
  padding:10px 14px; max-width:220px; min-width:140px;
  box-shadow:0 4px 24px rgba(244,114,182,.18),0 2px 8px rgba(0,0,0,.4);
  position:relative;
}
.choko-bubble::before {
  content:''; position:absolute; bottom:10px; left:-8px;
  border:5px solid transparent;
  border-right-color:rgba(244,114,182,.5);
}
.choko-bubble::after {
  content:''; position:absolute; bottom:11px; left:-6px;
  border:4px solid transparent;
  border-right-color:#1a0f2e;
}
.choko-name {
  font-size:10px; font-weight:800; letter-spacing:.8px;
  color:var(--pink); text-transform:uppercase; margin-bottom:4px;
  display:flex; align-items:center; gap:5px;
}
.choko-name .cn-dot { width:5px; height:5px; border-radius:50%; background:var(--pink); animation:pulse 1.5s infinite; }
.choko-msg { font-size:12.5px; color:#e8d5f5; line-height:1.55; }
.choko-close {
  position:absolute; top:6px; right:8px; width:16px; height:16px;
  border-radius:50%; border:none; background:rgba(244,114,182,.15);
  color:var(--pink); cursor:pointer; font-size:10px; line-height:1;
  display:flex; align-items:center; justify-content:center; opacity:.6;
  transition:opacity .15s;
}
.choko-close:hover { opacity:1; }
.choko-typing span {
  display:inline-block; width:5px; height:5px; border-radius:50%;
  background:var(--pink); margin:0 1.5px; opacity:.4;
  animation:choko-dot .9s infinite;
}
.choko-typing span:nth-child(2) { animation-delay:.2s; }
.choko-typing span:nth-child(3) { animation-delay:.4s; }
@keyframes choko-dot { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }


/* ── Monaco editor overrides ── */
.monaco-editor-wrap { flex:1; overflow:hidden; position:relative; }
.monaco-editor .margin { background:#0a0a0d !important; }
.monaco-editor, .monaco-editor-background { background:#0a0a0d !important; }
.monaco-editor .line-numbers { color:#4a4a60 !important; }
.monaco-editor .current-line { background:rgba(124,58,237,.06) !important; }
.monaco-editor .cursor { background:var(--accent2) !important; border-color:var(--accent2) !important; }
.monaco-scrollbar .slider { background:rgba(255,255,255,.08) !important; }
/* Save indicator */
.tab-dot { width:7px; height:7px; border-radius:50%; background:var(--amber); flex-shrink:0; }
.tab-saved { display:flex; align-items:center; gap:4px; }
/* File tree loading */
.tree-loading { display:flex; align-items:center; gap:6px; padding:10px 12px; font-size:11.5px; color:var(--muted); }
/* Status bar file info */
.sb-lang { font-size:10.5px; }
/* Save status */
.save-status { position:absolute; top:6px; right:12px; font-size:10.5px; color:var(--green); opacity:0; transition:opacity .3s; pointer-events:none; font-family:var(--mono); }
.save-status.show { opacity:1; }


/* ── Enhanced status bar ── */
.statusbar { cursor:default; }
.sb-item { cursor:pointer; transition:background .12s; border-radius:3px; }
.sb-item:hover { background:rgba(124,58,237,.12); }
.sb-item.no-click { cursor:default; }
.sb-item.no-click:hover { background:transparent; }
.sb-sep-v { width:1px; height:14px; background:var(--border); margin:0 2px; }
.sb-right { display:flex; align-items:center; gap:0; margin-left:auto; }
.sb-notif { position:relative; }
.sb-notif-dot { position:absolute; top:2px; right:2px; width:5px; height:5px; border-radius:50%; background:#f59e0b; }

/* ── Shortcut overlay ── */
.shortcut-overlay { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:600; display:flex; align-items:center; justify-content:center; }
.shortcut-box { background:var(--s2); border:1px solid var(--border); border-radius:14px; padding:24px 28px; width:520px; max-height:80vh; overflow-y:auto; box-shadow:0 12px 48px rgba(0,0,0,.7); }
.shortcut-box h2 { font-size:14px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.sc-grid { display:grid; grid-template-columns:1fr 1fr; gap:0; }
.sc-section { margin-bottom:14px; }
.sc-section-label { font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted2); margin-bottom:6px; }
.sc-row { display:flex; align-items:center; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--border); font-size:12px; }
.sc-row:last-child { border-bottom:none; }
.sc-desc { color:var(--muted); }
.sc-keys { display:flex; gap:3px; }
.sc-key { background:var(--s4); border:1px solid var(--border); padding:1px 6px; border-radius:3px; font-family:var(--mono); font-size:10.5px; color:var(--text); }

/* ── Diff viewer ── */
.diff-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:500; display:flex; align-items:center; justify-content:center; }
.diff-box { background:var(--s1); border:1px solid var(--border); border-radius:12px; width:85vw; max-width:1100px; height:70vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 12px 48px rgba(0,0,0,.7); }
.diff-header { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--s2); flex-shrink:0; }
.diff-title { font-size:13px; font-weight:600; flex:1; }
.diff-actions { display:flex; gap:6px; }
.diff-body { flex:1; overflow:hidden; }

/* ── Streaming cursor ── */
.stream-cursor { display:inline-block; width:2px; height:14px; background:var(--accent2); vertical-align:middle; margin-left:1px; animation:blink 1s infinite; }

/* ── Command history panel ── */
.history-panel { position:absolute; bottom:100%; left:0; right:0; background:var(--s2); border:1px solid var(--border); border-radius:8px 8px 0 0; max-height:280px; overflow-y:auto; box-shadow:0 -4px 20px rgba(0,0,0,.4); }
.history-item { display:flex; align-items:center; gap:8px; padding:7px 14px; cursor:pointer; font-size:12.5px; border-bottom:1px solid var(--border); transition:background .1s; }
.history-item:hover { background:var(--aglow); }
.history-item:last-child { border-bottom:none; }
.hi-role { font-size:10px; font-weight:700; color:var(--muted2); width:28px; flex-shrink:0; }
.hi-text { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
.hi-rerun { font-size:10px; color:var(--accent2); padding:1px 6px; border:1px solid rgba(124,58,237,.3); border-radius:3px; flex-shrink:0; opacity:0; transition:opacity .1s; }
.history-item:hover .hi-rerun { opacity:1; }

/* ── Sentinel file pulse ── */
@keyframes sentinelPulse { 0%{opacity:1} 50%{opacity:.3} 100%{opacity:1} }
.tree-item.sentinel-active { animation:sentinelPulse .8s ease 3; }
.tree-item.sentinel-active .ti-name { color:var(--amber) !important; }

/* ── Usage mini chart ── */
.usage-mini { display:flex; align-items:flex-end; gap:2px; height:16px; }
.usage-bar-mini { width:4px; border-radius:1px; background:var(--accent); opacity:.6; transition:height .3s; }

/* ── Notification badge on goals ── */
.goals-badge { background:var(--accent); color:#fff; border-radius:8px; font-size:9px; font-weight:800; padding:0 4px; min-width:14px; text-align:center; }

/* ── Code/Preview toggle (titlebar center) ── */
.view-toggle { display:flex; background:var(--s3); border:1px solid var(--border); border-radius:7px; overflow:hidden; }
.view-toggle-btn { padding:4px 14px; font-size:11.5px; font-weight:600; letter-spacing:.3px; border:none; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:5px; }
.view-toggle-btn.off { background:transparent; color:var(--muted); }
.view-toggle-btn.off:hover { color:var(--text); }
.view-toggle-btn.on-code { background:var(--s4); color:var(--text); }
.view-toggle-btn.on-split { background:rgba(124,58,237,.35); color:var(--accent2); }
.view-toggle-btn.on-preview { background:var(--aglow); color:var(--accent2); }

/* ── Split & Full-screen preview ── */
.split-preview-pane { flex:1; display:flex; flex-direction:column; min-width:340px; border-left:1px solid var(--border); background:var(--bg); position:relative; overflow:hidden; }
.preview-fullscreen { position:fixed; inset:38px 0 22px 0; z-index:50; display:flex; flex-direction:column; background:var(--bg); }

/* ── Live Console Drawer & Error Sniffer ── */
.preview-console-drawer { background:#0d0d14; border-top:1px solid var(--border); display:flex; flex-direction:column; max-height:220px; flex-shrink:0; transition:all .2s ease; }
.preview-console-header { display:flex; align-items:center; gap:8px; padding:5px 12px; background:var(--s2); border-bottom:1px solid var(--border); font-family:var(--mono); font-size:11px; cursor:pointer; user-select:none; }
.preview-console-body { flex:1; overflow-y:auto; padding:6px 12px; font-family:var(--mono); font-size:11px; display:flex; flex-direction:column; gap:4px; }
.console-log-row { display:flex; gap:8px; align-items:flex-start; padding:4px 8px; border-radius:4px; word-break:break-word; line-height:1.4; }
.console-log-row.error { background:rgba(239,68,68,0.12); color:#f87171; border:1px solid rgba(239,68,68,0.25); }
.console-log-row.warn { background:rgba(245,158,11,0.1); color:#fbbf24; border:1px solid rgba(245,158,11,0.2); }
.console-log-row.info { background:transparent; color:var(--muted); }
.btn-fix-max { margin-left:auto; padding:2px 8px; border-radius:4px; background:linear-gradient(135deg,#7c3aed,#a855f7); border:none; color:#fff; font-size:10.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:4px; box-shadow:0 2px 8px rgba(124,58,237,0.4); transition:all .15s; }
.btn-fix-max:hover { transform:scale(1.04); box-shadow:0 2px 12px rgba(168,85,247,0.6); }

/* ── Click-to-Tweak Inspector Popover ── */
.preview-tweak-bar { position:absolute; top:46px; left:14px; right:14px; z-index:60; background:var(--s2); border:1px solid var(--accent); border-radius:8px; padding:8px 12px; box-shadow:0 8px 30px rgba(0,0,0,0.6); display:flex; align-items:center; gap:10px; animation:popUp .15s ease; }
.preview-tweak-tag { background:rgba(124,58,237,0.25); color:var(--accent2); padding:2px 6px; border-radius:4px; font-family:var(--mono); font-size:11px; font-weight:600; white-space:nowrap; max-width:240px; overflow:hidden; text-overflow:ellipsis; }
.preview-tweak-input { flex:1; background:var(--s3); border:1px solid var(--border); border-radius:5px; color:var(--text); padding:5px 8px; font-size:11.5px; outline:none; font-family:var(--ui); }
.preview-tweak-input:focus { border-color:var(--accent); }

/* ── Version History Chips ── */
.version-chip { padding:2px 6px; border-radius:4px; font-size:10px; font-family:var(--mono); background:var(--s3); border:1px solid var(--border); color:var(--muted); cursor:pointer; transition:all .12s; }
.version-chip:hover { color:var(--text); border-color:var(--border2); }
.version-chip.active { background:var(--aglow); color:var(--accent2); border-color:var(--accent); font-weight:700; }

/* ── Floating MAX bubble ── */
.float-bubble { position:fixed; bottom:30px; right:20px; z-index:100; display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
.float-fab { width:52px; height:52px; border-radius:50%; background:var(--accent); border:2px solid rgba(124,58,237,.4); cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 20px rgba(124,58,237,.5); transition:all .2s; flex-shrink:0; overflow:hidden; padding:0; }
.float-fab:hover { transform:scale(1.08); box-shadow:0 4px 24px rgba(124,58,237,.6),0 0 0 3px rgba(255,140,0,.3); }
.float-fab.open { box-shadow:0 4px 24px rgba(124,58,237,.7),0 0 0 3px rgba(124,58,237,.4); }
.float-fab img { width:100%; height:100%; object-fit:cover; object-position:center 15%; display:block; }
.float-window { width:340px; height:460px; background:var(--s1); border:1px solid var(--border); border-radius:14px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,.6); animation:popUp .18s cubic-bezier(.4,0,.2,1); }
@keyframes popUp { from{opacity:0;transform:translateY(12px) scale(.96)} to{opacity:1;transform:none} }
.fw-header { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border); flex-shrink:0; background:var(--s2); }
.fw-title { font-size:12px; font-weight:700; letter-spacing:2px; color:var(--accent2); font-family:var(--mono); flex:1; }
.fw-close { width:22px; height:22px; border-radius:4px; border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:all .12s; }
.fw-close:hover { background:var(--s4); color:var(--text); }
.fw-messages { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px; }
.fw-input-row { display:flex; gap:7px; padding:8px 10px; border-top:1px solid var(--border); flex-shrink:0; }
.fw-input { flex:1; background:var(--s3); border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:7px; font-size:12.5px; font-family:var(--ui); outline:none; resize:none; line-height:1.4; }
.fw-input:focus { border-color:var(--accent); }
.fw-send { width:30px; height:30px; border-radius:6px; background:var(--accent); border:none; color:#fff; cursor:pointer; font-size:14px; flex-shrink:0; transition:opacity .15s; align-self:flex-end; }
.fw-send:hover { opacity:.85; }
.fw-send:disabled { opacity:.35; cursor:not-allowed; }


/* Resize handle */
.resize-handle { width:4px; cursor:col-resize; background:transparent; transition:background .15s; flex-shrink:0; }
.resize-handle:hover { background:var(--accent); opacity:.6; }

/* ── Preview pane ── */
.preview-toolbar {
  display:flex; align-items:center; gap:8px; padding:0 14px;
  height:38px; background:var(--s2); border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.preview-url-bar {
  flex:1; background:var(--s3); border:1px solid var(--border); color:var(--text);
  padding:4px 10px; border-radius:6px; font-family:var(--mono); font-size:11.5px;
  outline:none; max-width:320px; transition:border-color .15s;
}
.preview-url-bar:focus { border-color:var(--accent); }
.preview-nav-btn {
  width:26px; height:26px; border-radius:5px; background:var(--s3); border:1px solid var(--border);
  color:var(--muted); cursor:pointer; font-size:13px; display:flex; align-items:center;
  justify-content:center; transition:all .12s;
}
.preview-nav-btn:hover { background:var(--s4); color:var(--text); }
.device-group { display:flex; gap:2px; margin-left:auto; }
.device-btn {
  display:flex; align-items:center; gap:5px; padding:4px 10px; border-radius:5px;
  background:transparent; border:1px solid var(--border); color:var(--muted);
  cursor:pointer; font-size:11px; font-weight:600; transition:all .12s; letter-spacing:.3px;
}
.device-btn:hover { border-color:var(--border2); color:var(--text); }
.device-btn.active { background:var(--aglow); border-color:var(--accent); color:var(--accent2); }
.device-btn svg { flex-shrink:0; }
.preview-stage {
  flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center;
  background: repeating-linear-gradient(
    45deg, var(--bg), var(--bg) 10px, #0d0d12 10px, #0d0d12 20px

}
.preview-device-wrap {
  position:relative; transition:all .3s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
/* Desktop: no shell */
.preview-device-wrap.desktop { width:100%; max-width:100%; min-height:100%; background:var(--bg); }
/* Browser chrome */
.browser-chrome {
  background:#1e1e2e; border:1px solid var(--border); border-radius:10px 10px 0 0;
  padding:8px 12px; display:flex; align-items:center; gap:8px; flex-shrink:0;
}
.bc-dots { display:flex; gap:5px; }
.bc-dot { width:10px; height:10px; border-radius:50%; }
.bc-bar {
  flex:1; background:var(--s3); border-radius:4px; height:22px;
  display:flex; align-items:center; padding:0 10px;
  font-family:var(--mono); font-size:10.5px; color:var(--muted); overflow:hidden;
}
.preview-iframe-wrap {
  flex:1; overflow:hidden; position:relative;
  border:1px solid var(--border); border-top:none;
  border-radius:0 0 10px 10px;
}
.preview-device-wrap.desktop .preview-iframe-wrap {
  border-radius:0; border:none; min-height:500px;
}
.preview-iframe {
  width:100%; height:100%; min-height:500px; border:none; display:block;
  background:#fff;
}
.preview-no-server {
  width:100%; height:100%; min-height:500px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px; background:var(--s1);
  padding:40px; border-radius:0 0 10px 10px;
}
.preview-no-server .pns-icon { font-size:32px; opacity:.3; }
.preview-no-server .pns-title { font-size:14px; color:var(--muted); font-weight:500; }
.preview-no-server .pns-cmd {

  padding:10px 18px; font-family:var(--mono); font-size:12px; color:var(--text);
  display:flex; align-items:center; gap:8px;
}

.preview-reload-btn {
  padding:6px 16px; border-radius:6px; background:var(--accent); border:none;
  color:#fff; font-size:12px; font-weight:600; cursor:pointer; transition:opacity .15s;
}
.preview-reload-btn:hover { opacity:.85; }

/* Observability Matrix */
.obs-section-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.swarm-node {
  transition: all 0.2s ease;
}

  flex: 1;
  overflow: hidden;
  gap: 1px;

}
.pane {

  display: flex;
  flex-direction: column;
  background: var(--bg);
  min-width: 0;
  position: relative;
}
.pane.active {
  box-shadow: inset 0 0 0 1px var(--accent);
}
.pane-header {
  height: 34px;
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 8px;
  gap: 8px;
  flex-shrink: 0;
}
/* ── Muse Mode ── */
@keyframes museBreathe {
  0%,100% { transform:translate(0,0) scale(1); opacity:.55; }
  50%      { transform:translate(2%,-1%) scale(1.08); opacity:.85; }
}
@keyframes museSigPulse {
  0%,100% { transform:scale(1);    opacity:.85; }
  50%      { transform:scale(1.08); opacity:1; }
}
@keyframes museFadeUp {
  from { opacity:0; transform:translateY(8px); filter:blur(4px); }
  to   { opacity:1; transform:translateY(0);   filter:blur(0); }
}
@keyframes museDrift {
  0%,100% { transform:translate(-50%,-50%) translate(0,0); }
  50%      { transform:translate(-50%,-50%) translate(var(--mdx,6px),var(--mdy,-4px)); }
}
@keyframes museCaret {
  0%,49%  { opacity:1; }
  50%,100%{ opacity:0; }
}
@keyframes museShift {
  from { opacity:0; filter:blur(8px); }
  to   { opacity:1; filter:blur(0); }
}
@keyframes museExit {
  from { opacity:1; filter:blur(0); }
  to   { opacity:0; filter:blur(12px); }
}
.muse-overlay {
  position:fixed; inset:0; z-index:9000;
  animation: museShift .5s ease-out;
}
.muse-overlay.exiting {
  animation: museExit .4s ease-in forwards;
  pointer-events:none;
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

// ── Observability View Component ──────────────────────────────────────────
function ObservabilityView({ pagingLog, groundingLog, evolutionLog, swarmState }) {
  const [impactFile, setImpactFile] = useState('');
  const [impactData, setImpactData] = useState(null);

  const checkImpact = async () => {
    if (!impactFile) return;
    try {
      const res = await fetch(`${MAX_BASE}/api/tools/graph/impact`, {
        method: 'POST',
        headers: authHdrs(),
        body: JSON.stringify({ path: impactFile })
      });
      const data = await res.json();
      setImpactData(data.impact || []);
    } catch {}
  };

  return (
    <div className="obs-matrix" style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden',background:'var(--bg2)'}}>
      <div className="sb-header">
        <span>Observability Matrix</span>
        <span style={{fontSize:10,color:'var(--muted)',fontWeight:700}}>OMEGA V2.11</span>
      </div>
      
      <div className="sb-scroll" style={{padding:8}}>
        {/* Real-time Swarm Status */}
        <div className="obs-section">
          <div className="obs-section-label">{ICONS.bolt} Distributed Swarm</div>
          <div className="swarm-grid" style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(80px, 1fr))',gap:6,marginTop:8}}>
            {['Architect', 'SecurityAuditor', 'Researcher', 'UserProxy'].map(w => {
              const isActive = swarmState.workers?.includes(w) || (swarmState.activeJobs && swarmState.activeJobs.some(j => j.subtasks?.some(s => s.id === w && s.status === 'running')));
              return (
                <div key={w} className="swarm-node" style={{
                  background:'var(--s3)',border:'1px solid var(--border)',borderRadius:6,padding:6,textAlign:'center',
                  opacity: isActive ? 1 : 0.4,
                  boxShadow: isActive ? '0 0 4px var(--accent)' : 'none',
                  border: isActive ? '1px solid var(--accent)' : '1px solid var(--border)',
                  color: 'var(--text)'
                }}>
                  <div style={{display:'flex', justifyContent:'center', marginBottom:4}}>
                    {w === 'Architect' ? ICONS.code : w === 'SecurityAuditor' ? ICONS.warning : w === 'Researcher' ? ICONS.search : ICONS.settings}
                  </div>
                  <div style={{fontSize:8,fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{w}</div>
                  <div style={{fontSize:7,color:'var(--muted)'}}>{isActive ? 'WORKING' : 'IDLE'}</div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Real-time Context Paging (The Page Table) */}
        <div className="obs-section" style={{marginTop:16}}>
          <div className="obs-section-label">{ICONS.file} Virtual Memory (Context Pager)</div>
          <div className="page-table" style={{marginTop:8,fontSize:10,fontFamily:'var(--mono)'}}>
            {pagingLog.slice(0, 3).map((p, i) => (
              <div key={i} style={{marginBottom:10,padding:6,background:'var(--s1)',borderRadius:4,borderLeft:'2px solid var(--accent)'}}>
                <div style={{color:'var(--accent)',fontWeight:'bold',fontSize:9, marginBottom:4}}>QUERY: {p.query.slice(0, 30)}...</div>
                <div style={{display:'flex',flexDirection:'column',gap:2}}>
                  {p.buffers?.map(b => <div key={b} style={{color:'var(--amber)',fontSize:8}}>• [HOT] {b}</div>)}
                  {p.semantic?.slice(0, 5).map((s, j) => <div key={j} style={{color:'var(--text)',fontSize:8}}>• {s.source} (Hunk {s.hunk})</div>)}
                  {p.semantic?.length > 5 && <div style={{color:'var(--muted)',fontSize:8, paddingLeft:8}}>... {p.semantic.length - 5} more</div>}
                </div>
                <div style={{marginTop:4, fontSize:8, color:'var(--muted)'}}>Context Budget Used: {Math.round(p.used/p.budget*100)}%</div>
              </div>
            ))}
            {pagingLog.length === 0 && <div style={{color:'var(--muted)',padding:10,textAlign:'center',fontSize:10}}>Waiting for reasoning cycle...</div>}
          </div>
        </div>

        {/* Truth-Seeking Grounding Log */}
        <div className="obs-section" style={{marginTop:16}}>
          <div className="obs-section-label">{ICONS.target} Truth-Seeking (Grounding)</div>
          <div className="grounding-list" style={{marginTop:8,fontSize:9,fontFamily:'var(--mono)'}}>
            {groundingLog.map((g, i) => (
              <div key={i} style={{marginBottom:6,padding:'4px 6px',borderLeft:'1px solid var(--border)', background:'var(--s1)'}}>
                <div style={{fontWeight:'bold', color: g.status === 'done' ? 'var(--green)' : g.status === 'failed' ? 'var(--red)' : 'var(--accent)'}}>
                  [{g.status.toUpperCase()}]
                </div>
                <div style={{marginTop:2, color:'var(--text)'}}>{g.query || g.task?.tool || g.originalResponse?.slice(0, 50) || 'Action started'}</div>
                {g.findings && <div style={{fontSize:8, color:'var(--muted)', marginTop:2, fontStyle:'italic'}}>Evidence: {g.findings.slice(0, 100)}...</div>}
              </div>
            ))}
            {groundingLog.length === 0 && <div style={{color:'var(--muted)',padding:10,textAlign:'center',fontSize:10}}>Monitoring for uncertainty...</div>}
          </div>
        </div>

        {/* Actionable Architecture Intelligence */}
        <div className="obs-section" style={{marginTop:16}}>
          <div className="obs-section-label">{ICONS.graph} Impact Analysis</div>
          <div style={{display:'flex', gap:4, marginTop:8}}>
            <input 
              className="sb-input" 
              placeholder="Enter file path..." 
              value={impactFile} 
              onChange={e => setImpactFile(e.target.value)}
              style={{flex:1, fontSize:10, height:22}}
            />
            <button className="sb-btn" onClick={checkImpact} style={{padding:'0 6px', height:22, fontSize:10}}>Analyze</button>
          </div>
          {impactData && (
            <div style={{marginTop:8, fontSize:9, background:'var(--s3)', padding:6, borderRadius:4}}>
              <div style={{fontWeight:'bold', color:'var(--red)', marginBottom:4}}>Blast Radius: {impactData.length} files</div>
              {impactData.slice(0, 10).map(f => <div key={f} style={{color:'var(--muted)'}}>↳ {f}</div>)}
              {impactData.length > 10 && <div style={{color:'var(--muted)', paddingLeft:8}}>... {impactData.length - 10} more</div>}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Split-Pane Components ───────────────────────────────────────────────
function Pane({ pane, isActive, onClick, children, onClose,
                showTabBar, openTabs, paneTab, onTabSelect, onTabClose, unsaved, fileIcon, style }) {
  return (
    <div className={`pane ${isActive ? 'active' : ''}`} onClick={onClick} style={style}>
      {showTabBar && (
        <div className="tabs-bar" style={{borderBottom:'1px solid var(--border)',flexShrink:0}}>
          {(openTabs||[]).map(t=>(
            <div key={t.name} className={`tab ${paneTab===t.name?'active':''}`}
                 onClick={e=>{e.stopPropagation();onTabSelect(t.name);}}>
              <span className="tab-icon">{fileIcon(t.name)}</span>
              {t.name}
              {(unsaved||{})[t.name]
                ? <span className="tab-dot" title="Unsaved changes"/>
                : <span className="tab-close" onClick={e=>{e.stopPropagation();onTabClose(t.name);}}
                        style={{display:'flex',alignItems:'center',justifyContent:'center'}}>{ICONS.close}</span>
              }
            </div>
          ))}
          {(!openTabs||openTabs.length===0)&&<span className="tab-welcome">Open a file</span>}
          {onClose && (
            <div style={{marginLeft:'auto',display:'flex',alignItems:'center',padding:'0 4px',borderLeft:'1px solid var(--border)'}}>
              <button className="sb-icon-btn" title="Close pane"
                      onClick={e=>{e.stopPropagation();onClose();}}
                      style={{fontSize:11,color:'var(--muted)'}}>✕</button>
            </div>
          )}
        </div>
      )}
      <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
        {children}
      </div>
    </div>
  );
}

function SplitGrid({ panes, activePaneId, onPaneClick, renderPaneContent, onClosePane,
                     openTabs, unsaved, fileIcon, onTabSelect, onTabClose }) {
  const [paneWidths, setPaneWidths] = React.useState(null);
  const [draggingIdx, setDraggingIdx] = React.useState(null);
  const containerRef = React.useRef(null);
  const splitEnabled = panes.length > 1;

  const startResize = (e, idx) => {
    e.preventDefault();
    setDraggingIdx(idx);
    const startX = e.clientX;
    const containerW = containerRef.current?.offsetWidth || 1;
    const n = panes.length;
    const snap = paneWidths || panes.map(() => 100/n);
    const onMove = ev => {
      const dPct = ((ev.clientX - startX) / containerW) * 100;
      setPaneWidths(ws => {
        const base = ws || snap;
        const next = [...base];
        next[idx]   = Math.max(15, base[idx]   + dPct);
        next[idx+1] = Math.max(15, base[idx+1] - dPct);
        // normalize so sum = 100
        const sum = next.reduce((a,b)=>a+b,0);
        return next.map(w=>w/sum*100);
      });
    };
    const onUp = () => { setDraggingIdx(null); window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  React.useEffect(()=>{
    if(!splitEnabled) setPaneWidths(null);
  },[panes.length]);

  const widths = paneWidths || panes.map(()=>100/panes.length);

  return (
    <div className="split-grid" ref={containerRef}>
      {panes.map((pane, i) => (
        <React.Fragment key={pane.id}>
          <Pane
            pane={pane}
            isActive={pane.id === activePaneId}
            onClick={() => onPaneClick(pane.id)}
            onClose={splitEnabled ? () => onClosePane(pane.id) : null}
            showTabBar={splitEnabled}
            openTabs={openTabs}
            paneTab={pane.activeTab}
            onTabSelect={name => onTabSelect(pane.id, name)}
            onTabClose={onTabClose}
            unsaved={unsaved}
            fileIcon={fileIcon}
            style={{width: splitEnabled ? widths[i]+'%' : '100%', flex: splitEnabled ? 'none' : 1}}
          >
            {renderPaneContent(pane)}
          </Pane>
          {i < panes.length - 1 && (
            <div className={`pane-resize-h${draggingIdx===i?' dragging':''}`}
                 onMouseDown={e=>startResize(e,i)} />
          )}
        </React.Fragment>
      ))}
    </div>
  );
}

const { useState, useEffect, useRef, useCallback } = React;
const MAX_BASE = window.__MAX_BASE_URL || localStorage.getItem('maxwell_url') || 'http://localhost:3100';

// Collision-proof message ID: prefix + timestamp + incrementing counter
let _msgSeq = 0;
const nextMsgId = () => `m${Date.now()}_${++_msgSeq}`;

// Auth headers — uses injected key (server-side) or stored key (localStorage)
// Pass noContentType=true for GET requests
function authHdrs(noContentType = false) {
  const key = window.__MAX_API_KEY || localStorage.getItem('maxwell_api_key') || '';
  const h = {};
  if (!noContentType) h['Content-Type'] = 'application/json';
  if (key) h['X-Api-Key'] = key;
  return h;
}

// ── SVG Icon system ───────────────────────────────────────────
const ICONS = {

  folder:   <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 5a1 1 0 011-1h3l1.5 2H13a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1z"/></svg>,
  folderOpen:<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 5a1 1 0 011-1h3l1.5 2H13a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1z"/><path d="M5 8h7"/></svg>,
  search:   <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><circle cx="7" cy="7" r="4"/><path d="M10.5 10.5l3 3"/></svg>,
  target:   <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r="0.5" fill="currentColor" stroke="none"/></svg>,
  git:      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><circle cx="5" cy="4" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="11" cy="4" r="1.5"/><path d="M5 5.5v5"/><path d="M11 5.5c0 3.5-6 3.5-6 6"/></svg>,
  settings: <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><circle cx="8" cy="8" r="2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.42 1.42M11.53 11.53l1.42 1.42M3.05 12.95l1.42-1.42M11.53 4.47l1.42-1.42"/></svg>,
  plus:     <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M8 3v10M3 8h10"/></svg>,
  newFolder:<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 5a1 1 0 011-1h3l1.5 2H13a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1z"/><path d="M9 9v3M7.5 10.5h3"/></svg>,
  collapse: <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M4 10l4-4 4 4"/></svg>,
  close:    <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>,
  chevronR: <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 3l5 5-5 5"/></svg>,
  chevronD: <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 6l5 5 5-5"/></svg>,
  back:     <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M10 3L5 8l5 5"/></svg>,
