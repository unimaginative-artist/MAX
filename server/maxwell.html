    </div>
  );
}

// ── Agent Timeline panel ──────────────────────────────────────────────────
const STEP_ICON = { pending:'○', running:'◉', done:'●', failed:'✕', skipped:'–' };
const STEP_COLOR = { pending:'var(--muted)', running:'var(--accent)', done:'var(--green)', failed:'var(--red)', skipped:'var(--muted)' };

function AgentTimeline({ connected, maxUrl, messages }) {
  const [goals, setGoals] = React.useState([]);
  const [expanded, setExpanded] = React.useState({});

  // Refresh goal list on connect + every 5s while connected
  React.useEffect(() => {
    if (!connected) { setGoals([]); return; }
    const load = () => fetch(`${maxUrl}/api/goals`, { headers: authHdrs(true) })
      .then(r => r.ok ? r.json() : [])
      .then(g => setGoals(Array.isArray(g) ? g : []))
      .catch(() => {});
    load();
    const id = setInterval(load, 5000);
    return () => clearInterval(id);
  }, [connected, maxUrl]);

  // Also refresh on agentTask messages (step updates)
  React.useEffect(() => {
    const last = messages?.[messages.length - 1];
    if (!last || last.type !== 'agentTask') return;
    fetch(`${maxUrl}/api/goals`, { headers: authHdrs(true) })
      .then(r => r.ok ? r.json() : [])
      .then(g => setGoals(Array.isArray(g) ? g : []))
      .catch(() => {});
  }, [messages]);

  const toggle = id => setExpanded(p => ({ ...p, [id]: !p[id] }));

  if (!connected) return (
    <div style={{padding:'24px 12px',textAlign:'center',fontSize:12,color:'var(--muted)'}}>
      Connect to MAX to view timeline.
    </div>
  );

  const active = goals.filter(g => g.status !== 'complete' && g.status !== 'failed');
  const done   = goals.filter(g => g.status === 'complete' || g.status === 'failed').slice(0, 5);

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      <div className="sb-header">
        <span>Agent Timeline</span>
        <span style={{fontSize:10,color:'var(--muted)'}}>{active.length} active</span>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'6px 4px'}}>
        {active.length === 0 && done.length === 0 && (
          <div style={{padding:'20px 12px',textAlign:'center',fontSize:12,color:'var(--muted)'}}>
            No active goals. Add one with /goals add "…"
          </div>
        )}
        {active.map(goal => (
          <div key={goal.id} style={{marginBottom:6,borderRadius:6,border:'1px solid var(--border)',overflow:'hidden'}}>
            <div style={{padding:'6px 8px',background:'var(--bg2)',cursor:'pointer',display:'flex',alignItems:'center',gap:6}}
              onClick={() => toggle(goal.id)}>
              <span style={{fontSize:9,color:'var(--accent)',flexShrink:0}}>
                {goal.status === 'running' ? '▶' : goal.status === 'planning' ? '◌' : '○'}
              </span>
              <span style={{fontSize:11,fontWeight:600,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--fg)'}}>
                {goal.title}
              </span>
              <span style={{fontSize:9,color:'var(--muted)',flexShrink:0}}>
                {expanded[goal.id] ? '▲' : '▼'}
              </span>
            </div>
            {expanded[goal.id] && goal.steps?.length > 0 && (
              <div style={{padding:'4px 8px 6px',background:'var(--bg)',borderTop:'1px solid var(--border)'}}>
                {goal.steps.map((step, i) => (
                  <div key={i} style={{display:'flex',alignItems:'flex-start',gap:6,padding:'3px 0',borderBottom: i < goal.steps.length-1 ? '1px solid var(--border)' : 'none'}}>
                    <span style={{fontSize:10,color:STEP_COLOR[step.status]||'var(--muted)',flexShrink:0,marginTop:1,fontFamily:'monospace'}}>
                      {STEP_ICON[step.status]||'○'}
                    </span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:10,color:'var(--fg)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                        {step.title || step.action_name || `Step ${i+1}`}
                      </div>
                      {step.result && step.status === 'done' && (
                        <div style={{fontSize:9,color:'var(--muted)',marginTop:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                          {String(step.result).slice(0, 80)}
                        </div>
                      )}
                      {step.error && (
                        <div style={{fontSize:9,color:'var(--red)',marginTop:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                          {String(step.error).slice(0, 80)}
                        </div>
                      )}
                    </div>
                    <span style={{fontSize:9,color:'var(--muted)',flexShrink:0}}>
                      {step.durationMs ? `${(step.durationMs/1000).toFixed(1)}s` : ''}
                    </span>
                  </div>
                ))}
              </div>
            )}
            {expanded[goal.id] && (!goal.steps || goal.steps.length === 0) && (
              <div style={{padding:'4px 8px 6px',background:'var(--bg)',borderTop:'1px solid var(--border)',fontSize:10,color:'var(--muted)'}}>
                {goal.status === 'planning' ? 'Planning steps…' : 'Waiting to start…'}
              </div>
            )}
          </div>
        ))}
        {done.length > 0 && (
          <>
            <div style={{fontSize:9,color:'var(--muted)',padding:'4px 4px 2px',textTransform:'uppercase',letterSpacing:'0.08em'}}>Recent</div>
            {done.map(goal => (
              <div key={goal.id} style={{marginBottom:4,borderRadius:4,border:'1px solid var(--border)',padding:'5px 8px',
                display:'flex',alignItems:'center',gap:6,opacity:0.6}}>
                <span style={{fontSize:10,color: goal.status==='complete' ? 'var(--green)' : 'var(--red)',flexShrink:0}}>
                  {goal.status==='complete' ? '●' : '✕'}
                </span>
                <span style={{fontSize:10,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--fg)'}}>
                  {goal.title}
                </span>
              </div>
            ))}
          </>
        )}
      </div>
    </div>
  );
}

function MuseWaveform({ width=800, height=48, state='listening', color=MUSE.ember, amplitude=null }) {
  const [t, setT] = React.useState(0);
  React.useEffect(()=>{
    let raf;
    const tick=()=>{ setT(p=>p+(state==='speaking'?.04:state==='thinking'?.018:.008)); raf=requestAnimationFrame(tick); };
    raf=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf);
  },[state]);
  // Real mic amplitude (0–1) drives wave height; fall back to state presets when mic is off
  const amp = amplitude !== null
    ? Math.max(1.5, amplitude * 44)
    : (state==='speaking'?14:state==='thinking'?6:3);
  const freq = 0.012;
  const pts=[];
  for(let x=0;x<=width;x+=6){
    const y=height/2+Math.sin(x*freq+t)*amp+Math.sin(x*freq*2.3+t*1.4)*amp*0.35;
    pts.push(`${x},${y.toFixed(2)}`);
  }
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{display:'block',overflow:'visible'}}>
      <defs>
        <linearGradient id="mwg" x1="0" x2="1">
          <stop offset="0" stopColor={color} stopOpacity="0"/>
          <stop offset="0.15" stopColor={color} stopOpacity="0.9"/>
          <stop offset="0.85" stopColor={color} stopOpacity="0.9"/>
          <stop offset="1" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polyline points={pts.join(' ')} fill="none" stroke="url(#mwg)" strokeWidth="1.2" strokeLinecap="round"/>
    </svg>
  );
}

// ── FIELD room ──────────────────────────────────────────────────
function MuseRoomField({ messages, concepts, waveform='listening', ambient={intensity:.45,warmth:.45}, isThinking=false, onSwitch, onExit, onSend }) {
  const [draft,setDraft]=React.useState('');
  const inputRef=React.useRef(null);
  const scrollRef=React.useRef(null);
  const submit=()=>{
    const t=draft.trim();
    if(!t) return;
    setDraft('');
    if(onSend) onSend(t);
  };
  const onKey=(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}};
  React.useEffect(()=>{
    const t = setTimeout(()=>inputRef.current?.focus(),300);
    return ()=>clearTimeout(t);
  },[]);
  React.useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight; },[messages]);
  const conv = messages.slice(-8);
  // Residue = short concept phrases only (≤3 words, ≤24 chars) — no full sentences
  const residue = concepts
    .filter(c => c.split(' ').length <= 3 && c.length <= 28)
    .slice(0, 6)
    .map((c,i)=>({
      text: c,
      x: .08 + (i * .155) % 0.82,
      y: .18 + (i * .11)  % 0.52,
      dim: .5 - i * .05,
    }));
  return (
    <div style={{width:'100%',height:'100%',position:'relative',overflow:'hidden',background:MUSE.void,color:MUSE.text,fontFamily:"'Inter',system-ui,sans-serif",isolation:'isolate'}}>
      <MuseAmbientField intensity={ambient.intensity} warmth={ambient.warmth}/>
      {/* floating concept residue — clickable, pre-fills input with concept */}
      {residue.map((r,i)=>(
        <div key={i} onClick={()=>{ setDraft(r.text); inputRef.current?.focus(); }}
          style={{position:'absolute',left:`${r.x*100}%`,top:`${r.y*100}%`,
          transform:'translate(-50%,-50%)',color:MUSE.textMute,opacity:r.dim,
          fontSize:11,letterSpacing:'.06em',fontStyle:'italic',maxWidth:140,textAlign:'center',
          cursor:'pointer',zIndex:1,userSelect:'none',transition:'opacity .2s, color .2s',
          animation:`museDrift ${12+i*3}s ease-in-out infinite`,
          '--mdx':`${(i%2?1:-1)*5}px`,'--mdy':`${(i%3-1)*4}px`}}

          ref={inputRef}

          onChange={e=>setDraft(e.target.value)}

            fontFamily:"'Fraunces',Georgia,serif",fontSize:20,fontWeight:350,

            onMouseEnter={e=>{e.currentTarget.style.background=`${MUSE.ember}20`;}}

  );

// Deterministic jitter from a string — same concept always lands in the same spot
function strHash(s){ return s.split('').reduce((h,c)=>(Math.imul(31,h)+c.charCodeAt(0))|0,0); }

// ── Real mic input ─────────────────────────────────────────────────────────────
function useMic() {
  const [amplitude, setAmplitude] = React.useState(null); // null = not active
  const [active, setActive] = React.useState(false);
  const [error, setError] = React.useState(null);
  const r = React.useRef({ ctx:null, analyser:null, source:null, stream:null, raf:null });

  const start = React.useCallback(async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const source = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 64;
      analyser.smoothingTimeConstant = 0.75;
      source.connect(analyser);
      r.current = { ctx, analyser, source, stream, raf:null };
      setActive(true); setError(null);
      const data = new Uint8Array(analyser.frequencyBinCount);
      const loop = () => {
        analyser.getByteFrequencyData(data);
        setAmplitude(data.reduce((a,b)=>a+b,0) / data.length / 128);
        r.current.raf = requestAnimationFrame(loop);
      };
      r.current.raf = requestAnimationFrame(loop);
    } catch(e) { setError(e.message || 'mic denied'); }
  }, []);

  const stop = React.useCallback(() => {
    const c = r.current;
    if (c.raf) cancelAnimationFrame(c.raf);
    if (c.source) try { c.source.disconnect(); } catch {}
    if (c.stream) c.stream.getTracks().forEach(t => t.stop());
    if (c.ctx) c.ctx.close().catch(()=>{});
    r.current = { ctx:null, analyser:null, source:null, stream:null, raf:null };
    setActive(false); setAmplitude(null);
  }, []);

  React.useEffect(() => () => stop(), []);
  return { amplitude, active, error, start, stop };
}

// ── Semantic concept layout — force-directed from co-occurrence ────────────────
function buildSemanticLayout(concepts, messages) {
  const n = Math.min(concepts.length, 12);
  if (!n) return [];
  const cs = concepts.slice(0, n);

  // Count how many messages each pair of concepts co-appears in
  const cooc = Array.from({length:n}, ()=>new Array(n).fill(0));
  for (const m of messages) {
    const txt = (typeof m.content==='string' ? m.content : (m.text||m.content?.[0]?.text||'')).toLowerCase();
    const present = cs.map(c => txt.includes(c.toLowerCase()));
    for (let i=0; i<n; i++) for (let j=i+1; j<n; j++) {
      if (present[i] && present[j]) { cooc[i][j]++; cooc[j][i]++; }
    }
  }
  const importance = cs.map((_,i) => cooc[i].reduce((a,b)=>a+b,0));
  const maxImp = Math.max(...importance, 1);

  // Initial positions: radial by importance rank
  const cx=0.50, cy=0.42, margin=0.11;
  const pos = cs.map((_,i) => {
    const imp = importance[i]/maxImp;
    const rad = 0.04 + (1-imp)*0.30;
    const ang = (i/n)*Math.PI*2;
    return { x: cx+Math.cos(ang)*rad*1.5, y: cy+Math.sin(ang)*rad };
  });

  // 60 iterations of spring forces
  const maxCooc = Math.max(...cooc.flat(), 1);
  for (let iter=0; iter<60; iter++) {
    const f = pos.map(()=>({fx:0,fy:0}));
    for (let i=0; i<n; i++) {
      for (let j=i+1; j<n; j++) {
        const dx=pos[j].x-pos[i].x, dy=pos[j].y-pos[i].y;
        const dist=Math.sqrt(dx*dx+dy*dy)||0.001;
        const rep=0.0022/(dist*dist);
        f[i].fx-=dx/dist*rep; f[i].fy-=dy/dist*rep;
        f[j].fx+=dx/dist*rep; f[j].fy+=dy/dist*rep;
        const str=cooc[i][j]/maxCooc;
        if (str>0) {
          const att=str*0.032*(dist-0.10);
          f[i].fx+=dx/dist*att; f[i].fy+=dy/dist*att;
          f[j].fx-=dx/dist*att; f[j].fy-=dy/dist*att;
        }
      }
      const grav=0.011*(1+importance[i]/maxImp);
      f[i].fx+=(cx-pos[i].x)*grav; f[i].fy+=(cy-pos[i].y)*grav;
    }
    for (let i=0; i<n; i++) {
      pos[i].x=Math.max(margin,Math.min(1-margin, pos[i].x+f[i].fx*0.9));
      pos[i].y=Math.max(margin,Math.min(0.72,     pos[i].y+f[i].fy*0.9));
    }
  }

  return cs.map((c,i)=>({
    id:c, label:c,
    tier: importance[i]>=maxImp*0.7?0:importance[i]>=maxImp*0.3?1:importance[i]>0?2:3,
    cooc: cooc[i],
    importance: importance[i],
    x: pos[i].x, y: pos[i].y,
  }));
}

function MuseRoomConstellation({ messages, concepts, waveform='listening', ambient={intensity:.4,warmth:.35}, arc='opening', isThinking=false, onSwitch, onExit, onSend }) {
  const mic = useMic();
  const [tick,setTick]=React.useState(0);
  const [draft,setDraft]=React.useState('');
  const inputRef=React.useRef(null);
  React.useEffect(()=>{
    let raf; const loop=()=>{setTick(p=>p+1);raf=requestAnimationFrame(loop);}; raf=requestAnimationFrame(loop); return ()=>cancelAnimationFrame(raf);
  },[]);
  React.useEffect(()=>{
    const t = setTimeout(()=>inputRef.current?.focus(),300);
    return ()=>clearTimeout(t);
  },[]);

  const submit=()=>{ const t=draft.trim(); if(!t) return; setDraft(''); if(onSend) onSend(t); };
  const onKey=(e)=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();} };

  const w=window.innerWidth, h=window.innerHeight;
  const cx=0.50, cy=0.40;

  // Semantic layout — positions derived from co-occurrence, recomputes when conversation changes
  const nodes = React.useMemo(()=>{
    const built = buildSemanticLayout(concepts, messages);
    return built.length > 0 ? built : [{id:'listening',label:'listening…',x:cx,y:cy,tier:0,cooc:[],importance:0,pulse:true}];
  }, [concepts, messages]);

  // Keep track of smoothed/damped positions for nodes to prevent snapping
  const animatedNodesRef = React.useRef(new Map());
  const animatedNodes = React.useMemo(() => {
    return nodes.map(n => {
      let state = animatedNodesRef.current.get(n.id);
      if (!state) {
        state = { x: n.x, y: n.y, vx: 0, vy: 0 };
        animatedNodesRef.current.set(n.id, state);
      }
      const k = 0.08;      // Spring stiffness
      const damping = 0.82; // Friction damping
      const ax = (n.x - state.x) * k;
      const ay = (n.y - state.y) * k;
      state.vx = (state.vx + ax) * damping;
      state.vy = (state.vy + ay) * damping;
      state.x += state.vx;
      state.y += state.vy;
      return { ...n, x: state.x, y: state.y };
    });
  }, [nodes, tick]);

  // MAX light target — the concept most recently mentioned by the user
  const lightTarget = React.useMemo(()=>{
    const lastUser = [...messages].reverse().find(m=>m.role==='user');
    if (!lastUser) return nodes[0];
    const txt=(typeof lastUser.content==='string'?lastUser.content:(lastUser.text||'')).toLowerCase();
    return nodes.find(n=>txt.includes(n.id.toLowerCase())) || nodes[0];
  }, [messages, nodes]);

  // Smoothly orbit the target node — light tracks what Barry is talking about
  const lightPos = React.useRef({ x:cx*w, y:cy*h });
  const tx=(lightTarget?.x||cx)*w, ty=(lightTarget?.y||cy)*h;
  const orbitAng=(tick/90)*Math.PI*2;
  const orbitR=22;
  const ox=tx+Math.cos(orbitAng)*orbitR, oy=ty+Math.sin(orbitAng)*orbitR*0.6;
  lightPos.current={ x:lightPos.current.x*0.94+ox*0.06, y:lightPos.current.y*0.94+oy*0.06 };
  const mxX=lightPos.current.x, mxY=lightPos.current.y;

  const tierStyle=(t)=>[
    {fs:17,fw:500,op:1.0,r:7, color:MUSE.text,    font:"'Fraunces',Georgia,serif",   italic:true },
    {fs:14,fw:400,op:0.9,r:5, color:MUSE.text,    font:"'Inter',system-ui,sans-serif",italic:false},
    {fs:12,fw:400,op:0.65,r:4,color:MUSE.textDim, font:"'Inter',system-ui,sans-serif",italic:false},
    {fs:10,fw:400,op:0.40,r:3,color:MUSE.textMute,font:"'Inter',system-ui,sans-serif",italic:false},
  ][t]||{fs:10,fw:400,op:.4,r:3,color:MUSE.textMute,font:"'Inter',system-ui,sans-serif",italic:false};

  return (
    <div style={{width:'100%',height:'100%',position:'relative',overflow:'hidden',background:MUSE.void,color:MUSE.text,fontFamily:"'Inter',system-ui,sans-serif",isolation:'isolate'}}>
      <MuseAmbientField intensity={ambient.intensity} warmth={ambient.warmth}/>

      {/* top bar */}
      <div style={{position:'absolute',top:20,left:24,display:'flex',alignItems:'center',gap:14,zIndex:5}}>
        <div style={{display:'flex',alignItems:'center',gap:10,fontSize:10,letterSpacing:'.3em',textTransform:'uppercase',color:MUSE.textMute}}>
          <MuseSigMark size={13}/><span>MAX · Constellation</span>
        </div>
        <div style={{width:1,height:12,background:MUSE.hair}}/>
        <MuseExitBtn onExit={onExit}/>
      </div>
      <div style={{position:'absolute',top:20,right:24,zIndex:5,display:'flex',alignItems:'center',gap:16}}>
        <div style={{fontSize:10,letterSpacing:'.18em',textTransform:'uppercase',color:MUSE.textMute,display:'flex',gap:12,fontFamily:"'JetBrains Mono',monospace",opacity:.75}}>
          <span><span style={{color:MUSE.ember}}>●</span> focal</span>
          <span><span style={{color:MUSE.violet}}>○</span> emerging</span>
          <span style={{opacity:.5}}>arc: {arc}</span>
        </div>
        <div style={{width:1,height:12,background:MUSE.hair}}/>
        <MuseRoomSwitcher current="constellation" onSwitch={onSwitch}/>
      </div>

      {/* concept graph — SVG edges drawn only between co-occurring concepts */}
      <svg width="100%" height="100%" viewBox={`0 0 ${w} ${h}`}
        style={{position:'absolute',inset:0,zIndex:2,pointerEvents:'none'}}>
        {animatedNodes.map((a,ai)=>animatedNodes.slice(ai+1).map((b,_bi)=>{
          const bj=ai+1+_bi;
          const strength=a.cooc?.[bj]||0;
          if (strength===0) return null;
          const maxStr=Math.max(...animatedNodes.map((_,i)=>animatedNodes.map((_2,j)=>animatedNodes[i]?.cooc?.[j]||0)).flat(),1);
          const norm=strength/maxStr;
          const isPrimary=norm>0.6;
          const isMid=norm>0.25&&!isPrimary;
          const stroke=isPrimary?MUSE.ember:isMid?MUSE.violet:MUSE.textMute;
          const op=isPrimary?.6:isMid?.35:.18;
          return <line key={`${ai}-${bj}`}
            x1={a.x*w} y1={a.y*h} x2={b.x*w} y2={b.y*h}
            stroke={stroke} strokeOpacity={op} strokeWidth={isPrimary?1.2:.7}
            strokeDasharray={isPrimary?undefined:isMid?"4 5":"2 8"}/>;
        }).filter(Boolean))}
        {animatedNodes.map(n=>{
          const ts=tierStyle(n.tier);
          return (
            <g key={n.id} transform={`translate(${n.x*w},${n.y*h})`}>
              {(n.pulse||n.tier===0)&&(
                <circle r={ts.r+7} fill="none" stroke={MUSE.ember} strokeOpacity=".18" strokeWidth=".6">
                  <animate attributeName="r" values={`${ts.r+4};${ts.r+16};${ts.r+4}`} dur="3.4s" repeatCount="indefinite"/>
                  <animate attributeName="stroke-opacity" values=".25;0;.25" dur="3.4s" repeatCount="indefinite"/>
                </circle>
              )}
              <circle r={ts.r} fill={n.tier===0?MUSE.ember:MUSE.surface}
                stroke={n.tier===0?MUSE.ember:n.tier===1?MUSE.violet:MUSE.textMute}
                strokeWidth=".8" opacity={ts.op}/>
              {n.tier<=1&&<circle r={Math.max(ts.r-2,1)} fill={n.tier===0?'#000':MUSE.violetDim} opacity=".45"/>}
            </g>
          );
        })}
        {/* MAX traveling light */}
        <g transform={`translate(${mxX},${mxY})`}>
          <circle r="22" fill={MUSE.ember} opacity=".06"/>
          <circle r="12" fill={MUSE.ember} opacity=".14"/>
          <circle r="4" fill={MUSE.ember}/>
          <circle r="1.8" fill={MUSE.text}/>
        </g>
      </svg>

      {/* node labels — clickable, pre-fill input with concept */}
      {animatedNodes.map(n=>{
        const ts=tierStyle(n.tier);
        const above=n.y<.46;
        const clickable = n.id !== 'listening' && onSend;
        return (
          <div key={n.id}
            onClick={clickable ? ()=>{ setDraft(n.label); inputRef.current?.focus(); } : undefined}
            title={clickable ? `explore "${n.label}"` : undefined}
            style={{
              position:'absolute',
              left:`${n.x*100}%`,
              top:`calc(${n.y*100}% + ${above?-(ts.r+10):ts.r+8}px)`,
              transform:above?'translate(-50%,-100%)':'translate(-50%,0)',
              fontSize:ts.fs,fontWeight:ts.fw,color:ts.color,opacity:ts.op,
              letterSpacing:n.tier===0?'-.01em':'.01em',
              maxWidth:180,textAlign:'center',lineHeight:1.2,
              fontFamily:ts.font,fontStyle:ts.italic?'italic':'normal',
              zIndex:3,userSelect:'none',
              cursor: clickable ? 'pointer' : 'default',
              transition:'opacity .15s',
            }}
            onMouseEnter={clickable?e=>{e.currentTarget.style.opacity='1';e.currentTarget.style.color=MUSE.ember;}:undefined}
            onMouseLeave={clickable?e=>{e.currentTarget.style.opacity=String(ts.op);e.currentTarget.style.color=ts.color;}:undefined}
          >
            {n.label}
          </div>
        );
      })}

      {/* arc indicator — subtle bottom-center */}
      <div style={{position:'absolute',bottom:76,left:0,right:0,display:'flex',justifyContent:'center',zIndex:4}}>
        <MuseWaveform width={Math.min(w-200,800)} height={32} state={waveform} color={MUSE.violet} amplitude={mic.active ? mic.amplitude : null}/>
      </div>

      {/* input bar */}
      <div style={{position:'absolute',left:0,right:0,bottom:0,zIndex:6,
        display:'flex',alignItems:'center',gap:12,padding:'16px 48px',
        borderTop:`1px solid ${MUSE.hair}22`,
        background:`${MUSE.voidDeep}cc`,backdropFilter:'blur(12px)'}}>
        <span style={{fontSize:10,letterSpacing:'.3em',textTransform:'uppercase',color:isThinking?MUSE.ember:MUSE.textMute,flexShrink:0,fontFamily:"'JetBrains Mono',monospace"}}>
          {isThinking ? '…' : '→'}
        </span>
        <input ref={inputRef} value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={onKey}
          placeholder={isThinking ? 'MAX is thinking…' : 'pull on any thread… or click a node'}
          disabled={isThinking}
          style={{flex:1,background:'transparent',border:'none',outline:'none',
            fontFamily:"'Fraunces',Georgia,serif",fontSize:19,fontWeight:350,
            color:isThinking?MUSE.textMute:MUSE.text,fontStyle:'italic',caretColor:MUSE.ember,
            opacity:isThinking?.55:1}}/>
        {draft.trim()&&!isThinking&&(
          <button onClick={submit}
            style={{background:'transparent',border:`1px solid ${MUSE.ember}55`,color:MUSE.ember,
              padding:'4px 10px',borderRadius:3,fontSize:10,letterSpacing:'.2em',
              textTransform:'uppercase',fontFamily:"'JetBrains Mono',monospace",cursor:'pointer',flexShrink:0}}
            onMouseEnter={e=>{e.currentTarget.style.background=`${MUSE.ember}20`;}}
            onMouseLeave={e=>{e.currentTarget.style.background='transparent';}}>⏎</button>
        )}
        <button onClick={mic.active ? mic.stop : mic.start}
          title={mic.error || (mic.active ? 'mute mic' : 'enable mic')}
          style={{background:mic.active?`${MUSE.ember}18`:'transparent',
            border:`1px solid ${mic.active?MUSE.ember:MUSE.textMute}44`,
            borderRadius:14,padding:'4px 8px',display:'flex',alignItems:'center',gap:5,
            color:mic.active?MUSE.ember:MUSE.textMute,cursor:'pointer',
            fontSize:11,transition:'all .2s',flexShrink:0,
            opacity:mic.error?.35:mic.active?1:.5}}>
          {mic.active ? '⏺' : '🎙'}
          {mic.active && mic.amplitude!==null && (
            <span style={{display:'inline-block',width:Math.max(2,mic.amplitude*16),height:2,
              background:MUSE.ember,borderRadius:1,transition:'width .06s'}}/>
          )}
        </button>
        <span style={{fontSize:10,letterSpacing:'.2em',color:MUSE.textMute,opacity:.4,fontFamily:"'JetBrains Mono',monospace",flexShrink:0}}>
          {nodes.length} concepts · {arc}
        </span>
      </div>
    </div>
  );
}

function MuseRoomStudio({ messages, concepts, notices, waveform='listening', ambient={intensity:.45,warmth:.45}, isThinking=false, onSwitch, onExit, onSend }) {
  const [draft, setDraft] = React.useState('');
  const inputRef  = React.useRef(null);
  const scrollRef = React.useRef(null);

  React.useEffect(()=>{
    const t = setTimeout(()=>inputRef.current?.focus(), 300);
    return ()=>clearTimeout(t);
  },[]);
  React.useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; },[messages]);

  const submit = () => { const t=draft.trim(); if(!t) return; setDraft(''); if(onSend) onSend(t); };
  const onKey  = (e) => { if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); submit(); } };

  const getText = (m) => typeof m.content==='string' ? m.content : (m.text || m.content?.[0]?.text || '');
  const isMax   = (m) => m.role==='assistant' || m.role==='max';

  const conv = messages.slice(-12);
  const noticeColor = (k) => k==='pattern'?MUSE.violet : k==='connection'?MUSE.curious : k==='challenge'?MUSE.tension : MUSE.ember;

// ── MuseOverlay — top-level muse shell ──────────────────────────
function MuseOverlay({ messages, insights, museState={}, room, onSwitchRoom, onExit, onSend, isThinking=false, exiting=false }) {
  // Crossfade state — switching rooms fades out then in
  const [displayRoom, setDisplayRoom] = React.useState(room);
  const [roomVisible, setRoomVisible] = React.useState(true);
  React.useEffect(()=>{
    if (room === displayRoom) return;
    setRoomVisible(false);
    const t = setTimeout(()=>{ setDisplayRoom(room); setRoomVisible(true); }, 200);
    return ()=>clearTimeout(t);
  },[room]);

  // Live concepts — prefer MuseEngine, persist to sessionStorage as fallback
  const concepts = React.useMemo(()=>{
    if (museState.concepts && museState.concepts.length > 0) {
      try { sessionStorage.setItem('mx_muse_concepts', JSON.stringify(museState.concepts)); } catch {}
      return museState.concepts;
    }
    // Restore from session if engine hasn't sent data yet
    try {
      const cached = JSON.parse(sessionStorage.getItem('mx_muse_concepts')||'[]');
      if (cached.length > 0) return cached;
    } catch {}
    // Last-resort: derive short phrases from recent messages
    const seen=new Set(), out=[];
    messages.slice(-6).forEach(m=>{
      const txt=typeof m.content==='string'?m.content:(m.text||m.content?.[0]?.text||'');
      txt.split(/[,\.!?—]+/).slice(0,2).forEach(phrase=>{
        const w=phrase.trim().toLowerCase().replace(/[^a-z0-9 ]/g,'').slice(0,30);
        if(w.length>6 && w.split(' ').length<=3 && !seen.has(w)){ seen.add(w); out.push(w); }
      });
    });
    return out.slice(0,10);
  },[museState.concepts, messages]);

  // Notices — use MuseEngine-generated insights (already classified), fall back to derivation
  const notices = React.useMemo(()=>{
    // muse_insight events have kind/title/body/strength already set by MuseEngine
    const museInsights = insights.filter(i => i.kind && i.title && i.body);
    if (museInsights.length > 0) return museInsights.slice(0,5);

    // Derive from raw insight events using keyword classification
    return insights.slice(0,5).map(ins=>{
      const raw = (ins.result||ins.text||ins.body||ins.label||'').trim();
      if (!raw) return null;
      const t = raw.toLowerCase();
      let kind='pattern', title='noticing something';
      if (/pattern|repeat|recurring|again|always|tend|cycle/.test(t))  { kind='pattern';    title='a pattern is repeating'; }
      else if (/connect|link|between|relate|bridge|similar|analog/.test(t)) { kind='connection'; title='strange connection'; }
      else if (/risk|problem|issue|challenge|concern|warn|fail/.test(t)) { kind='challenge';  title='worth pushing back on'; }
      else if (/discover|novel|new|unexpected|surprise|interesting/.test(t)) { kind='connection'; title='something unexpected'; }
      else if (ins.source==='curiosity')  { kind='connection'; title='curiosity surfaced this'; }
      else if (ins.source==='reflection') { kind='pattern';    title='reflected on this'; }
      return { kind, title, body: raw.slice(0,200), strength: Math.min(1, Math.max(0.4, raw.length/280)) };
    }).filter(Boolean);
  },[insights]);

  const waveform = isThinking ? 'thinking' : (museState.waveform || 'listening');
  const ambient  = museState.ambient || { intensity: .45, warmth: .45 };

  const roomProps = {
    messages, concepts, waveform, ambient,
    arc: museState.arc || 'opening',
    isThinking,
    onSwitch: onSwitchRoom,
    onExit,
    onSend: isThinking ? null : onSend,
  };

  return (
    <div className={`muse-overlay${exiting?' exiting':''}`}>
      <div style={{width:'100%',height:'100%',transition:'opacity 0.2s ease',opacity:roomVisible?1:0}}>
        {displayRoom==='field'         && <MuseRoomField         {...roomProps}/>}
        {displayRoom==='constellation' && <MuseRoomConstellation {...roomProps}/>}
        {displayRoom==='studio'        && <MuseRoomStudio        {...roomProps} notices={notices}/>}
      </div>
    </div>
  );
}

  const [showDiff, setShowDiff]           = useState(null); // {fileName,original,modified,pendingId}
  const [langOverride, setLangOverride]   = useState(null); // null = auto-detect from filename

  const [sidebarW, setSidebarW]       = useState(220);
  const [draggingSidebar, setDraggingSidebar] = useState(false);

  const sidebarDragW = useRef(0);

  const [realFiles, setRealFiles]       = useState(null); // null = use demo
  const [fileContents, setFileContents] = useState({});   // cache: path→content
  const [unsaved, setUnsaved]           = useState({});   // path→bool
  const [saveStatus, setSaveStatus]     = useState('');   // '' | 'saving' | 'saved'
  const [cwd, setCwd]                   = useState('.');
  const saveTimers = React.useRef({});

  // Omega Observability State
  const [pagingLog, setPagingLog] = useState([]);
  const [groundingLog, setGroundingLog] = useState([]);
  const [evolutionLog, setEvolutionLog] = useState([]);
  const [swarmState, setSwarmState] = useState({ workers: [] });
  const [lspDiagnostics, setLspDiagnostics] = useState({}); // uri -> diagnostics[]
  // Muse Mode
  const [museMode, setMuseMode] = useState(false);
  const [museRoom, setMuseRoom] = useState(()=>localStorage.getItem('mx_muse_room')||'field');
  const [museExiting, setMuseExiting] = useState(false);
  const [museInsights, setMuseInsights] = useState([]); // accumulates from insight events
  const [museState, setMuseState] = useState({ concepts:[], arc:'opening', waveform:'listening', ambient:{intensity:.45,warmth:.45} });
  const [somaStatus, setSomaStatus] = useState({ connected: false, signalConnected: false });
  const museExitTimer = useRef(null);

  const enterMuseMode = React.useCallback(() => {
    if (museExitTimer.current) {
      clearTimeout(museExitTimer.current);
      museExitTimer.current = null;
    }
    setMuseMode(true);
    setMuseExiting(false);
  }, []);

  const exitMuseMode = React.useCallback(() => {
    if (museExitTimer.current) clearTimeout(museExitTimer.current);
    setMuseExiting(true);
    museExitTimer.current = setTimeout(() => {
      museExitTimer.current = null;
      setMuseMode(false);
      setMuseExiting(false);
    }, 420);
  }, []);

  useEffect(() => () => {
    if (museExitTimer.current) clearTimeout(museExitTimer.current);
  }, []);

  // Drive status bar problem count from live LSP diagnostics
  useEffect(() => {
    const errCount = Object.values(lspDiagnostics).reduce(
      (sum, diags) => sum + (diags||[]).filter(d => d.severity === 1).length, 0
    );
    if (errCount > 0) setProblemCount(errCount);
  }, [lspDiagnostics]);

  // Omega Split-Pane State
  const [panes, setPanes] = useState([{ id: 'p1', type: 'editor', activeTab: null }]);
  const [activePaneId, setActivePaneId] = useState('p1');

  const socketRef = useRef(null);

  useEffect(() => {
    if (!connected || !apiKey) return;
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${maxUrl.replace('http:', protocol).replace('https:', protocol)}/api/events?apiKey=${apiKey}`;
    const ws = new WebSocket(wsUrl);
    
    ws.onopen = () => console.log('[Maxwell] 🌐 WebSocket active');
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        
        // ── Omega Telemetry Handlers ──
        if (msg.type === 'paging_update') {
          setPagingLog(l => [msg.payload, ...l.slice(0, 49)]);
        }
        if (msg.type === 'grounding_update') {
          setGroundingLog(l => [msg.payload, ...l.slice(0, 49)]);
        }
        if (msg.type === 'evolution_update') {
          setEvolutionLog(l => [msg.payload, ...l.slice(0, 49)]);
        }
        if (msg.type === 'security_update') {
          setGroundingLog(l => [{ status: 'security_audit', ...msg.payload }, ...l.slice(0, 49)]);
        }
        if (msg.type === 'swarm_update') {
          setSwarmState(msg.payload);
        }
        if (msg.type === 'lsp_diagnostic') {
          setLspDiagnostics(d => ({ ...d, [msg.payload.uri]: msg.payload.diagnostics }));
        }
        if (msg.type === 'persona_changed') {
          setMaxStatus(s => ({ ...s, persona: msg.id }));
          if (msg.id === 'muse') {
            enterMuseMode();
          } else {
            exitMuseMode();
          }
        }
        if (msg.type === 'muse_state') {
          setMuseState({ concepts: msg.concepts||[], arc: msg.arc||'opening', waveform: msg.waveform||'listening', ambient: msg.ambient||{intensity:.45,warmth:.45} });
        }
        if (msg.type === 'soma_status') {
          setSomaStatus({ connected: msg.connected, signalConnected: msg.signalConnected });
        }
        if (msg.type === 'edit_proposed') {
          const p = msg.proposal;
          if (p?.id && p?.path) {
            setPendingChanges(ps => ps.some(x => x.editId === p.id) ? ps : [...ps, {
              id: p.id,
              editId: p.id,
              file: p.path,
              content: p.params?.content || p.params?.newText || '',
              action: p.type,
              status: 'pending',
              msgId: p.id
            }]);
          }
        }
        if (msg.type === 'edit_applied') {
          setPendingChanges(ps => ps.map(p => p.editId === msg.id ? {...p, status:'accepted'} : p));
        }
        if (msg.type === 'edit_rejected') {
          setPendingChanges(ps => ps.map(p => p.editId === msg.id ? {...p, status:'rejected'} : p));
        }

        if (msg.type === 'token') {
          // Token streaming handled by find-and-append to the last message with that requestId
          setMessages(m => {
            const last = m[m.length-1];
            if (last && last.role === 'max' && last.requestId === msg.requestId) {
              return [...m.slice(0, -1), { ...last, text: last.text + msg.text }];
            }
            return m;
          });
        }
        if (msg.type === 'done') {
          setIsThinking(false); setStreaming(false); setThinkLabel('thinking…');
          if (msg.requestId && msg.response) {
            setMessages(m => m.map(x => x.requestId === msg.requestId ? { ...x, text: msg.response, streaming: false } : x));
          }
          // Refresh real usage from API instead of trusting potentially incomplete telemetry
          fetch(`${maxUrl}/api/usage`, { headers: authHdrs(true) }).then(r=>r.json()).then(u => {
            if (u.today) {
              const spent = parseFloat(u.today.totalCost?.replace('$','') || 0);
              setCredits(c => ({ ...c, used: parseFloat(spent.toFixed(4)) }));
            }
          }).catch(() => {});
        }
        if (msg.type === 'insight' || msg.type === 'muse_insight') {
          const insightText = msg.result || msg.text || msg.body || (typeof msg.data === 'string' ? msg.data : null);
          if (insightText && msg.type === 'insight') setInsight(insightText);
          setMuseInsights(prev=>[msg,...prev].slice(0,20));
        }
        if (msg.type === 'status') {
          setMaxStatus(s => ({ ...s, tension: msg.drive?.tension ?? s.tension }));

          };
          es.onerror=()=>setConnected(false);

    };
    tryConnect();

  // Only auto-scroll when the user is already at (or near) the bottom.

  const handleInputChange=e=>{

    if(val.startsWith('/')&&!val.includes(' ')){
      setSlashSuggestions(SLASH_CMDS.filter((c,i,a)=>c.cmd.startsWith(val.toLowerCase())&&a.findIndex(x=>x.cmd===c.cmd)===i));
      setSlashIdx(0);
    } else setSlashSuggestions([]);

    // @mention picker — trigger on @ anywhere in input
    const atMatch = val.match(/@([\w./\-]*)$/);
    if (atMatch) {
      const query = atMatch[1].toLowerCase();
      const allFiles = (realFiles || []).map(f => f.path || f.name).filter(Boolean);
      const matches = allFiles.filter(f => f.toLowerCase().includes(query)).slice(0, 8);

  const selectAtMention = (filePath) => {
    const newInput = input.replace(/@[\w./\-]*$/, '');

  };

  const handleKeyDown=e=>{
    if(atPicker?.matches?.length > 0){
      if(e.key==='ArrowDown'){e.preventDefault();setAtPickerIdx(i=>Math.min(i+1,atPicker.matches.length-1));return;}
      if(e.key==='ArrowUp'){e.preventDefault();setAtPickerIdx(i=>Math.max(i-1,0));return;}
      if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();selectAtMention(atPicker.matches[atPickerIdx]);return;}
      if(e.key==='Escape'){setAtPicker(null);return;}
    }
    if(slashSuggestions.length>0){
      if(e.key==='ArrowDown'){e.preventDefault();setSlashIdx(i=>Math.min(i+1,slashSuggestions.length-1));return;}
      if(e.key==='ArrowUp'){e.preventDefault();setSlashIdx(i=>Math.max(i-1,0));return;}
      if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();setInput(slashSuggestions[slashIdx].cmd+' ');setSlashSuggestions([]);return;}
      if(e.key==='Escape'){setSlashSuggestions([]);return;}
    }
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
  };

  const sendMessage=async(overrideText)=>{
    let text=(overrideText??input).trim();
    if(!text||isThinking) return;
    if(!overrideText) { setInput(''); }
    setSlashSuggestions([]);
    setAtPicker(null);

    // Resolve @mentions — prepend file contents as context
    const activeMentions = overrideText ? [] : mentions;
    if(activeMentions.length > 0 && connected){
      try{
        const r = await fetch(`${maxUrl}/api/mention/resolve`,{method:'POST',headers:authHdrs(),body:JSON.stringify({mentions:activeMentions})});
        const {results=[]} = await r.json();
        const ctx = results.filter(m=>m.content).map(m=>`[File: ${m.value}]\n\`\`\`\n${m.content}\n\`\`\``).join('\n\n');
        if(ctx) text = `${ctx}\n\n---\n${text}`;
      }catch{}
      setMentions([]);
    }

    // Client-side slash command interception
    if (text === '/split') {
      splitPane();
      setMessages(m => [...m, { id: nextMsgId(), role: 'max', persona: 'architect', text: '🔀 Bifurcated editor pane. New pane active.' }]);
      return;
    }
    if (text === '/close') {
      closePane(activePaneId);
      setMessages(m => [...m, { id: nextMsgId(), role: 'max', persona: 'architect', text: '✕ Closed active pane.' }]);
      return;
    }

    if(text.startsWith('/persona ')){
      const name=text.slice(9).trim().toLowerCase();
      if(PERSONAS[name]&&connected){
        try{
          await fetch(`${maxUrl}/api/persona`,{method:'POST',headers:authHdrs(),body:JSON.stringify({persona:name})});
          setMaxStatus(s=>({...s,persona:name}));
        }catch{}
        setMessages(m=>[...m,
          {id:nextMsgId(),role:'user',text},
          {id:nextMsgId(),role:'max',persona:name,modelTier:'fast',route:'local',
            text:`Switched to **${PERSONAS[name].label}** persona.`}
        ]);
        return;
      }
    }

    const { tier: activeTier, model: activeModel } = resolveModelChoice(selectedOption, text);
    const userMsgId = nextMsgId();
    setMessages(m=>[...m,{id:userMsgId,role:'user',text}]);
    const tierLabel = activeTier==='fast' ? 'asking ollama…' : activeTier==='code' ? 'asking deepseek-reasoner…' : 'asking deepseek…';
    setIsThinking(true); setThinkLabel(tierLabel);
    playMaxThink();
    if(!connected){
      setTimeout(()=>{
        setIsThinking(false);
        setMessages(m=>[...m,{id:nextMsgId(),role:'max',persona:'muse',modelTier:'fast',route:'local',
          text:`Not connected to MAX.\n\nStart it with:\n\`\`\`bash\ncd MAX && node launcher.mjs --mode api\n\`\`\`\n\nThen refresh — I'll wire up automatically at **${maxUrl}**.`}]);
      },1200);
      return;
    }
    const msgId2 = nextMsgId();
    try{
      const mode=chatMode; setChatMode(null);
      if(mode==='swarm') setThinkLabel('spinning up swarm workers…');
      else if(mode==='debate') setThinkLabel('running adversarial debate…');

      if (socketRef.current && socketRef.current.readyState === WebSocket.OPEN) {
        setStreaming(true);
        setMessages(m => [...m, { id: msgId2, role: 'max', persona: maxStatus.persona, text: '', modelTier: activeTier, route: 'ws', requestId: msgId2, streaming: true }]);
        
        socketRef.current.send(JSON.stringify({
          type: 'chat_request',
          message: text,
          requestId: msgId2,
          tier: mode==='swarm'?'code':activeTier
        }));
        // Done state and token assembly are handled by ws.onmessage
        return;
      }

      // LEGACY REST FALLBACK
      const endpoint=mode==='swarm'?'/api/swarm':mode==='debate'?'/api/debate':'/api/chat';
      const body=mode==='swarm'?{task:text}:mode==='debate'?{topic:text}:{message:text, model:activeModel, tier:activeTier};
      const r=await fetch(`${maxUrl}${endpoint}`,{method:'POST',headers:authHdrs(),body:JSON.stringify(body)});

      if(r.status===401){
        setIsThinking(false); setStreaming(false);
        setMessages(m=>[...m,{id:msgId2,role:'max',persona:'muse',modelTier:'fast',route:'local',
          text:`**API key rejected.** Open ⚙ Settings → General and paste your key from \`.max/api-key.txt\`.\n\nVisit \`${maxUrl}/maxwell\` directly to get the key auto-injected.`}]);
        return;
      }

      // swarm/debate return plain JSON; chat returns SSE — detect by content-type
      const ct = r.headers.get('content-type')||'';
      let reply='', persona=maxStatus.persona, drive=null;

      if(ct.includes('event-stream')){
        // Real SSE streaming — show tokens as they arrive
        setStreaming(true);
        const route = activeTier==='fast'?'local':'cloud';
        setMessages(m=>[...m,{id:msgId2,role:'max',persona,text:'',modelTier:activeTier,route,streaming:true}]);
        const reader=r.body.getReader(); const dec=new TextDecoder(); let buf='';
        while(true){
          const {done,value}=await reader.read(); if(done) break;
          buf+=dec.decode(value,{stream:true});
          const lines=buf.split('\n'); buf=lines.pop();
          for(const line of lines){
            if(!line.startsWith('data: ')) continue;
            try{
              const ev=JSON.parse(line.slice(6));
              if(ev.type==='token'){
                reply+=ev.text;
                setMessages(m=>m.map(msg=>msg.id===msgId2?{...msg,text:reply}:msg));
              } else if(ev.type==='done'){
                reply=ev.response||reply; persona=ev.persona||persona; drive=ev.drive;
                setMaxStatus(s=>({...s,persona,tension:drive?.tension??s.tension}));
                setMessages(m=>m.map(msg=>msg.id===msgId2?{...msg,text:reply,persona,streaming:false}:msg));
                setStreaming(false);
                // Refresh real spend after each message
                fetch(`${maxUrl}/api/usage`,{headers:authHdrs(true)}).then(r=>r.json()).then(u=>{
                  if(u.today){ const spent=parseFloat(u.today.totalCost?.replace('$','')||0); setCredits(c=>({...c,used:parseFloat(spent.toFixed(4))})); }
                }).catch(()=>{});
              } else if(ev.type==='error'){ throw new Error(ev.message); }
            }catch(pe){ if(pe.message&&!pe.message.includes('JSON')) throw pe; }
          }
        }
        setStreaming(false);
      } else {
        // Plain JSON (swarm/debate)
        const data=await r.json();
        reply=data.reply||data.response||data.result||data.synthesis||data.verdict
            ||(data.error ? `Error: ${data.error}` : null)
            ||'(no response)';
        persona=data.persona||persona;
        setMessages(m=>[...m,{id:msgId2,role:'max',persona,text:reply,modelTier:activeTier,route:activeTier==='fast'?'local':'cloud',streaming:false}]);
      }

      // Parse TOOL:file:write/replace calls — brace-counting to handle multi-line content
      const toolsFromReply=[];
      const toolPrefixRe=/TOOL:file:(write|replace):/g;
      let toolMatch2;
      while((toolMatch2=toolPrefixRe.exec(reply))!==null){
        const action=toolMatch2[1];
        const start=toolMatch2.index+toolMatch2[0].length;
        let depth=0,i=start,inStr=false,esc=false;
        for(;i<reply.length;i++){
          const c=reply[i];
          if(esc){esc=false;continue;}
          if(c==='\\'&&inStr){esc=true;continue;}
          if(c==='"'){inStr=!inStr;continue;}
          if(inStr) continue;
          if(c==='{') depth++;
          else if(c==='}'){depth--;if(depth===0){i++;break;}}
        }
        try{
          const params=JSON.parse(reply.slice(start,i));
          if(params.filePath){
            toolsFromReply.push({id:msgId2+'-'+toolsFromReply.length,file:params.filePath,
              content:params.content||'',action,status:'pending',msgId:msgId2});
          }
        }catch{}
      }
      // Also add tool chips to the message
      if(toolsFromReply.length>0){
        const toolChips=toolsFromReply.map(t=>({icon:'write',action:'file:'+t.action,label:t.file,ok:true}));
        setMessages(m=>m.map(msg=>msg.id===msgId2?{...msg,tools:toolChips}:msg));
      }
      // Choko reacts to tool calls
      if(reply.includes('TOOL:')){
        const toolMatch=reply.match(/TOOL:(\w+):(\w+)/);
        if(toolMatch){
          const reaction=getChokoReaction(toolMatch[1]+':'+toolMatch[2]);
          if(reaction&&Math.random()<0.6){
            setTimeout(()=>{setChokoTyping(true);setTimeout(()=>{setChokoTyping(false);playChokoPop();setChokoMsg(reaction);setTimeout(()=>setChokoMsg(null),6000);},1000);},800);
          }
        }
      }
      if(activeTier==='fast') setSavings(s=>({...s,local:s.local+1,totalLocal:s.totalLocal+1,totalAll:s.totalAll+1}));
      else setSavings(s=>({...s,cloud:s.cloud+1,totalAll:s.totalAll+1}));
      if(toolsFromReply.length>0) setPendingChanges(p=>[...p,...toolsFromReply]);
      fetch(`${maxUrl}/api/goals`,{headers:authHdrs(true)}).then(r=>r.json()).then(gs=>{if(Array.isArray(gs)) setGoals(gs.map(g=>({id:g.id||g._id,title:g.title,priority:g.priority||0.5})));}).catch(()=>{});
    }catch(err){
      setStreaming(false);
      setMessages(m=>[...m.filter(msg=>msg.id!==msgId2),{id:nextMsgId(),role:'max',persona:'paranoid',text:`Connection error: ${err.message}.`}]);
    }finally{ setIsThinking(false); }
  };

  const runCommand = async (cmd) => {

  // ── Problems tab — real TypeScript checker ───────────────
  const runProblemsCheck = React.useCallback(async () => {
    setProblemLines([]);
    try {
      const tscCmd = `node -e "const fs = require('fs'); const cmd = fs.existsSync('tsconfig.json') ? 'npx tsc --noEmit' : fs.existsSync('jsconfig.json') ? 'npx tsc --noEmit -p jsconfig.json --maxNodeModuleJsDepth 0' : 'echo no-config'; const cp = require('child_process'); cp.exec(cmd, (err, stdout, stderr) => { console.log(stdout || stderr); process.exit(err ? 1 : 0); })" 2>&1`;
      const r = await fetch(`${maxUrl}/api/tools/shell/run`, {
        method:'POST', headers:authHdrs(),
        body: JSON.stringify({ command: tscCmd, timeoutMs:30000 })
      });
      const d = await r.json();
      const raw = (d.stdout||d.output||d.result||d.stderr||'').trim();
      if (!raw || raw.includes('not found') || raw.includes('command not found') || raw === 'no-config') {
        setProblemLines([{type:'info',text:'No tsconfig.json or jsconfig.json found — check skipped'}]);
        setProblemCount(0); return;
      }
      const lines = raw.split('\n').filter(Boolean);
      // tsc error lines look like: src/foo.ts(12,5): error TS2345: ...
      const errRe = /^(.+)\((\d+),(\d+)\):\s*(error|warning)\s+(TS\d+):\s*(.+)$/;
      const parsed = lines.map(l => {
        const m = l.match(errRe);
        if (m) return { type: m[4]==='error'?'err':'info', file:m[1], line:m[2], col:m[3], code:m[5], msg:m[6], text:`${m[1]}:${m[2]} — ${m[6]}` };
        return { type:'out', text:l };
      });
      const errCount = parsed.filter(p=>p.type==='err').length;
      setProblemLines(parsed);
      setProblemCount(errCount);
    } catch(e) {
      setProblemLines([{type:'err',text:'Failed to run check: '+e.message}]);
